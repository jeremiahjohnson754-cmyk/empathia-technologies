<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e07-p22-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e07-p22-t">Evening at the service desk. Sam stares at his queue: Garden Room, display on the wrong input, closed eight times with the same fix — and opened again at 7:14 this morning.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg26" width="800" height="480"/><rect x="40" y="60" width="520" height="260" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="40" y="60" width="520" height="30" rx="8" fill="#0369A1"/><rect x="40" y="80" width="520" height="10" fill="#0369A1"/><text x="54" y="81" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="start" >QUEUE · GARDEN ROOM</text><text x="56" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#CBD5E1" text-anchor="start" >Display: wrong input</text><text x="56" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#FBBF24" text-anchor="start" >CLOSED ×8  (same fix)</text><text x="56" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#EF4444" text-anchor="start" >opened 07:14 today</text><use href="../defs.svg#f-sam-N-worried" x="580.0" y="196.0" width="170.0" height="272.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>