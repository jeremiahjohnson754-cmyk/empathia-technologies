<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e07-p20-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e07-p20-t">The approved Room Standard v1.0 cover page: tested with five people in three rooms. Share shows progress within about a second; controls within seated reach; loop fed by far end plus room; mic coverage checked at every seat by ear; section 3.4, two content inputs — table and wall; deferred items with owners and dates.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><g transform="rotate(0 400.0 240.0)"><rect x="140" y="30" width="520" height="420" rx="4" fill="#F8FAFC" stroke="#05070C" stroke-width="5"/><rect x="140" y="30" width="520" height="46" rx="4" fill="#DBEAFE"/><text x="158" y="61" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#1E3A8A" text-anchor="start" >ROOM STANDARD v1.0 · APPROVED</text><text x="160" y="114" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="start" >Tested with 5 people, 3 rooms</text><text x="160" y="148" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" >Share: progress within ~1 s</text><text x="160" y="182" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" >Controls within seated reach</text><text x="160" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" >Loop = far end + room</text><text x="160" y="250" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" >Mic coverage: every seat, by ear</text><text x="160" y="284" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" >3.4  Two content inputs: table + wall</text><text x="160" y="318" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#B45309" text-anchor="start" >Deferred: voice, sensors (owner, date)</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>