<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e07-p07-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e07-p07-t">System View timeline of Participant 1's four seconds: she taps at 0.0; the display changes input at 0.3; from 0.3 to 6.0 seconds it resyncs, black, with no message; she pulls the cable at 4.0. The panel said only 'Presentation Source' the whole time. The room was switching correctly; content would have appeared at 6.0 seconds.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#93C5FD" text-anchor="start" >PARTICIPANT 1 · FOUR SECONDS · ILLUSTRATIVE</text><line x1="60" y1="150" x2="760" y2="150" stroke="#475569" stroke-width="6"/><rect x="250" y="176" width="490" height="36" fill="#000" stroke="#FBBF24" stroke-width="3"/><text x="495" y="201" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="middle" >BLACK · NO PICTURE · NO MESSAGE</text><circle cx="80" cy="150" r="11" fill="#F4F1E8"/><text x="80" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F4F1E8" text-anchor="middle" >0.0 s</text><text x="80" y="246" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle" >taps it</text><circle cx="250" cy="150" r="11" fill="#22D3EE"/><text x="250" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#22D3EE" text-anchor="middle" >0.3 s</text><text x="250" y="246" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle" >input changes</text><circle cx="640" cy="150" r="11" fill="#EF4444"/><text x="640" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#EF4444" text-anchor="middle" >4.0 s</text><text x="640" y="246" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle" >pulls the cable</text><circle cx="740" cy="150" r="11" fill="#34D399"/><text x="740" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#34D399" text-anchor="middle" >6.0</text><rect x="60" y="290" width="330" height="140" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="3"/><text x="80" y="324" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#EF4444" text-anchor="start" >THE PANEL SAID</text><text x="80" y="360" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#F4F1E8" text-anchor="start" >“PRESENTATION SOURCE”</text><text x="80" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="start" >(nothing else, for 6 s)</text><rect x="410" y="290" width="340" height="140" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="430" y="324" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="start" >THE ROOM WAS</text><text x="430" y="360" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#F4F1E8" text-anchor="start" >switching correctly</text><text x="430" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="start" >content on screen at 6.0 s</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>