"/><circle cx="580" cy="124" r="18" fill="#EF4444" stroke="#05070C" stroke-width="3"/><circle cx="220" cy="346" r="18" fill="#34D399" stroke="#05070C" stroke-width="3"/><circle cx="310" cy="346" r="18" fill="#34D399" stroke="#05070C" stroke-width="3"/><circle cx="400" cy="346" r="18" fill="#34D399" stroke="#05070C" stroke-width="3"/><circle cx="490" cy="346" r="18" fill="#34D399" stroke="#05070C" stroke-width="3"/><circle cx="580" cy="346" r="18" fill="#EF4444" stroke="#05070C" stroke-width="3"/><circle cx="140" cy="235" r="18" fill="#34D399" stroke="#05070C" stroke-width="3"/><circle cx="660" cy="235" r="18" fill="#EF4444" stroke="#05070C" stroke-width="3"/><rect x="690" y="180" width="70" height="110" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="3"/><text x="725" y="240" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#94A3B8" text-anchor="middle" >SCREEN</text><g><rect x="470" y="400" width="317" height="29" rx="14" fill="#EF4444"/><text x="628.28" y="421" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#05070C" text-anchor="middle" >3 seats outside every zone</text></g><text x="40" y="448" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5" text-anchor="start" >The far end hears those seats as distant, roomy, quiet.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>