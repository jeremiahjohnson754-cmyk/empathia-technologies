<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s07e01-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s07e01-p04-t">A bar across 600 rooms: 372 green (match the template), 96 teal (recorded regional designs), 132 red (drift, no record). Below: working as designed 78%, drift 22%.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >ESTATE CONFORMANCE · SAMPLED</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#2DD4BF" text-anchor="end" >STD-2.4</text><rect x="70" y="120" width="409.2" height="70" fill="#16A34A" stroke="#0F172A" stroke-width="2"/><rect x="479.2" y="120" width="105.6" height="70" fill="#0D9488" stroke="#0F172A" stroke-width="2"/><rect x="584.8" y="120" width="145.2" height="70" fill="#DC2626" stroke="#0F172A" stroke-width="2"/><text x="70" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" >600 ROOMS</text><text x="70" y="232" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#15803D" text-anchor="start" >■ 372 match the template</text><text x="70" y="266" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#0F766E" text-anchor="start" >■ 96 recorded regional designs</text><text x="70" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#B91C1C" text-anchor="start" >■ 132 drift · no reason, no owner</text><text x="400" y="360" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#0F172A" text-anchor="middle" >working as designed: (372 + 96) ÷ 600 = 78% · drift: 22%</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>