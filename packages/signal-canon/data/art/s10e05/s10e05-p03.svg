<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e05-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e05-p03-t">A status sheet for Low Country (2016): session files won't open; drive A spins with 15 of 24 tracks per song; the scratch drive won't spin; two DVD sets, FINAL and FINAL 2, disagree; 96 of 99 files recovered and 3 unreadable; no checksums anywhere; pencil track sheets in the tape box.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >LOW COUNTRY (2016) · WHAT SURVIVED</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >AR-05</text><rect x="46" y="40" width="708" height="32" rx="4" fill="#FEE2E2"/><text x="60" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Session files</text><text x="300" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >won't open · program retired</text><rect x="46" y="78" width="708" height="32" rx="4" fill="#FEE2E2"/><text x="60" y="100" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Drive A</text><text x="300" y="100" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >spins · 15 of 24 tracks per song</text><rect x="46" y="116" width="708" height="32" rx="4" fill="#FEE2E2"/><text x="60" y="138" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Drive B (scratch)</text><text x="300" y="138" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >won't spin · 9 of 24 tracks</text><rect x="46" y="154" width="708" height="32" rx="4" fill="#FEE2E2"/><text x="60" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >DVD sets</text><text x="300" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >FINAL and FINAL 2 · disagree</text><rect x="46" y="192" width="708" height="32" rx="4" fill="#FEE2E2"/><text x="60" y="214" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >DVD reads</text><text x="300" y="214" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >96 of 99 · 3 unreadable</text><rect x="46" y="230" width="708" height="32" rx="4" fill="#FEE2E2"/><text x="60" y="252" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Checksums</text><text x="300" y="252" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >none, anywhere</text><rect x="46" y="268" width="708" height="32" rx="4" fill="#FEF3C7"/><text x="60" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Paperwork</text><text x="300" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B45309" text-anchor="start" >pencil track sheets · in the tape box</text><text x="400" y="350" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#B91C1C" text-anchor="middle" >9 of 24 tracks per song were on the dead drive (37.5%)</text><text x="400" y="376" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >no checksums: nothing proves which copy is the one that was released</text><text x="400" y="402" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-177)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>