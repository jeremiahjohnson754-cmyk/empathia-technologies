<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e05-p02-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e05-p02-t">A teaching moment: Hollis and Maya beside a board. Ten years ago. Eleven songs, twenty-four tracks each. The label wants the multitracks for a reissue by the first. The session files won't open, nine of the twenty-four tracks aren't on this drive, and we can't prove the DVDs match anything. How much are we even looking for?</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg114" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="28" font-weight="800" fill="#FDA4AF" text-anchor="middle" >WHICH ONE — AND WHY?</text><text x="400" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle" >📖 reference only</text><use href="../defs.svg#f-hollis-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>