<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e02-p13-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e02-p13-t">System View, top-down stage: the receiver antennas stand behind the LED wall's steel frame; the riser sits center; Marisol at the downstage-right lip turned upstage. The line from her to the antennas is crossed out: steel and her own body in the way. Both diversity antennas are blocked.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="30" y="45" width="740" height="390" rx="10" fill="#05070C" opacity=".88"/><text x="50" y="75" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="start" >TOP-DOWN STAGE · BEFORE · ILLUSTRATIVE, NOT A PLOT</text><rect x="90" y="105" width="620" height="260" fill="#1F2937" stroke="#475569" stroke-width="3"/><text x="400" y="390" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="middle" >AUDIENCE</text><rect x="470" y="195" width="170" height="14" fill="#9CA3AF"/><text x="555" y="189" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#CBD5E1" text-anchor="middle" >LED WALL · STEEL FRAME</text><rect x="280" y="155" width="140" height="60" fill="#374151" stroke="#6B7280" stroke-width="2"/><text x="350" y="191" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#CBD5E1" text-anchor="middle" >RISER</text><circle cx="530" cy="335" r="16" fill="#E26D5A" stroke="#05070C" stroke-width="3"/><text x="530" y="340" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#05070C" text-anchor="middle" >M</text><text x="556" y="340" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FCA5A5" text-anchor="start" >bar 30: DSR lip, turned ↑</text><rect x="537" y="122" width="36" height="36" rx="6" fill="#22D3EE"/><text x="581" y="145" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#22D3EE" text-anchor="start" >ANTENNAS (moved at load-in)</text><path d="M530 319 L555 158" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" opacity="0.5"/><path d="M530 319 L555 158" fill="none" stroke="#F4F1E8" stroke-width="1.6" class="flow" opacity=".8"/><line x1="504" y1="245" x2="556" y2="295" stroke="#EF4444" stroke-width="6"/><line x1="556" y1="245" x2="504" y2="295" stroke="#EF4444" stroke-width="6"/><text x="220" y="285" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#EF4444" text-anchor="middle" >Steel + body in the way</text><text x="220" y="311" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Both diversity antennas blocked</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>