<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e02-p24-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e02-p24-t">On the loading dock, Ben reads an email on a tablet from the Carroway, city 3: “Your requested hang point: we have no structural data for that beam.” Sofia, beside him, looks stricken.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg9" width="800" height="480"/><rect x="300" y="70" width="330" height="220" rx="14" fill="#05070C" stroke="#1F2937" stroke-width="4"/><rect x="312" y="82" width="306" height="196" rx="4" fill="#0F172A"/><text x="465" y="120" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#94A3B8" text-anchor="middle" >FROM: THE CARROWAY</text><text x="465" y="160" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F4F1E8" text-anchor="middle" >“Your requested hang point:</text><text x="465" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F4F1E8" text-anchor="middle" >we have no structural data</text><text x="465" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FBBF24" text-anchor="middle" >for that beam.”</text><use href="../defs.svg#f-ben-R-flat" x="40.0" y="180.0" width="175.0" height="280.0"/><rect x="136" y="299" width="12.2" height="16.6" rx="1.8" fill="#D4A94A" stroke="#05070C" stroke-width="1.4"/><line x1="138.9" y1="306.0" x2="145.9" y2="306.0" stroke="#7C5A1E" stroke-width="1.2"/><use href="../defs.svg#f-sofia-S-worried" x="592.0" y="190.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>