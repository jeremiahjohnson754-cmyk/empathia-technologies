<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e02-p12-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e02-p12-t">System View graph: channel 7's received signal at six positions along Marisol's path. Everywhere well above the noise floor, except the downstage-right lip turned upstage, where it sinks to the noise floor.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="30" y="45" width="740" height="390" rx="10" fill="#05070C" opacity=".88"/><text x="50" y="77" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="start" >CH 7 SIGNAL ALONG HER PATH · BEFORE · ILLUSTRATIVE</text><line x1="120" y1="345" x2="740" y2="345" stroke="#8FA3BE" stroke-width="2"/><line x1="120" y1="115" x2="120" y2="345" stroke="#8FA3BE" stroke-width="2"/><line x1="120" y1="305" x2="740" y2="305" stroke="#EF4444" stroke-width="3" stroke-dasharray="10 6"/><text x="736" y="297" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FCA5A5" text-anchor="end" >NOISE FLOOR</text><text x="160.0" y="367" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >US centre</text><text x="268.0" y="367" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >riser</text><text x="376.0" y="367" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >DS centre</text><text x="484.0" y="367" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >DSR</text><text x="592.0" y="367" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >DSR lip ↺</text><text x="700.0" y="367" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >back to centre</text><polyline points="160,155 268,165 376,155 484,185 592,275 700,160" fill="none" stroke="#22D3EE" stroke-width="5"/><circle cx="160" cy="155" r="6" fill="#22D3EE"/><circle cx="268" cy="165" r="6" fill="#22D3EE"/><circle cx="376" cy="155" r="6" fill="#22D3EE"/><circle cx="484" cy="185" r="6" fill="#22D3EE"/><circle cx="592" cy="275" r="6" fill="#22D3EE"/><circle cx="700" cy="160" r="6" fill="#22D3EE"/><text x="80" y="230.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8FA3BE" text-anchor="middle" transform="rotate(-90 80 230.0)">signal</text><text x="400" y="413" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#EF4444" text-anchor="middle" >At the lip, turned upstage: signal sinks to the noise → drop</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>