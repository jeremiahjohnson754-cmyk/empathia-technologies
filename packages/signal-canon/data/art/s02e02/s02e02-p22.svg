<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e02-p22-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e02-p22-t">Maya's phone: a text from Leah — the manager says the song stays; also, who fixed it?</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg8" width="800" height="480"/><g><rect x="330" y="110" width="140" height="240" rx="17" fill="#05070C"/><rect x="337" y="124" width="126" height="211" rx="8" fill="#0F1A2C"/><text x="400" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#CBD5E1" text-anchor="middle" >Leah:</text><text x="400" y="228" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >Manager says</text><text x="400" y="250" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle" >the song stays.</text><text x="400" y="272" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F4F1E8" text-anchor="middle" >Also: “who fixed it?”</text></g><use href="../defs.svg#f-maya-N-smile" x="60.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>