<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e02-p23-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e02-p23-t">RF log, channel 7: drops at song 11, bar 32, three shows. Scan clean; batteries cleared. Cause: antennas behind the LED frame, moved for the riser, not logged. Fix: downstage wing stand, Ben signed. Walk test before and after: solid. Rule: load-in changes near RF go in the log.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="150" y="30" width="500" height="420" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="80" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#05070C" text-anchor="middle" >RF LOG · CH 7</text><text x="180" y="132" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Drops: song 11, bar 32, 3 shows.</text><text x="180" y="172" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Scan clean. Batteries cleared.</text><text x="180" y="218" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >Cause: antennas behind LED frame</text><text x="180" y="250" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >(moved for riser, not logged).</text><text x="180" y="296" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Fix: DS wing stand — Ben signed.</text><text x="180" y="336" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Walk test before/after: solid.</text><text x="180" y="382" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Rule: load-in changes near RF → log.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>