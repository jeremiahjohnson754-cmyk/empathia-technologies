<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e02-p10-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e02-p10-t">System View with two cancellers: after canceller number one, the software's canceller number two, switched back on, sees an already-cleaned signal, keeps re-learning, and leaks bursts of the far end back. The fix: one canceller, nearest the mics, with the true reference.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · HARBOR ROOM AUDIO · ILLUSTRATIVE</text><rect x="40" y="80" width="170" height="64" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="125.0" y="106.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="middle" >FAR END</text><text x="125.0" y="130.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Helen's voice in</text><rect x="300" y="80" width="200" height="64" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="3"/><text x="400.0" y="106.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#22D3EE" text-anchor="middle" >ROOM PROCESSOR</text><text x="400.0" y="130.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >keeps a copy = reference</text><rect x="600" y="80" width="160" height="64" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="680.0" y="118.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="middle" >LOUDSPEAKERS</text><path d="M210 112 L300 112" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M210 112 L300 112" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><path d="M500 112 L600 112" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M500 112 L600 112" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="668" y="205" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="end" >room reflects</text><path d="M680 144 C680 200 680 220 680 250" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M680 144 C680 200 680 220 680 250" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="600" y="250" width="160" height="60" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="680.0" y="274.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="middle" >CEILING MICS</text><text x="680.0" y="298.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >voices + echo</text><rect x="300" y="250" width="200" height="60" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="400.0" y="274.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle" >CANCELLER #1</text><text x="400.0" y="298.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >reference − prediction</text><path d="M600 280 L500 280" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M600 280 L500 280" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><path d="M400 144 L400 250" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M400 144 L400 250" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="470" y="206" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#C084FC" text-anchor="middle" >reference</text><rect x="40" y="250" width="200" height="60" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3"/><text x="140.0" y="274.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F87171" text-anchor="middle" >CANCELLER #2</text><text x="140.0" y="298.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >software · back ON</text><path d="M300 280 L240 280" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M300 280 L240 280" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><path d="M140 250 L140 144" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M140 250 L140 144" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="400" y="360" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F87171" text-anchor="middle" >#2 sees a signal #1 already cleaned, keeps re-learning,</text><text x="400" y="386" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F87171" text-anchor="middle" >and leaks bursts of the far end back to it.</text><text x="400" y="430" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#34D399" text-anchor="middle" >Fix: ONE canceller — nearest the mics, with the true reference.</text></g><rect width="800" 