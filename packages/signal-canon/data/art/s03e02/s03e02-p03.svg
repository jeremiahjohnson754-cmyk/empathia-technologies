<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e02-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e02-p03-t">Maya reads Helen's email on Tom's screen, copied to legal: she heard her own voice played back seconds late, wants to know who was recording and why; same room, 2 p.m.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="80" y="60" width="500" height="280" rx="6" fill="#05070C" stroke="#1F2937" stroke-width="5"/><rect x="88" y="68" width="484" height="264" fill="#0F172A"/><text x="102" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="start" >FROM: H. VOSS · TO: TOM · CC: LEGAL</text><text x="102" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="start" >On Tuesday's call I heard my own voice</text><text x="102" y="180" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="start" >played back to me, seconds late.</text><text x="102" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="start" >I want to know who was recording,</text><text x="102" y="256" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="start" >and why. Same room, 2 p.m.</text><use href="../defs.svg#f-maya-R-worried" x="498.0" y="200.0" width="168.8" height="270.0"/><g><rect x="620" y="424" width="77" height="30" rx="15" fill="#0F172A"/><text x="658.6" y="446" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F87171" text-anchor="middle" >13:06</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>