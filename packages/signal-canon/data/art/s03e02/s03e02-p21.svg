<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e02-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e02-p21-t">Change log entry 2: Harbor, far end heard itself; Sunday 02:04 update turned the software canceller on; profile turns software canceller and noise suppression off so the processor does both, surviving updates; proof from the far end on cellular in silence and double-talk at 13:41; post-update checklist gains an echo test; Helen's room was their echo, solved with a headset.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="130" y="24" width="540" height="432" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="72" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#05070C" text-anchor="middle" >ROOMS · CHANGE LOG</text><text x="160" y="124" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >#2  Harbor: far end heard itself.</text><text x="160" y="158" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Sun 02:04 update → software AEC on.</text><text x="160" y="204" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Profile: software AEC + NS off;</text><text x="160" y="238" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >processor does both. Survives updates.</text><text x="160" y="284" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Proof: far end, cellular, silence +</text><text x="160" y="318" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >double-talk. 13:41.</text><text x="160" y="364" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >Post-update checklist: echo test.</text><text x="160" y="410" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Helen's room: THEIR echo. Headset.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>