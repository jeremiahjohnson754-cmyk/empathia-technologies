<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e04-p19-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e04-p19-t">A teaching moment: Ray and Maya beside a board. Evidence is what you saw or measured, written down before you touch anything. A change record is evidence about what somebody changed. And a label? A label is evidence left for the next person. Worked example: 'MIC 3 → IN 7 · lectern · don't repatch — R.' What it is, where it goes, why it's there.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B111C"/><use href="../defs.svg#p-rack" x="40" y="60" width="150" height="290" /><use href="../defs.svg#p-rack" x="600" y="60" width="150" height="290" /><use href="../defs.svg#p-patch" x="240" y="110" width="320" height="60" /><rect x="0" y="380" width="800" height="100" fill="#141B28"/><rect x="330" y="0" width="140" height="30" fill="#F4F1E8" opacity=".06"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" >LABEL = what · where · why</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#A7F3D0" text-anchor="middle" >MIC 3 → IN 7 · lectern · ask R.</text><use href="../defs.svg#f-ray-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>