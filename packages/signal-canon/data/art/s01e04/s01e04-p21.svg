<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e04-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e04-p21-t">Imani's new one-page checklist: plan the patch in writing; print labels for both ends; log it before you leave; press every preset after; compare to the photos.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg1" width="800" height="480"/><rect x="420" y="40" width="340" height="400" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="590" y="88" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#05070C" text-anchor="middle" >BEFORE ANYONE TOUCHES</text><text x="590" y="114" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#05070C" text-anchor="middle" >THE RACK</text><text x="450" y="170" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >☐ Plan the patch (write it)</text><text x="450" y="226" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >☐ Print labels, both ends</text><text x="450" y="282" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >☐ Log it before you leave</text><text x="450" y="338" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >☐ Press every preset after</text><text x="450" y="394" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" f