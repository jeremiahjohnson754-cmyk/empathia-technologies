<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e04-p08-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e04-p08-t">A teaching moment: Maya and June beside a board. Vera wants one number for the board. Percent equals part over whole, times a hundred. Part is the twelve minutes. Whole is the bulletin. Work it out — then we make it zero.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg55" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" >% = part ÷ whole × 100</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#A7F3D0" text-anchor="middle" >part = minutes lost · whole = bulletin</text><use href="../defs.svg#f-maya-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-june-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>