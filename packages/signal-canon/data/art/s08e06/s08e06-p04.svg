<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s08e06-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s08e06-p04-t">The fabric sheet after the fix: VLAN 60 with the controller and the decoders on 4.1; VLAN 61 with the update tool and one batch of 20; VLAN 70 with the lighting console and nodes, as drawn; all 400 decoders green on 4.1; the path 3.8 to 4.0 to 4.1, 9 batches times 2 hops times 6 minutes, 108 minutes; every batch verified and the firmware register signed.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >AV-OVER-IP FABRIC · FIRMWARE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#CA8A04" text-anchor="end" >T-801</text><rect x="60" y="70" width="240" height="40" rx="6" fill="#16A34A"/><text x="180" y="97" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" >VLAN 60 · AV-PROD</text><text x="320" y="97" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="start" >controller + 220 decoders (4.1)</text><rect x="60" y="128" width="240" height="40" rx="6" fill="#0EA5E9"/><text x="180" y="155" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" >VLAN 61 · AV-STAGE</text><text x="320" y="155" font-family="Work Sa