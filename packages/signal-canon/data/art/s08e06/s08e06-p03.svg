<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s08e06-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s08e06-p03-t">A fabric sheet before the fix: VLAN 60 carries the controller, all 400 decoders and the lighting; VLAN 61 not built; VLAN 70 empty since fit-out; a bar of 400 decoders, 220 green on 4.1 and 180 red on 3.8, 45%; the spec line ‘current firmware at delivery’, no version named, nobody checked at receiving.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >AV-OVER-IP FABRIC · FIRMWARE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#CA8A04" text-anchor="end" >T-801</text><rect x="60" y="70" width="240" height="40" rx="6" fill="#16A34A"/><text x="180" y="97" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" >VLAN 60 · AV-PROD</text><text x="320" y="97" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="start" >controller + 400 decoders + LIGHTING</text><rect x="60" y="128" width="240" height="40" rx="6" fill="#0EA5E9"/><text x="180" y="155" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" >VLAN 61 · AV-STAGE</text><text x="320" y="155" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="start" >— not built —</text><rect x="60" y="186" width="240" height="40" rx="6" fill="#A855F7"/><text x="180" y="213" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" >VLAN 70 · LIGHTING</text><text x="320" y="213" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="start" >— empty since fit-out —</text><text x="60" y="252" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#475569" text-anchor="start" >decoders by firmware (of 400)</text><rect x="60" y="262" width="352" height="30" fill="#16A34A"/><text x="236.0" y="283" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" >220 · 4.1</text><rect x="412" y="262" width="288" height="30" fill="#DC2626"/><text x="556.0" y="283" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" >180 · 3.8 · 45%</text><text x="400" y="340" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#B91C1C" text-anchor="middle" >spec: ‘current firmware at delivery’</text><text x="400" y="376" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#B91C1C" text-anchor="middle" >no version named · nobody checked at receiving</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>