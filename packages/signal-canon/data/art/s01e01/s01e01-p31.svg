<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e01-p31-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e01-p31-t">Maya's measurements after the re-aim: the ten seats' deep notches are gone; four side seats are still covered; the balcony front is noticeably weaker than before. She writes it down rather than hiding it.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><g><rect x="40" y="50" width="506" height="36" rx="18" fill="#05070C"/><text x="292.8" y="78" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#34D399" text-anchor="middle" >✓ Ten seats: deep notches gone</text></g><g><rect x="40" y="110" width="538" height="36" rx="18" fill="#05070C"/><text x="309.12" y="138" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#34D399" text-anchor="middle" >✓ Four side seats: still covered</text></g><g><rect x="40" y="170" width="587" height="36" rx="18" fill="#05070C"/><text x="333.6" y="198" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FBBF24" text-anchor="middle" >▮ Balcony front: weaker than before</text></g><use href="../defs.svg#f-maya-R-flat" x="520.0" y="190.0" width="175.0" height="280.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>