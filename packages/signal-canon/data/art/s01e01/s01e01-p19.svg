<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e01-p19-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e01-p19-t">The whiteboard numbers: delta L about 1.7 meters; delta t equals delta L over c, about 1.7 meters divided by 343 meters per second, about 4.96 milliseconds; first notch near 101 hertz, then every 202 hertz; seat 12, delta L about 1.4 meters, notches near 123 hertz and every 245 hertz. Illustrative geometry.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#1A2233"/><rect x="40" y="30" width="720" height="400" rx="10" fill="#F4F6F8" stroke="#05070C" stroke-width="6"/><text x="80" y="110" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="38" font-weight="700" fill="#0B1220" text-anchor="start" >ΔL ≈ 1.7 m</text><text x="80" y="170" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#0B1220" text-anchor="start" >Δt = ΔL / c ≈ 1.7 m ÷ 343 m/s ≈ 4.96 ms</text><text x="80" y="230" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#DC2626" text-anchor="start" >1st notch ≈ 101 Hz, then every ≈ 202 Hz</text><text x="80" y="290" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#475569" text-anchor="start" >seat 12: ΔL ≈ 1.4 m → 123 Hz, every 245 Hz</text><text x="80" y="350" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#64748B" text-anchor="start" >(illustrative geometry)</text><use href="../defs.svg#f-maya-P-talk" x="620.0" y="274.0" width="125.0" height="200.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>