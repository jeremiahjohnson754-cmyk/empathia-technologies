<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e01-p14-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e01-p14-t">Four small panels, one per test: the microphone — the same recording is clean in every other seat, contradicted; Dolores's hearing — Maya hears it too, so it isn't only Dolores, contradicted as the cause of the room problem; air handling — switched off and on, no change, contradicted; the room — fill alone clear, mains alone clear, both together hollow, suspected.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect x="30" y="30" width="360" height="200" rx="8" fill="#0F1A2C" stroke="#F4F1E8" stroke-width="3"/><text x="210" y="90" font-family="Work Sans, system-ui, sans-serif" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" font-family="Bangers, Impact, sans-serif">THE MIC</text><text x="210" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#CBD5E1" text-anchor="middle" >clean in every other seat</text><text x="210" y="190" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#F87171" text-anchor="middle" >✕ CONTRADICTED</text><rect x="410" y="30" width="360" height="200" rx="8" fill="#0F1A2C" stroke="#F4F1E8" stroke-width="3"/><text x="590" y="90" font-family="Work Sans, system-ui, sans-serif" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" font-family="Bangers, Impact, sans-serif">HER HEARING</text><text x="590" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Maya hears it too</text><text x="590" y="190" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#F87171" text-anchor="middle" >✕ CONTRADICTED</text><rect x="30" y="245" width="360" height="200" rx="8" fill="#0F1A2C" stroke="#F4F1E8" stroke-width="3"/><text x="210" y="305" font-family="Work Sans, system-ui, sans-serif" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" font-family="Bangers, Impact, sans-serif">AIR HANDLING</text><text x="210" y="345" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#CBD5E1" text-anchor="middle" >off, on: no change</text><text x="210" y="405" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#F87171" text-anchor="middle" >✕ CONTRADICTED</text><rect x="410" y="245" width="360" height="200" rx="8" fill="#0F1A2C" stroke="#F4F1E8" stroke-width="3"/><text x="590" y="305" font-family="Work Sans, system-ui, sans-serif" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" font-family="Bangers, Impact, sans-serif">THE ROOM</text><text x="590" y="345" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#CBD5E1" text-anchor="middle" >fill + mains together: hollow</text><text x="590" y="405" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FBBF24" text-anchor="middle" >? SUSPECTED</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>