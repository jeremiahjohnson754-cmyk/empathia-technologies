<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e01-p37-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e01-p37-t">Late on a Tuesday, Priya and Maya run a controlled test: the overflow encoder, now on its own small switch, is plugged back into the old booth switch for sixty seconds. The receive rate jumps and the test stream drops audio; unplugged, it recovers.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg1" width="800" height="480"/><use href="../defs.svg#p-switch" x="520" y="380" width="200" height="60" /><use href="../defs.svg#p-box" x="560" y="320" width="110" height="55" /><use href="../defs.svg#f-priya-P-grin" x="100.0" y="180.0" width="175.0" height="280.0"/><use href="../defs.svg#f-maya-N-surprised" x="320.0" y="200.0" width="162.5" height="260.0"/><rect x="540" y="80" width="220" height="150" rx="6" fill="#0B1220" stroke="#8FA3BE" stroke-width="3"/><polyline points="555,210 590,205 620,200 640,110 680,120 700,205 740,208" fill="none" stroke="#EF4444" stroke-width="5"/><text x="650" y="100" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F4F1E8" text-anchor="middle" >60 s test</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>