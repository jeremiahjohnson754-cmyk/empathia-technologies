<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e03-p20-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e03-p20-t">Change log entry 3: Studio camera left after ten idle minutes because of image v4's USB suspend; profile v4.1 disables suspend and selects the camera by type, idle test twice with the far end confirming; fourteen rooms share the extender with 37 tickets closed as user error, now reopened; Rhea told; sticker replaced; thanks to Rhea's notebook and Priya's port log.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="130" y="24" width="540" height="432" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="72" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#05070C" text-anchor="middle" >ROOMS · CHANGE LOG</text><text x="160" y="124" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >#3  Studio: camera leaves after</text><text x="160" y="158" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >10 idle min (image v4 USB suspend).</text><text x="160" y="204" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Profile v4.1: no suspend; camera</text><text x="160" y="238" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >by type. Idle test ×2, far end ✓.</text><text x="160" y="284" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >14 rooms same extender: 37 tickets</text><text x="160" y="318" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >closed “user error”. Reopened.</text><text x="160" y="364" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Rhea: told. Sticker: replaced.</text><text x="160" y="410" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Thanks: Rhea's notebook, Priya's port.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>