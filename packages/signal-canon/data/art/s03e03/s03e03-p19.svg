<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e03-p19-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e03-p19-t">Priya shows a ticket search: camera tickets in rooms with the same extender — fourteen rooms plus the Studio Room, 37 tickets, every one resolved as user error. Sam closes his eyes.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg26" width="800" height="480"/><rect x="210" y="40" width="380" height="190" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><text x="226" y="74" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#93C5FD" text-anchor="start" >“camera” tickets · same extender</text><text x="226" y="103" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" >Rooms: 14 (+ Studio)</text><text x="226" y="132" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" >Tickets: 37</text><text x="226" y="161" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#F87171" text-anchor="start" >Resolution: USER ERROR ×37</text><use href="../defs.svg#f-priya-P-flat" x="60.0" y="190.0" width="175.0" height="280.0"/><use href="../defs.svg#f-sam-N-closed" x="580.0" y="190.0" width="175.0" height="280.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>