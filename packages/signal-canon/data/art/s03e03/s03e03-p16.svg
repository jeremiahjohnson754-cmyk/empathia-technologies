<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e03-p16-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e03-p16-t">System View: the camera at the display connects through a powered extender and 25 metres of cable to the room computer. The computer's power plan suspends idle USB after ten minutes; the wake-up doesn't pass cleanly through the extender; the camera re-enumerates as a new instance; the conferencing software still looks for the old one and reports no camera. Replugging the table hub re-enumerates everything and the camera is found again.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · STUDIO ROOM CAMERA · ILLUSTRATIVE</text><rect x="40" y="80" width="150" height="70" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="115.0" y="109.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="middle" >CAMERA</text><text x="115.0" y="133.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >at the display</text><rect x="240" y="80" width="170" height="70" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="325.0" y="109.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle" >EXTENDER (TX)</text><text x="325.0" y="133.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >powered by switch port</text><rect x="460" y="80" width="150" height="70" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="535.0" y="109.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="middle" >EXTENDER (RX)</text><text x="535.0" y="133.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >in the credenza</text><rect x="630" y="80" width="130" height="70" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="695.0" y="109.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="middle" >ROOM PC</text><text x="695.0" y="133.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >USB port</text><path d="M190 115 L240 115" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M190 115 L240 115" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><path d="M410 115 L460 115" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M410 115 L460 115" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="435" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#22D3EE" text-anchor="middle" stroke="#05070C" stroke-width="3" paint-order="stroke">25 m cable</text><path d="M610 115 L630 115" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M610 115 L630 115" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="325" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >Priya: port never dropped ✓</text><rect x="520" y="230" width="240" height="70" rx="10" fill="#1F1A05" stroke="#FBBF24" stroke-width="3"/><text x="640.0" y="259.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FBBF24" text-anchor="middle" >POWER PLAN (image v4)</text><text x="640.0" y="283.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >idle 10 min → suspend USB</text><path d="M695 150 L695 230" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M695 150 L695 230" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="260" y="230" width="230" height="70" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3"/><text x="375.0" y="259.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F87171" text-anchor="middle" >WAKE-UP</text><text x="375.0" y="283.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >doesn't pass cleanly →</text><path d="M520 265 L490 265" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M520 265 L490 265" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="40" y="230" width="190" height="70" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3"/><text x="135.0" y="259.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F87171" text-anchor="middle" >RE-ENUMERATE</text><text x="135.0" y="283.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >a NEW camera instance</text><path d="M260 265 L230 265" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M260 265 L230 265" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="40" y="340" width="330" height="70" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3"/><text x="205.0" y="369.0" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F87171" text-anchor="middle" >CONFERENCING SOFTWARE</text><text x="205.0" y="393.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >still looking for the OLD one → “no camera”</text><path d="M135 300 L135 340" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M135 300 L135 340" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="580" y="362" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Rhea replugs the table hub →</text><text x="580" y="386" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="middle" >everything re-enumerates →</text><text x="580" y="410" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >camera found again</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>