<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e03-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e03-p04-t">The peak meter on a master-control screen: news peaks at minus 6, the PSA at minus 9. By this meter the PSA is quieter. Tess frowns.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg55" width="800" height="480"/><rect x="150" y="60" width="500" height="240" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><rect x="150" y="60" width="500" height="40" rx="8" fill="#1E293B"/><text x="166" y="87" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FDA4AF" text-anchor="start" >PEAK METER</text><text x="166" y="130" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="19" font-weight="700" fill="#94A3B8" text-anchor="start" >PEAK (last break)</text><text x="166" y="161" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="19" font-weight="700" fill="#E2E8F0" text-anchor="start" >news:  −6 dBFS</text><text x="166" y="192" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="19" font-weight="700" fill="#34D399" text-anchor="start" >PSA:   −9 dBFS</text><text x="166" y="223" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="19" font-weight="700" fill="#34D399" text-anchor="start" >“PSA is QUIETER”</text><use href="../defs.svg#f-tess-N-worried" x="630.0" y="220.0" width="156.2" height="250.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>