<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e05-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e05-p04-t">Wes's diff of v6 against v7: better capture gain and mic EQ, marked with ticks — and the echo canceller's reference changed from the far-end receive to the program bus, marked with a cross.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="30" width="740" height="330" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><text x="46" y="64" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="28" font-weight="700" fill="#94A3B8" text-anchor="start" >DIFF · HYBRID v6 → v7</text><text x="46" y="104" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="28" font-weight="700" fill="#34D399" text-anchor="start" >capture gain   −6 → −2 dB   ✓</text><text x="46" y="144" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="28" font-weight="700" fill="#34D399" text-anchor="start" >mic EQ         flat → speech ✓</text><text x="46" y="184" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="28" font-weight="700" fill="#E2E8F0" text-anchor="start" >AEC reference  FAR-END RX</text><text x="46" y="224" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="28" font-weight="700" fill="#F87171" text-anchor="start" >           →   PROGRAM BUS  ✗</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>