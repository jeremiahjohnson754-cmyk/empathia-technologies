<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e06-p07-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e06-p07-t">Maya underlines a line on the whiteboard: the panel shows what the controller believes, not what the room is. Sam's arms go up.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="215" y="50" width="370" height="230" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="6"/><rect x="235" y="280" width="330" height="8" fill="#94A3B8"/><text x="235" y="90" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="31" font-weight="700" fill="#1D4ED8" text-anchor="start" >THE PANEL SHOWS…</text><text x="237" y="128" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="27" font-weight="700" fill="#0F172A" text-anchor="start" >what the controller</text><text x="237" y="167" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="27" font-weight="700" fill="#DC2626" text-anchor="start" >BELIEVES —</text><text x="237" y="206" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="27" font-weight="700" fill="#0F172A" text-anchor="start" >not what the room IS.</text><use href="../defs.svg#f-maya-P-talk" x="40.0" y="200.0" width="167.5" height="268.0"/><use href="../defs.svg#f-sam-S-surprised" x="580.0" y="200.0" width="167.5" height="268.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>