<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e06-p12-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e06-p12-t">System View timeline of one second at 14:00. The calendar's WAKE fires at plus 0.2 seconds; the sweep's SHUTDOWN at plus 0.6. The state variable goes from ON to OFF. The display stays on, ignoring 'off' while warming; the codec stays in the call, refusing standby. The panel switches to SYSTEM OFF. A note: pressing Start now would run WAKE, whose first step hangs up the call.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#C084FC" text-anchor="start" >14:00 · TWO EVENTS, ONE SECOND · ILLUSTRATIVE</text><line x1="250" y1="92" x2="250" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/><text x="250" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="middle" >14:00:00</text><line x1="400" y1="92" x2="400" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/><text x="400" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="middle" >+0.2 s</text><line x1="520" y1="92" x2="520" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/><text x="520" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="middle" >+0.6 s</text><line x1="680" y1="92" x2="680" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/><text x="680" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="middle" >+2.6 s</text><text x="36" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#34D399" text-anchor="start" >WAKE (calendar)</text><text x="36" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#EF4444" text-anchor="start" >SWEEP</text><text x="36" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#C084FC" text-anchor="start" >STATE VARIABLE</text><text x="36" y="276" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="start" >DISPLAY</text><text x="36" y="326" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#22D3EE" text-anchor="start" >CODEC</text><text x="36" y="376" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#F4F1E8" text-anchor="start" >PANEL SHOWS</text><rect x="400" y="104" width="130" height="30" rx="6" fill="#34D399"/><text x="465" y="125" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#05070C" text-anchor="middle" >WAKE</text><rect x="520" y="154" width="170" height="30" rx="6" fill="#EF4444"/><text x="605" y="175" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#05070C" text-anchor="middle" >SHUTDOWN</text><path d="M250 220 L520 220 L520 206 L760 206" fill="none" stroke="#C084FC" stroke-width="5"/><text x="380" y="212" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#C084FC" text-anchor="middle" >IN CALL</text><text x="640" y="198" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#EF4444" text-anchor="middle" >OFF</text><line x1="250" y1="270" x2="760" y2="270" stroke="#FBBF24" stroke-width="5"/><text x="600" y="262" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >ON · “off” ignored</text><line x1="250" y1="320" x2="760" y2="320" stroke="#22D3EE" stroke-width="5"/><text x="600" y="312" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="middle" >IN CALL · no standby</text><rect x="250" y="354" width="270" height="32" rx="4" fill="#1E293B"/><text x="385" y="376" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F4F1E8" text-anchor="middle" >IN CALL</text><rect x="520" y="354" width="240" height="32" rx="4" fill="#7F1D1D"/><text x="640" y="376" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FECACA" text-anchor="middle" >SYSTEM OFF (a lie)</text><text x="36" y="434" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5" text-anchor="start" >Press Start now → WAKE → step 1 “reset: hang up” → call drops.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>