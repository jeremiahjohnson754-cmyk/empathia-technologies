<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e06-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e06-p21-t">Test results for change CR-0614 on a monitor: fourteen transitions, all passing — six with a live call across the boundary, four occupied without a call, two empty, two with a simulated nine-second late push. Panel matched device feedback fourteen of fourteen. No calls dropped.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg26" width="800" height="480"/><rect x="30" y="30" width="740" height="340" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="30" y="30" width="740" height="30" rx="8" fill="#047857"/><rect x="30" y="50" width="740" height="10" fill="#047857"/><text x="44" y="51" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="start" >CEDAR · CR-0614 · TEST RESULTS</text><text x="46" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#CBD5E1" text-anchor="start" >Transitions tested ........ 14</text><text x="46" y="119" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" >Live call over boundary ... 6 / 6</text><text x="46" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" >Occupied, no call ......... 4 / 4</text><text x="46" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" >Empty room ................ 2 / 2</text><text x="46" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" >Late push (+9 s, sim.) .... 2 / 2</text><text x="46" y="251" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" >Panel = device feedback .. 14 / 14</text><text x="46" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" >Calls dropped ............. 0</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>