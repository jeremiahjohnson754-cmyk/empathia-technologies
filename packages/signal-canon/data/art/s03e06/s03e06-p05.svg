<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e06-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e06-p05-t">At a whiteboard near the service desk, Maya has started drawing a row of words connected by arrows. Sam, arms open, is half joking.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="225" y="50" width="350" height="230" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="6"/><rect x="245" y="280" width="310" height="8" fill="#94A3B8"/><text x="245" y="90" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#1D4ED8" text-anchor="start" >HOW IT THINKS</text><text x="247" y="128" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start" >OFF → WARMING</text><text x="247" y="166" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start" >→ READY → IN CALL</text><text x="247" y="204" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#0F172A" text-anchor="start" >→ COOLING → OFF</text><use href="../defs.svg#f-sam-W-talk" x="40.0" y="200.0" width="167.5" height="268.0"/><use href="../defs.svg#f-maya-P-smile" x="580.0" y="200.0" width="167.5" height="268.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>