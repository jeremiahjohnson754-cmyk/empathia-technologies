<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e06-p06-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e06-p06-t">System View: the Cedar Room drawn as a state machine. OFF, WARMING, READY, IN CALL and COOLING are connected by arrows labeled with events. A red dashed arrow labeled SWEEP runs from IN CALL straight to OFF with no guard. A note says the panel shows the state variable, not the devices.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#C084FC" text-anchor="start" >CEDAR ROOM · STATE MACHINE · ILLUSTRATIVE</text><rect x="40" y="90" width="150" height="70" rx="14" fill="#111827" stroke="#94A3B8" stroke-width="4"/><text x="115.0" y="132.0" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#94A3B8" text-anchor="middle" >OFF</text><rect x="235" y="90" width="150" height="70" rx="14" fill="#111827" stroke="#FBBF24" stroke-width="4"/><text x="310.0" y="132.0" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#FBBF24" text-anchor="middle" >WARMING</text><rect x="430" y="90" width="150" height="70" rx="14" fill="#111827" stroke="#34D399" stroke-width="4"/><text x="505.0" y="132.0" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#34D399" text-anchor="middle" >READY</text><rect x="610" y="90" width="150" height="70" rx="14" fill="#111827" stroke="#22D3EE" stroke-width="4"/><text x="685.0" y="132.0" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#22D3EE" text-anchor="middle" >IN CALL</text><rect x="430" y="270" width="150" height="70" rx="14" fill="#111827" stroke="#FBBF24" stroke-width="4"/><text x="505.0" y="312.0" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#FBBF24" text-anchor="middle" >COOLING</text><line x1="190" y1="125" x2="225.0" y2="125.0" stroke="#F4F1E8" stroke-width="4"/><polygon points="233,125 220.4,131.1 220.4,118.9" fill="#F4F1E8"/><line x1="385" y1="125" x2="420.0" y2="125.0" stroke="#F4F1E8" stroke-width="4"/><polygon points="428,125 415.4,131.1 415.4,118.9" fill="#F4F1E8"/><line x1="580" y1="118" x2="600.0" y2="118.0" stroke="#F4F1E8" stroke-width="4"/><polygon points="608,118 595.4,124.1 595.4,111.9" fill="#F4F1E8"/><line x1="608" y1="140" x2="590.0" y2="140.0" stroke="#F4F1E8" stroke-width="4"/><polygon points="582,140 594.6,133.9 594.6,146.1" fill="#F4F1E8"/><line x1="505" y1="162" x2="505.0" y2="260.0" stroke="#F4F1E8" stroke-width="4"/><polygon points="505,268 498.9,255.4 511.1,255.4" fill="#F4F1E8"/><line x1="430" y1="305" x2="126.0" y2="305.0" stroke="#F4F1E8" stroke-width="4"/><polygon points="118,305 130.6,298.9 130.6,311.1" fill="#F4F1E8"/><line x1="115" y1="305" x2="115.0" y2="172.0" stroke="#F4F1E8" stroke-width="4"/><polygon points="115,164 121.1,176.6 108.9,176.6" fill="#F4F1E8"/><text x="212" y="198" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="middle" >Start / booking</text><text x="407" y="82" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle" >ready</text><text x="700" y="184" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="middle" >call on / off</text><text x="518" y="230" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="start" >End / booking ends</text><path d="M690 162 C690 420 120 430 110 166" fill="none" stroke="#EF4444" stroke-width="5" stroke-dasharray="10 8"/><polygon points="110,164 101,182 119,182" fill="#EF4444"/><g><rect x="220" y="384" width="467" height="29" rx="14" fill="#EF4444"/><text x="453.42" y="405" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#05070C" text-anchor="middle" >SWEEP (new): ANY STATE → OFF · no guard</text></g><text x="40" y="446" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5" text-anchor="start" >The panel shows the variable — not the display, not the call.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>