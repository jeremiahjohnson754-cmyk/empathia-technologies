<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e06-p08-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e06-p08-t">The controller's event log on a monitor. At 14:00:00.18 a booking-start event runs WAKE. At 14:00:00.61 a booking-end sweep runs SHUTDOWN and sets the state to OFF. The display ignores the off command while warming; the codec refuses standby in a call. No button press since 13:58.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg26" width="800" height="480"/><rect x="30" y="30" width="740" height="330" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="30" y="30" width="740" height="30" rx="8" fill="#6D28D9"/><rect x="30" y="50" width="740" height="10" fill="#6D28D9"/><text x="44" y="51" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="start" >CEDAR · CONTROLLER EVENT LOG · READ-ONLY</text><text x="46" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#CBD5E1" text-anchor="start" >13:58:40.0  Start pressed → WAKE</text><text x="46" y="113" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#CBD5E1" text-anchor="start" >13:59:31.8  call connected → IN CALL</text><text x="46" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#34D399" text-anchor="start" >14:00:00.2  booking start → WAKE</text><text x="46" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#EF4444" text-anchor="start" >14:00:00.6  booking-end sweep → SHUTDOWN</text><text x="46" y="203" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#EF4444" text-anchor="start" >14:00:00.6  state = OFF · panel: SYSTEM OFF</text><text x="46" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#FBBF24" text-anchor="start" >14:00:02.6  display: “off” ignored (warming)</text><text x="46" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#22D3EE" text-anchor="start" >14:00:02.7  codec: standby refused (in call)</text><text x="46" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#F4F1E8" text-anchor="start" >no button press since 13:58:40</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>