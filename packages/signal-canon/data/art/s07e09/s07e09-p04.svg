<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s07e09-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s07e09-p04-t">The standard sheet for v3: a bar of 80 testable requirements — 64 kept, 16 added (intelligibility, join time, captions, named accounts); preferences moved to guidance and variants to approved annexes; every exception owned and dated; a change board.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >ROOM STANDARD · v3</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#2DD4BF" text-anchor="end" >STD-3</text><rect x="70.0" y="110" width="528.0" height="64" fill="#16A34A" stroke="#0F172A" stroke-width="2"/><rect x="598.0" y="110" width="132.0" height="64" fill="#22C55E" stroke="#0F172A" stroke-width="2"/><text x="70" y="212" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#16A34A" text-anchor="start" >■ 64 kept</text><text x="300" y="212" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#22C55E" text-anchor="start" >■ 16 added</text><text x="70" y="96" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" >80 TESTABLE REQUIREMENTS</text><text x="400" y="268" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#15803D" text-anchor="middle" >added: speech intelligibility · join time · captions · named accounts</text><text x="400" y="304" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle" >preferences → guidance · variants → approved annexes</text><text x="400" y="340" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#15803D" text-anchor="middle" >register: every exception owned and dated · change board</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>