<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e03-p19-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e03-p19-t">Show report, city 3: beam has no data, modified 2019. Kim: no approval without a rating. Ground truss, Ben's plan, Kim checked. Pipe 4: house load, small margin. Cost: halo lower, two units cut, three extra crew hours, rental. Open: venue to send drawings.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="150" y="30" width="500" height="420" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="80" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#05070C" text-anchor="middle" >SHOW REPORT · CITY 3</text><text x="180" y="128" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Beam: no data (modified 2019).</text><text x="180" y="166" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Kim: no approval w/o rating.</text><text x="180" y="212" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Ground truss — Ben plan, Kim ✓.</text><text x="180" y="250" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Pipe 4: house load, small margin.</text><text x="180" y="296" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B4530