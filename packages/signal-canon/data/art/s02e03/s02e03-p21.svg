<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e03-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e03-p21-t">The next day, 2:00 p.m., the Meridian in city 4. On the lighting console's screen: RECOMMENDED UPDATE available — install now? Two buttons, INSTALL and LATER. Sofia stands beside it, alone.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg10" width="800" height="480"/><rect x="190" y="80" width="420" height="230" rx="10" fill="#0F172A" stroke="#F97316" stroke-width="5"/><text x="400" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#94A3B8" text-anchor="middle" >LIGHTING CONSOLE</text><text x="400" y="180" font-family="Work Sans, system-ui, sans-serif" font-size="26" font-weight="800" fill="#FBBF24" text-anchor="middle" >RECOMMENDED UPDATE</text><text x="400" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F4F1E8" text-anchor="middle" >available · install now?</text><rect x="250" y="246" width="130" height="44" rx="8" fill="#F97316"/><text x="315" y="275" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#05070C" text-anchor="middle" >INSTALL</text><rect x="420" y="246" width="130" height="44" rx="8" fill="#334155"/><text x="485" y="275" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#F4F1E8" text-anchor="middle" >LATER</text><use href="../defs.svg#f-sofia-N-flat" x="600.0" y="200.0" width="150.0" height="240.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>