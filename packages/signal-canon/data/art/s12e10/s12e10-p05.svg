<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s12e10-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s12e10-p05-t">A table of the town hall from 13:30 to 14:40: 13:35 primary encoder fails — Pim, RB-07, warm backup (E04); 13:45 EMEA template wiped — monitoring hears it, Noor restores DR-07 (E05, E06); 13:55 CEO's office wants firmware — Galen says not without a ticket (E03); 14:01 twenty-two rooms without captions — prevented, captions already everywhere (E09); 14:15 certificate expires — Sabine finds it in the records (E01, E05). Five of five held without Maya.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >TOWN HALL · 13:30–14:40 · WHAT HELD WITHOUT MAYA</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#334155" text-anchor="end" >IN-10</text><text x="56" y="58" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#475569" text-anchor="start" >time</text><text x="110" y="58" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#475569" text-anchor="start" >threat</text><text x="372" y="58" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#475569" text-anchor="start" >held by</text><text x="744" y="58" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#47556