<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s09e07-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s09e07-p03-t">A network sheet before the fix: one large pink box, VLAN 1 DEFAULT, 212 of 340 ports, holding control, the DSP, the jump host, the signage server, forty players and the vendor landing; everything can reach everything; commissioning left it flat to get it working.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >AV NETWORK · SEGMENTS & ALLOWED FLOWS</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#DB2777" text-anchor="end" >NET-07</text><rect x="80" y="70" width="640" height="200" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="3"/><text x="400" y="102" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="900" fill="#9D174D" text-anchor="middle" >VLAN 1 · DEFAULT · 212 of 340 ports (62%)</text><rect x="120" y="140" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#9D174D" stroke-width="2"/><text x="200" y="168" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" >control</text><rect x="320" y="140" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#9D174D" stroke-width="2"/><text x="400" y="168" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" >DSP</text><rect x="520" y="140" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#9D174D" stroke-width="2"/><text x="600" y="168" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" >jump host</text><rect x="120" y="210" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#9D174D" stroke-width="2"/><text x="200" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" >signage server</text><rect x="320" y="210" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#9D174D" stroke-width="2"/><text x="400" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" >players ×40</text><rect x="520" y="210" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#9D174D" stroke-width="2"/><text x="600" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" >vendor landing</text><text x="400" y="310" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="900" fill="#B91C1C" text-anchor="middle" >everything can reach everything</text><text x="400" y="350" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="middle" >commissioning left it flat ‘to get it working’</text><text x="400" y="390" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >paging and guest were split in S09E04 · illustrative (RV-172)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>