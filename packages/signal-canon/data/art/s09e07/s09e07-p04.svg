<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s09e07-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s09e07-p04-t">The network sheet after the fix: three boxes — CONTROL 40 with control, DSP and jump host; SIGNAGE 50 with the server and forty players; VENDOR 95 with the landing and the jump host's vendor side — joined by two short pink links; allowed flows listed: show mode from control to players on one port, vendor to jump host, jump host to control, and time; show mode rehearsed at doors.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >AV NETWORK · SEGMENTS & ALLOWED FLOWS</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#DB2777" text-anchor="end" >NET-07</text><rect x="80" y="70" width="200" height="190" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="4"/><text x="180" y="100" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#0EA5E9" text-anchor="middle" >CONTROL 40</text><rect x="100" y="116" width="160" height="34" rx="6" fill="#0EA5E9" opacity=".15"/><text x="180" y="139" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >control</text><rect x="100" y="160" width="160" height="34" rx="6" fill="#0EA5E9" opacity=".15"/><text x="180" y="183" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >DSP</text><rect x="100" y="204" width="160" height="34" rx="6" fill="#0EA5E9" opacity=".15"/><text x="180" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >jump host</text><rect x="300" y="70" width="200" height="190" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><text x="400" y="100" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#16A34A" text-anchor="middle" >SIGNAGE 50</text><rect x="320" y="116" width="160" height="34" rx="6" fill="#16A34A" opacity=".15"/><text x="400" y="139" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >server</text><rect x="320" y="160" width="160" height="34" rx="6" fill="#16A34A" opacity=".15"/><text x="400" y="183" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >players ×40</text><rect x="520" y="70" width="200" height="190" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4"/><text x="620" y="100" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#F59E0B" text-anchor="middle" >VENDOR 95</text><rect x="540" y="116" width="160" height="34" rx="6" fill="#F59E0B" opacity=".15"/><text x="620" y="139" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >landing</text><rect x="540" y="160" width="160" height="34" rx="6" fill="#F59E0B" opacity=".15"/><text x="620" y="183" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >→ jump host only</text><path d="M280 150 L300 150" stroke="#DB2777" stroke-width="5"/><text x="400" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="middle" >allowed: show mode (control → players, one port) · time</text><text x="400" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="middle" >vendor landing → jump host → control · everything else blocked</text><text x="400" y="350" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#15803D" text-anchor="middle" >show mode now crosses as one owned rule · rehearsed at doors</text><text x="400" y="390" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >paging and guest were split in S09E04 · illustrative (RV-172)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>