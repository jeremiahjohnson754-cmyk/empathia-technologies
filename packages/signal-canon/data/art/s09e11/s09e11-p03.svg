<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s09e11-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s09e11-p03-t">A second clock inside the same run. Sunday afternoon: Odile (director of operations), Solveig (head of security) and Raffa (IT director, the network owner). They meet the board on Monday at nine. A budget chip reads the client's number.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg108" width="800" height="480"/><rect x="6" y="6" width="788" height="468" rx="10" fill="none" stroke="#FBBF24" stroke-width="10" opacity=".85"/><use href="../defs.svg#f-tamsin-N-flat" x="80.0" y="190.0" width="175.0" height="280.0"/><use href="../defs.svg#f-maya-W-flat" x="520.0" y="200.0" width="168.8" height="270.0"/><g><rect x="250" y="36" width="178" height="29" rx="14" fill="#05070C"/><text x="338.92" y="57" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FDE68A" text-anchor="middle" >BUDGET $92,000</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>