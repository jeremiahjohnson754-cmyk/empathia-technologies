<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e04-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e04-p03-t">Tomas's switch shows its PoE log in a read-only view: at 16:00:04 the budget was exceeded and ports 21–24 — the microphones, priority LOW — were shed; they came back at 16:03 and were shed again at 16:06. Draw: 490 W of 370.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="30" width="740" height="360" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><text x="46" y="64" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="26" font-weight="700" fill="#94A3B8" text-anchor="start" >SWITCH AV-2F · PoE LOG</text><text x="46" y="102" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="26" font-weight="700" fill="#F87171" text-anchor="start" >16:00:04  budget exceeded</text><text x="46" y="140" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="26" font-weight="700" fill="#F87171" text-anchor="start" >          shed ports 21–24 (LOW)</text><text x="46" y="178" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="26" font-weight="700" fill="#FBBF24" text-anchor="start" >16:03:10  ports 21–24 up · budget exceeded</text><text x="46" y="216" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="26" font-weight="700" fill="#F87171" text-anchor="start" >16:06:12  shed ports 21–24 (LOW)</text><text x="46" y="254" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="26" font-weight="700" fill="#FCA5A5" text-anchor="start" >draw now: 490 W  of  370 W</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width