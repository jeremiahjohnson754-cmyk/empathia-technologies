<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s11e02-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s11e02-p04-t">A schematic: carrier A in red and carrier B in purple approach the Sable River from different directions, meet and run together through one black conduit on the Mill Road bridge for 400 metres, then split again to the EOC; a dashed green line marks a funded, separate licensed microwave path to the hilltop.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >TWO CARRIERS · ONE BRIDGE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="end" >NW-03</text><path d="M60 250 Q400 300 740 240" stroke="#38BDF8" stroke-width="40" fill="none" opacity=".35"/><text x="400" y="322" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#0369A1" text-anchor="middle" >the Sable River</text><rect x="330" y="200" width="140" height="22" fill="#94A3B8"/><text x="400" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle" >Mill Road bridge</text><path d="M80 110 C200 110 260 205 335 210" stroke="#DC2626" stroke-width="5" fill="none"/><path d="M80 150 C200 150 260 215 335 214" stroke="#7C3AED" stroke-width="5" fill="none"/><path d="M335 212 L465 212" stroke="#0F172A" stroke-width="12"/><tex