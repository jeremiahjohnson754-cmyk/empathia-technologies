" >radio & video</text><rect x="150.0" y="80" width="217.5" height="22" fill="#16A34A"/><rect x="367.5" y="80" width="72.5" height="22" fill="#DC2626"/><rect x="150.0" y="126" width="232.0" height="22" fill="#16A34A"/><rect x="382.0" y="126" width="58.0" height="22" fill="#0EA5E9"/><rect x="150.0" y="172" width="217.5" height="22" fill="#16A34A"/><rect x="367.5" y="172" width="130.5" height="22" fill="#DC2626"/><rect x="440.0" y="80" width="217.5" height="22" fill="#16A34A"/><rect x="657.5" y="80" width="72.5" height="22" fill="#DC2626"/><rect x="440.0" y="126" width="232.0" height="22" fill="#16A34A"/><rect x="672.0" y="126" width="58.0" height="22" fill="#0EA5E9"/><rect x="498.0" y="172" width="159.5" height="22" fill="#16A34A"/><rect x="657.5" y="172" width="72.5" height="22" fill="#DC2626"/><text x="150" y="50" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="start" >green: up · red: down or dropped · blue: on carrier B</text><text x="400" y="298" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#B91C1C" text-anchor="middle" >every minute: 3 s undetected + two 12 s session rebuilds = 27 s lost (45%)</text><text x="400" y="324" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >detect: 3 × 1 s heartbeats · fail back: the instant A answers</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-183)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>