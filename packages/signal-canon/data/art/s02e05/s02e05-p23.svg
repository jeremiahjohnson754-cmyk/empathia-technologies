<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e05-p23-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e05-p23-t">In-ear template version 2: author M., date, valid for theaters and the festival truck. Presenter IFB is a mix-minus: never their own voice through any return. Every return labeled with its delay; unknown delay means not in an ear. Before doors: live-talker test.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="150" y="30" width="500" height="420" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="80" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#05070C" text-anchor="middle" >IN-EAR TEMPLATE v2</text><text x="180" y="128" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >Author: M. · date · valid for:</text><text x="180" y="162" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >  theaters + festival truck</text><text x="180" y="208" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >Presenter IFB = MIX-MINUS.</text><text x="180" y="242" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >  Never own voice via ANY return.</text><text x="180" y="288" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" >Every return labeled w/ its delay.</text><text x="180" y="322" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" >Unknown delay → not in an ear.</text><text x="180" y="368" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >Before doors: live-talker test.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>