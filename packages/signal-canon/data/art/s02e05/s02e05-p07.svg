<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e05-p07-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e05-p07-t">A teaching moment: Dante and Maya beside a board. Latency is delay a stage adds. Sample rate is how many times a second the desk measures the sound. A mix-minus is everything except your own voice. The desk shows delay in samples. I think in milliseconds. Samples equal time times sample rate. Half a second at forty-eight thousand: twenty-four thousand samples. Work backwards the same way.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg11" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" >N = t × f_s</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#A7F3D0" text-anchor="middle" >0.5 s × 48,000 = 24,000</text><use href="../defs.svg#f-dante-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>