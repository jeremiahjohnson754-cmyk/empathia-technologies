<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e07-p13-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e07-p13-t">Standard version 1.1, section 5.3: room devices get reserved addresses outside the automatic range. Why: a fixed address inside the range is a fuse — Riverbend at 1 a.m., Aldermoor on Monday at 7. Owner: Sam, PRB-0412. Signed M.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="130" y="24" width="540" height="432" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="72" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#05070C" text-anchor="middle" >ROOM STANDARD v1.1</text><text x="160" y="130" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#0B1220" text-anchor="start" >§5.3 Room devices:</text><text x="160" y="170" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#047857" text-anchor="start" >reserved addresses,</text><text x="160" y="210" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#047857" text-anchor="start" >OUTSIDE the automatic range.</text><text x="160" y="270" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#B45309" text-anchor="start" >Why: a fixed address inside</text><text x="160" y="304" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#B45309" text-anchor="start" >the range is a fuse (Riverbend,</tex