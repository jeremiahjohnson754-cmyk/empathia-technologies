<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e07-p02-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e07-p02-t">Flashback. A paper napkin on a truck desk, two years ago: ours DHCP off; gear .240 to .249, in THEIR pool, double exclamation marks; fix with site lead at seven.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg11" width="800" height="480"/><g transform="rotate(-6 400 250)"><rect x="250" y="150" width="300" height="200" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/><text x="270" y="200" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#0B1220" text-anchor="start" >ours DHCP off</text><text x="270" y="240" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#0B1220" text-anchor="start" >gear .240–.249</text><text x="270" y="280" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="start" >(in THEIR pool!!)</text><text x="270" y="320" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#0B1220" text-anchor="start" >fix w/ site lead @ 7</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>