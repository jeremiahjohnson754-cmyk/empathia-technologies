<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e07-p06-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e07-p06-t">System View of the room network: the automatic range widened from .200 to .250 now covers section 5.3's fixed block .240 to .249, so laptops are offered room controllers' addresses and both collide.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".92"/><text x="40" y="52" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · ROOMS AV · 10.60.20.0/24 · ILLUSTRATIVE</text><rect x="60" y="120" width="680" height="40" fill="#1E293B" stroke="#475569" stroke-width="2"/><rect x="84" y="120" width="645" height="40" fill="#1E3A8A" opacity=".8"/><text x="400" y="146" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#BFDBFE" text-anchor="middle" >AUTOMATIC RANGE .10 – .250 (widened from .200)</text><rect x="702" y="110" width="24" height="60" fill="#7F1D1D" stroke="#F87171" stroke-width="3"/><text x="715.8102766798419" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F87171" text-anchor="middle" >§5.3: .240–.249</text><text x="715.8102766798419" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F87171" text-anchor="middle" >CONFLICTS ✕</text><text x="400" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Before the weekend: range ended at .200 — the fuse was there, unlit.</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Saturday: range widened to .250 (reviewed, logged).</text><text x="400" y="330" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >Monday 7:00: laptops are offered .240–.249. Rooms and laptops collide.</text><text x="400" y="390" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FDE68A" text-anchor="middle" >Safe: fixed devices OUTSIDE the range, or RESERVED in it.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>