<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s11e06-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s11e06-p04-t">The briefing sheet after the fix: the stream picture wider, the interpreter fully in frame beside the podium; every checklist row green — English on audio 1, the Spanish interpreter on audio 2, the interpreter in every shot, captions verbatim, the partner feed at −24 LUFS, audio delayed 200 ms.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >17:00 BRIEFING · WHO CAN FOLLOW IT</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="end" >AC-06</text><rect x="96" y="56" width="272" height="153" fill="#1E3A5F" stroke="#0F172A" stroke-width="3"/><rect x="202.0" y="118" width="60" height="91" fill="#334155"/><circle cx="232.0" cy="106" r="14" fill="#CBD5E1"/><circle cx="140" cy="120" r="12" fill="#A78BFA"/><rect x="126" y="134" width="28" height="56" fill="#7C3AED"/><text x="232.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle" >wider preset · interpreter in frame</text><rect x="386" y="46" width="368" height="30" rx="4" fill="#DCFCE7"/><text x="398" y="68" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="start" >Audio 1</text><text x="500" y="68" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="start" >English</text><rect x="386" y="80" width="368" height="30" rx="4" fill="#DCFCE7"/><text x="398" y="102" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="start" >Audio 2</text><text x="500" y="102" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="start" >Spanish interpreter</text><rect x="386" y="114" width="368" height="30" rx="4" fill="#DCFCE7"/><text x="398" y="136" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="start" >Interpreter</text><text x="500" y="136" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="start" >in every shot</text><rect x="386" y="148" width="368" height="30" rx="4" fill="#DCFCE7"/><text x="398" y="170" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="start" >Captions</text><text x="500" y="170" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="start" >verbatim</text><rect x="386" y="182" width="368" height="30" rx="4" fill="#DCFCE7"/><text x="398" y="204" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="start" >Partner feed</text><text x="500" y="204" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="start" >−24 LUFS</text><rect x="386" y="216" width="368" height="30" rx="4" fill="#DCFCE7"/><text x="398" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="start" >Lip sync</text><text x="500" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="start" >audio delayed 200 ms</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#15803D" text-anchor="middle" >everyone the briefing is for can follow it — checked before every briefing</text><text x="400" y="328" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >G = −24 − (−14) = −10 dB · D = 200 − 0 = 200 ms</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-183)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>