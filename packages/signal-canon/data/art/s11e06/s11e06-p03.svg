ll="#FEE2E2"/><text x="398" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="start" >Lip sync</text><text x="500" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="start" >video 200 ms behind audio</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#B91C1C" text-anchor="middle" >four ways the briefing shut people out</text><text x="400" y="328" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >G = −24 − (−14) = −10 dB · D = 200 − 0 = 200 ms</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-183)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>