<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e05-p17-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e05-p17-t">The first exception register: EXC-001, Boardroom on 30 — owner unknown, investigate; why exception unknown; review in two weeks; on the dashboard. EXC-002 Exec Huddle through EXC-011 Visitor Briefing. At the bottom, Imani's note: Unknown is an answer. Blank is a trap.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="120" y="30" width="560" height="420" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="76" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#05070C" text-anchor="middle" >EXCEPTION REGISTER · v0.1</text><text x="150" y="128" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#0B1220" text-anchor="start" >EXC-001  Boardroom (30)</text><text x="150" y="162" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="700" fill="#B45309" text-anchor="start" >Owner: UNKNOWN — investigate</text><text x="150" y="196" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="700" fill="#B45309" text-anchor="start" >Why exception: unknown</text><text x="150" y="230" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="700" fill="#047857" text-anchor="start" >Review: 2 weeks · on dashboard ✓</text><text x="150" y="284" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="700" fill="#0B1220" text-anchor="start" >EXC-002  Exec Huddle (30) …</text><text x="150" y="318" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="700" fill="#0B1220" text-anchor="start" >… EXC-011  Visitor Briefing (1)</text><text x="150" y="380" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#047857" text-anchor="start" >“Unknown” is an answer.</text><text x="150" y="414" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#047857" text-anchor="start" >Blank is a trap. — I.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>