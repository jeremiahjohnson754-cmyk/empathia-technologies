<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e05-p12-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e05-p12-t">System View: the inventory of 289 rooms feeds a poller that pings each controller and a dashboard with one tile per room; failed polls keep their last color. Eleven exception rooms are not in the inventory, so they get no tile, never go red and are skipped by every fleet fix. Tickets and call logs feed a user-outcome metric: meetings that started clean within two minutes.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="52" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · WHERE “GREEN” COMES FROM · ILLUSTRATIVE</text><rect x="40" y="80" width="190" height="70" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="135.0" y="109.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#93C5FD" text-anchor="middle" >INVENTORY</text><text x="135.0" y="132.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >289 rooms</text><rect x="300" y="80" width="190" height="70" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="3"/><text x="395.0" y="109.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#C084FC" text-anchor="middle" >POLLER</text><text x="395.0" y="132.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >ping each controller</text><rect x="560" y="80" width="190" height="70" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="655.0" y="109.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >DASHBOARD</text><text x="655.0" y="132.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >one tile per room</text><path d="M230 115 L300 115" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M230 115 L300 115" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><path d="M490 115 L560 115" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M490 115 L560 115" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="395" y="184" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >poll fails → tile keeps its LAST color (stale)</text><rect x="40" y="220" width="190" height="70" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3"/><text x="135.0" y="249.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#F87171" text-anchor="middle" >11 EXCEPTION ROOMS</text><text x="135.0" y="272.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >not in inventory</text><text x="135" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F87171" text-anchor="middle" >no tile · never red</text><text x="135" y="336" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F87171" text-anchor="middle" >skipped by every fleet fix</text><rect x="300" y="220" width="190" height="70" rx="10" fill="#1F1A05" stroke="#FBBF24" stroke-width="3"/><text x="395.0" y="249.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >TICKETS</text><text x="395.0" y="272.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >people who told us</text><rect x="560" y="220" width="190" height="70" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="3"/><text x="655.0" y="249.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="middle" >CALL LOGS</text><text x="655.0" y="272.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >every meeting's start</text><rect x="270" y="360" width="490" height="64" rx="10" fill="#052E1B" stroke="#34D399" stroke-width="3"/><text x="515.0" y="398.0" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle" >USER OUTCOME: meetings started clean within 2 min</text><path d="M395 290 L450 360" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M395 290 L450 360" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><path d="M655 290 L600 360" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.95"/><path d="M655 290 L600 360" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="40" y="390" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >Green = a box</text><text x="40" y="410" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >answered. Not: a</text><text x="40" y="430" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >meeting worked.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>