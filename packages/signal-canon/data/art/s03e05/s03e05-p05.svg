<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e05-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e05-p05-t">Three boxes — dashboard snapshots every five minutes, tickets people reported, call logs of every meeting's start — over the words: last Monday, 8:00 to 10:00, one bounded window, three independent sources.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0F172A"/><rect x="40" y="80" width="220" height="200" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="150.0" y="174.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >SNAPSHOTS</text><text x="150.0" y="197.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >dashboard, every 5 min</text><rect x="290" y="80" width="220" height="200" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="3"/><text x="400.0" y="174.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >TICKETS</text><text x="400.0" y="197.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >what people reported</text><rect x="540" y="80" width="220" height="200" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="3"/><text x="650.0" y="174.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="middle" >CALL LOGS</text><text x="650.0" y="197.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >every meeting's start</text><text x="400" y="340" font-family="Work Sans, system-ui, sans-serif" font-size="30" font-weight="800" fill="#F8FAFC" text-anchor="middle" >LAST MONDAY · 8:00–10:00</text><text x="400" y="380" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="middle" >one bounded window, three independent sources</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>