<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e05-p06-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e05-p06-t">Nora's join of tickets to tiles for Monday 8–10: seventeen tickets; zero on a red tile; eleven on a green tile; six from rooms with no tile at all.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="230" y="50" width="510" height="290" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="230" y="50" width="510" height="40" rx="8" fill="#1E293B"/><text x="246" y="77" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="start" >JOIN · TICKETS × TILES</text><text x="246" y="120" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="21" font-weight="700" fill="#93C5FD" text-anchor="start" >MON 8–10 · 17 tickets</text><text x="246" y="153" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="21" font-weight="700" fill="#E2E8F0" text-anchor="start" >on a RED tile:        0</text><text x="246" y="186" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="21" font-weight="700" fill="#FBBF24" text-anchor="start" >on a GREEN tile:      11</text><text x="246" y="219" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="21" font-weight="700" fill="#F87171" text-anchor="start" >room has NO tile:     6</text><use href="../defs.svg#f-nora-W-talk" x="30.0" y="190.0" width="175.0" height="280.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>