<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e05-p07-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e05-p07-t">The poller's rules: green if the controller answers a ping within five minutes; if a poll fails, keep the last state. Maya throws up her hands.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0F172A"/><rect x="190" y="50" width="420" height="220" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="190" y="50" width="420" height="40" rx="8" fill="#1E293B"/><text x="206" y="77" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="start" >POLLER · RULES</text><text x="206" y="120" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="20" font-weight="700" fill="#34D399" text-anchor="start" >GREEN if controller answers</text><text x="206" y="152" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="20" font-weight="700" fill="#34D399" text-anchor="start" >a ping within 5 min</text><text x="206" y="184" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="20" font-weight="700" fill="#FBBF24" text-anchor="start" >If poll fails: keep last state</text><use href="../defs.svg#f-maya-S-surprised" x="40.0" y="220.0" width="156.2" height="250.0"/><use href="../defs.svg#f-nora-N-flat" x="600.0" y="210.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>