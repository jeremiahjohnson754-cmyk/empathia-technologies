<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e08-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e08-p03-t">A share-log sheet: the link let anyone download; it pointed at the whole folder, eleven mixes and nine vocal stems; open 16 days; 38 downloads; 11 addresses, 3 of them named; and a contract rider asking for all raw vocal takes, including for voice modelling, not agreed. Below, eleven boxes for the addresses: three green, eight red.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >ROUGH MIXES · WHO HAD IT</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >CU-08</text><rect x="46" y="46" width="708" height="34" rx="4" fill="#FEE2E2"/><text x="60" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Link type</text><text x="250" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >anyone with the link · can download</text><rect x="46" y="88" width="708" height="34" rx="4" fill="#FEE2E2"/><text x="60" y="112" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Pointed at</text><text x="250" y="112" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >the whole folder — 11 mixes + 9 vocal stems</text><rect x="46" y="130" width="708" height="34" rx="4" fill="#FEE2E2"/><text x="60" y="154" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Open for</text><text x="250" y="154" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >16 days</text><rect x="46" y="172" width="708" height="34" rx="4" fill="#FEE2E2"/><text x="60" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Downloads</text><text x="250" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >38</text><rect x="46" y="214" width="708" height="34" rx="4" fill="#FEE2E2"/><text x="60" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Addresses</text><text x="250" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >11 — the studio can name 3 (27%)</text><rect x="46" y="256" width="708" height="34" rx="4" fill="#FEE2E2"/><text x="60" y="280" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Rider</text><text x="250" y="280" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#B91C1C" text-anchor="start" >‘all raw vocal takes … voice modelling’ — not agreed</text><text x="60" y="344" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="start" >addresses</text><rect x="250" y="330" width="32" height="20" rx="4" fill="#16A34A"/><rect x="290" y="330" width="32" height="20" rx="4" fill="#16A34A"/><rect x="330" y="330" width="32" height="20" rx="4" fill=