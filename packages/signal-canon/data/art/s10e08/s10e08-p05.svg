<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e08-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e08-p05-t">The share-log sheet rewritten as a custody policy: old link disabled and its log kept for the label's lawyers; review links only for named people, view-only, expiring in seven days; watermarked review copies; raw takes stay in the building; a consent log of Esme's written yes or no per use; every share checked monthly.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >ROUGH MIXES · WHO HAD IT</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >CU-08</text><rect x="46" y="46" width="708" height="34" rx="4" fill="#DCFCE7"/><text x="60" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Old link</text><text x="250" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="start" >disabled · access log kept for the label's lawyers</text><rect x="46" y="88" width="708" height="34" rx="4" fill="#DCFCE7"/><text x="60" y="112" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Review links</text><text x="250" y="112" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="start" >named people · view-only · expire in 7 days</text><rect x="46" y="130" width="708" height="34" rx="4" fill="#DCFCE7"/><text x="60" y="154" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Review copies</text><text x="250" y="154" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="start" >watermarked to the person</text><rect x="46" y="172" width="708" height="34" rx="4" fill="#DCFCE7"/><text x="60" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Raw takes</text><text x="250" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="start" >stay in the building</text><rect x="46" y="214" width="708" height="34" rx="4" fill="#DCFCE7"/><text x="60" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Consent log</text><text x="250" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="start" >Esme's written yes or no, per use</text><rect x="46" y="256" width="708" height="34" rx="4" fill="#DCFCE7"/><text x="60" y="280" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Share check</text><text x="250" y="280" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803D" text-anchor="start" >every share, monthly · first one clean</text><text x="400" y="350" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#15803D" text-anchor="middle" >her performance, her yes — written down, per use</text><text x="400" y="402" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >not legal advice (RV-179) · figures illustrative (RV-177)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>