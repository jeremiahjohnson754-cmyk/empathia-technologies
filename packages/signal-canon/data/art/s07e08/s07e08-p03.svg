<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s07e08-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s07e08-p03-t">A teaching moment: Maya and Adaeze beside a board. Three languages, three stream tracks. What must each track carry? One language each — the floor on one, each booth on its own. Three at a hundred and twenty-eight kilobits is three hundred and eighty-four. And track one feeds the captions. If track one carries two languages, so do the captions.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg94" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="96" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="52" font-weight="800" fill="#FDE68A" text-anchor="middle" >ƒ ?</text><text x="400" y="156" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#94A3B8" text-anchor="middle" >on request</text><use href="../defs.svg#f-maya-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-adaeze-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>