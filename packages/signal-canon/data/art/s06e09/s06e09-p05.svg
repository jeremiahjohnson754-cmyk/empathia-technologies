<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s06e09-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s06e09-p05-t">A teaching moment: Priya and Maya beside a board. A ratio is one cost over another. Fixing a line on a drawing is one; fixing it on site is about ten; fixing it after people move in, about a hundred. So the port map error costs a hundred times what it would have in design. Rule of thumb, not a law. But it's why we check drawings against the building.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg81" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" >ratio = A ÷ B</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="15" font-weight="700" fill="#A7F3D0" text-anchor="middle" >design : site : occupied ≈ 1 : 10 : 100 (rule of thumb)</text><use href="../defs.svg#f-priya-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>