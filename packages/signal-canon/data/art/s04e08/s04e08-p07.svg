<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e08-p07-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e08-p07-t">Quinn's timeline on a screen: a fake reset email at 4:28; at 4:31 a producer forwards it to all staff saying don't click this; eleven people opened the forward; at 4:52 the newsdesk login was entered on the fake page.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg57" width="800" height="480"/><rect x="120" y="50" width="560" height="260" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><rect x="120" y="50" width="560" height="40" rx="8" fill="#1E293B"/><text x="136" y="77" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FDA4AF" text-anchor="start" >SECURITY TIMELINE (QUINN)</text><text x="136" y="120" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#94A3B8" text-anchor="start" >04:28  'Reset your newsroom password'</text><text x="136" y="149" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" >04:31  FWD to ALL STAFF:</text><text x="136" y="178" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" >        “DON'T CLICK THIS!!”</text><text x="136" y="207" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#F87171" text-anchor="start" >04:33–05:02  11 people opened the forward</text><text x="136" y="236" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#F87171" text-anchor="start" >04:52  newsdesk login entered</text><use href="../defs.svg#f-maya-L-worried" x="600.0" y="292.0" width="156.2" height="250.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>