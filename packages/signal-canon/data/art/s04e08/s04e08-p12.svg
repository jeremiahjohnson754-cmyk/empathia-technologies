<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e08-p12-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e08-p12-t">Lena's phone buzzes between them: a calendar invite from the board. Hub decision, fifteen minutes, Friday. Engineering: optional.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg2" width="800" height="480"/><g><rect x="280" y="60" width="240" height="360" rx="29" fill="#05070C"/><rect x="292" y="82" width="216" height="317" rx="14" fill="#0F1A2C"/><text x="400" y="120" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#94A3B8" text-anchor="middle" >Board · calendar</text><text x="400" y="170" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC" text-anchor="middle" >HUB DECISION</text><text x="400" y="205" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle" >15 min · Friday</text><text x="400" y="250" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" text-anchor="middle" >Engineering:</text><text x="400" y="280" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FBBF24" text-anchor="middle" >OPTIONAL</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>