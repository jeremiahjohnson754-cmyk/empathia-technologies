<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e08-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e08-p03-t">System View at 5:45: the newsroom segment is locked; its rundown system needs the shared 'newsdesk' login used by 22 people, captured at 4:52. The playout segment — playout, master control, a standalone prompter with an approved offline copy — has its own named accounts and is walled off.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".92"/><text x="40" y="52" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · STATION NETWORK · 5:45 A.M. · ILLUSTRATIVE</text><rect x="40" y="70" width="330" height="330" rx="12" fill="#1F0A0A" stroke="#F87171" stroke-width="3" stroke-dasharray="8 6"/><text x="205" y="96" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F87171" text-anchor="middle" >NEWSROOM · LOCKED</text><rect x="430" y="70" width="330" height="330" rx="12" fill="#052E1B" stroke="#34D399" stroke-width="3" stroke-dasharray="8 6"/><text x="595" y="96" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle" >PLAYOUT · ON AIR</text><rect x="60" y="130" width="290" height="56" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3" data-dg="1"/><text x="205.0" y="152.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#F87171" text-anchor="middle" >RUNDOWN SYSTEM</text><text x="205.0" y="175.0" font-family="Work San