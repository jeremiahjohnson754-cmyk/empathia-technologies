<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s06e08-p02-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s06e08-p02-t">RFI 31 on a sheet: the question about a new local transmitter at 546–552 MHz, and Kit's answer in red: ‘No change required’, answered in ten minutes, no calculation, no checker.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >RFI 31 · RESPONSE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#818CF8" text-anchor="end" >RFI-031</text><text x="80" y="110" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#0B1220" text-anchor="start" >Q: New local transmitter on air (546–552 MHz).</text><text x="80" y="140" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#0B1220" text-anchor="start" >Does it affect the wireless plan?</text><text x="80" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#B91C1C" text-anchor="start" >A: No change required.</text><text x="80" y="240" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#B91C1C" text-anchor="start" >(answered in 10 minutes · no calc · no checker)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>