<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s06e10-p02-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s06e10-p02-t">The show network drawn as two boxes: VLAN 10 AUDIO holding the stage box, the sound console and — wrongly — the lighting console and nodes; VLAN 20 LIGHTING empty. 240 Mb/s of flooded audio reaches 100 Mb/s lighting nodes.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >PLAYHOUSE · SHOW NETWORK</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#818CF8" text-anchor="end" >AV-801</text><rect x="60" y="70" width="300" height="150" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="4" data-dg="1"/><text x="210.0" y="137.0" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#22D3EE" text-anchor="middle" >VLAN 10 · AUDIO</text><text x="210.0" y="165.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="middle" >stage box · sound console</text><text x="210" y="193" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FCA5A5" text-anchor="middle" >+ lighting console + nodes</text><rect x="440" y="70" width="300" height="150" rx="10" fill="#0F172A" stroke="#64748B" stroke-width="4" data-dg="1"/><text x="590.0" y="137.0" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#64748B" text-anchor="middle" >VLAN 20 · LIGHTING</text><text x="590.0" y="165.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="middle" >(empty)</text><text x="400" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#B91C1C" text-anchor="middle" >240 Mb/s of flooded audio → 100 Mb/s lighting nodes</text><text x="400" y="305" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#B91C1C" text-anchor="middle" >240% link use · control packets dropped</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>