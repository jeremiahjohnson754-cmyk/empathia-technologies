<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e07-p22-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e07-p22-t">Maya's notebook: a new stream check for every show — read the tap point, test that a room mute kills the mic online, balance for headphones, clap test, a second listener on cellular for a whole song. Underlined: listen to the stream, not the room.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><g transform="rotate(-2 400.0 230.0)"><rect x="160" y="50" width="480" height="360" rx="6" fill="#F4F1E8" stroke="#05070C" stroke-width="5"/><line x1="174" y1="98" x2="626" y2="98" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="134" x2="626" y2="134" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="170" x2="626" y2="170" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="206" x2="626" y2="206" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="242" x2="626" y2="242" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="278" x2="626" y2="278" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="314" x2="626" y2="314" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="350" x2="626" y2="350" stroke="#9FB3C8" stroke-width="1.5"/><line x1="204" y1="58" x2="204" y2="402" stroke="#E57373" stroke-width="2"/><text x="214" y="92" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >STREAM CHECK · every show</text><text x="214" y="128" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >1. Where does the stream listen?</text><text x="214" y="164" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >   Read the tap. Pre-fader, POST-MUTE.</text><text x="214" y="200" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >2. Mute a mic in the room → dead online?</text><text x="214" y="236" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >3. Balance for headphones, not the room</text><text x="214" y="272" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >4. Clap test. Delay the audio.</text><text x="214" y="308" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >5. Second listener, cellular, a whole song</text><text x="214" y="344" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" >Listen to the STREAM, not the room.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>