<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e07-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e07-p21-t">Graham's phone buzzes: the CEO writes that it was the best stream they've ever had after 2:15 — and to tell Reid she heard the joke.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><use href="../defs.svg#f-graham-N-surprised" x="90.0" y="190.0" width="175.0" height="280.0"/><g><rect x="480" y="110" width="220" height="260" rx="26" fill="#05070C"/><rect x="491" y="126" width="198" height="229" rx="13" fill="#0F1A2C"/><text x="590" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#94A3B8" text-anchor="middle" >MESSAGE</text><rect x="498" y="168" width="184" height="150" rx="10" fill="#1E3A8A"/><text x="590" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F4F1E8" text-anchor="middle" >CEO:</text><text x="590" y="222" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="middle" >Best stream we've</text><text x="590" y="244" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="middle" >ever had after 2:15.</text><text x="590" y="272" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="middle" >And tell Reid I</text><text x="590" y="294" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="middle" >heard the joke.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>