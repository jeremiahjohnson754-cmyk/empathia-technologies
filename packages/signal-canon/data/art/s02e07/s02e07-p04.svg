<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e07-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e07-p04-t">Two phones. One shows the stream's chat filling with alarm and complaints about the band. The other, Graham's, shows a message from the CEO: Who is telling jokes on my launch?</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><g><rect x="60" y="100" width="290" height="270" rx="35" fill="#05070C"/><rect x="74" y="116" width="261" height="238" rx="17" fill="#0F1A2C"/><text x="205" y="134" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#94A3B8" text-anchor="middle" >STREAM · CHAT</text><text x="76" y="156" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F1E8" text-anchor="start" >so the demo is held together with…</text><text x="76" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start" >DID HE JUST SAY THAT</text><text x="76" y="220" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F1E8" text-anchor="start" >band is SO loud lol</text><text x="76" y="252" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F1E8" text-anchor="start" >cant hear the presenter</text><text x="76" y="284" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="start" >clip it clip it</text><text x="76" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F1E8" text-anchor="start" >is this live??</text></g><g><rect x="470" y="110" width="200" height="250" rx="24" fill="#05070C"/><rect x="480" y="125" width="180" height="220" rx="12" fill="#0F1A2C"/><text x="570" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#94A3B8" text-anchor="middle" >MESSAGE</text><rect x="488" y="170" width="164" height="100" rx="10" fill="#1E3A8A"/><text x="570" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F4F1E8" text-anchor="middle" >CEO:</text><text x="570" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="middle" >Who is telling jokes</text><text x="570" y="248" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="middle" >on my launch?</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>