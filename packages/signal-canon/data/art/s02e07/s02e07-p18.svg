<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e07-p18-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e07-p18-t">System View of a clap test: the picture track shows the clap three frames after the sound track shows the clap arriving. Fix: delay audio by the measured gap.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="30" y="40" width="740" height="400" rx="10" fill="#05070C" opacity=".88"/><text x="50" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#8FA3BE" text-anchor="start" >A/V SYNC · CLAP TEST · ILLUSTRATIVE</text><text x="70" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#22D3EE" text-anchor="start" >PICTURE</text><text x="70" y="230" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FBBF24" text-anchor="start" >SOUND</text><rect x="180" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="236" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="292" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="348" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="404" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="460" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="516" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="572" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="628" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="684" y="104" width="50" height="40" rx="3" fill="#0E2A47" stroke="#22D3EE" stroke-width="2"/><rect x="516" y="104" width="50" height="40" rx="3" fill="#F4F1E8"/><text x="541" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#05070C" text-anchor="middle" >CLAP</text><path d="M180 225 L760 225" stroke="#FBBF24" stroke-width="3"/><path d="M500 225 l6 -40 l6 70 l6 -50 l6 20" stroke="#FBBF24" stroke-width="4" fill="none"/><text x="510" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FBBF24" text-anchor="middle" >clap heard</text><path d="M516 312 L530 312" stroke="#EF4444" stroke-width="4"/><path d="M516 330 L528 330" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" opacity="0.95"/><path d="M516 330 L528 330" fill="none" stroke="#F4F1E8" stroke-width="1.5" class="flow" opacity=".8"/><path d="M512 160 L512 180" stroke="#8FA3BE" stroke-width="2"/><path d="M530 150 L530 186" stroke="#8FA3BE" stroke-width="2" stroke-dasharray="4 4"/><text x="400" y="350" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F4F1E8" text-anchor="middle" >Sound arrives ≈ 3 frames (~40–50 ms) before the picture.</text><text x="400" y="384" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#34D399" text-anchor="middle" >Fix: delay the audio by the measured gap — never guess it.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>