<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e08-p18-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e08-p18-t">Monday's change board on a monitor: change CHG-3302 approved — disable only the 7:00 job; owners Facilities and Priya; rollback re-enable; test Tuesday at 7:00 on three devices; then decommission properly. Mei, who sits on the board, holds the printed record.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="250" y="50" width="520" height="280" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="250" y="50" width="520" height="30" rx="8" fill="#047857"/><rect x="250" y="70" width="520" height="10" fill="#047857"/><text x="264" y="71" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="start" >CHANGE BOARD · MONDAY</text><text x="266" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#34D399" text-anchor="start" >CHG-3302  APPROVED</text><text x="266" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#CBD5E1" text-anchor="start" >Disable 07:00 job only</text><text x="266" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#CBD5E1" text-anchor="start" >Owner: Facilities + Priya</text><text x="266" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#CBD5E1" text-anchor="start" >Rollback: re-enable job</text><text x="266" y="233" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#FBBF24" text-anchor="start" >Test: Tue 07:00, 3 devices</text><text x="266" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#CBD5E1" text-anchor="start" >Then: decommission, for real</text><use href="../defs.svg#f-mei-R-smile" x="30.0" y="196.0" width="170.0" height="272.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>