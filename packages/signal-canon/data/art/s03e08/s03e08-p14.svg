<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e08-p14-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e08-p14-t">System View of the 7:00 command's path. A legacy scheduler in riser closet 3B, powered, listed in the inventory as decommissioned, sends a 7:00 job over the building control network, owned by Priya, to twelve targets: the Garden Room display (input to HDMI 2), a lobby sign on a reused address (input switched, unnoticed), a projector in a room that no longer exists (still answers), and nine addresses that don't reply.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="start" >THE 7:00 COMMAND · WHERE IT COMES FROM · ILLUSTRATIVE</text><rect x="40" y="90" width="210" height="110" rx="10" fill="#27272A" stroke="#FBBF24" stroke-width="4"/><text x="145" y="124" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FBBF24" text-anchor="middle" >LEGACY</text><text x="145" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FBBF24" text-anchor="middle" >SCHEDULER</text><text x="145" y="180" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="middle" >riser 3B · powered</text><g><rect x="40" y="214" width="254" height="26" rx="13" fill="#EF4444"/><text x="167.0" y="232" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#05070C" text-anchor="middle" >inventory: DECOMMISSIONED</text></g><path d="M250 145 C330 145 330 145 400 145" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M250 145 C330 145 330 145 400 145" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="325" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#C084FC" text-anchor="middle" stroke="#05070C" stroke-width="3" paint-order="stroke">07:00 job</text><rect x="400" y="100" width="130" height="90" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="465" y="140" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >BUILDING</text><text x="465" y="162" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >CONTROL NET</text><text x="465" y="210" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#CBD5E1" text-anchor="middle" >owner: Priya</text><line x1="530" y1="145" x2="566.0" y2="113.3" stroke="#EF4444" stroke-width="3"/><polygon points="572,108 566.6,120.9 558.5,111.8" fill="#EF4444"/><rect x="576" y="76" width="194" height="68" rx="8" fill="#111827" stroke="#EF4444" stroke-width="3"/><text x="590" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#EF4444" text-anchor="start" >Garden display</text><text x="590" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >input → HDMI 2</text><line x1="530" y1="145" x2="566.7" y2="186.0" stroke="#FBBF24" stroke-width="3"/><polygon points="572,192 559.1,186.7 568.1,178.5" fill="#FBBF24"/><rect x="576" y="160" width="194" height="68" rx="8" fill="#111827" stroke="#FBBF24" stroke-width="3"/><text x="590" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="start" >Lobby sign</text><text x="590" y="214" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >reused address</text><line x1="530" y1="145" x2="569.6" y2="268.4" stroke="#FBBF24" stroke-width="3"/><polygon points="572,276 562.4,265.9 574.0,262.1" fill="#FBBF24"/><rect x="576" y="244" width="194" height="68" rx="8" fill="#111827" stroke="#FBBF24" stroke-width="3"/><text x="590" y="272" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="start" >Projector</text><text x="590" y="298" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >its room is gone</text><line x1="530" y1="145" x2="570.5" y2="352.1" stroke="#64748B" stroke-width="3"/><polygon points="572,360 563.6,348.8 575.6,346.5" fill="#64748B"/><rect x="576" y="328" width="194" height="68" rx="8" fill="#111827" stroke="#64748B" stroke-width="3"/><text x="590" y="356" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#64748B" text-anchor="start" >9 more</text><text x="590" y="382" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >no reply</text><text x="40" y="440" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FCA5A5" text-anchor="start" >Twelve targets. One owner-less box.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>