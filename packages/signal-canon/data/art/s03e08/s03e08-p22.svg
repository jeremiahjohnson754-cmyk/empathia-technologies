<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e08-p22-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e08-p22-t">Mei at her desk, holding a printed policy, reading an access request on her screen marked URGENT: tool, vendor remote support; target, the boardroom; requested by R., contractor; reason, the refresh before Monday.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="250" y="60" width="520" height="260" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="250" y="60" width="520" height="30" rx="8" fill="#B91C1C"/><rect x="250" y="80" width="520" height="10" fill="#B91C1C"/><text x="264" y="81" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="start" >ACCESS REQUEST · URGENT</text><text x="266" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#CBD5E1" text-anchor="start" >Tool: vendor remote support</text><text x="266" y="149" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#FBBF24" text-anchor="start" >Target: BOARDROOM</text><text x="266" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#CBD5E1" text-anchor="start" >Requested by: R. (contractor)</text><text x="266" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#CBD5E1" text-anchor="start" >Reason: “refresh, before Monday”</text><use href="../defs.svg#f-mei-R-flat" x="30.0" y="196.0" width="170.0" height="272.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url