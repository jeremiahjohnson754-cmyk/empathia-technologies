<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s06e03-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s06e03-p04-t">Two boxes: UPS 1 in the courtroom carrying the mixer, recorder A and the proposed copy; UPS 2 in the IT room carrying recorder B, marked deleted by VE-14.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="40" y="40" width="330" height="180" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="4" data-dg="1"/><text x="205.0" y="122.0" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#F59E0B" text-anchor="middle" >UPS 1 · courtroom</text><text x="205.0" y="150.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="middle" >mixer · recorder A · ‘copy 2’</text><rect x="430" y="40" width="330" height="180" rx="10" fill="#0F172A" stroke="#F87171" stroke-width="4" data-dg="1"/><text x="595.0" y="122.0" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#F87171" text-anchor="middle" >UPS 2 · IT room</text><text x="595.0" y="150.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="middle" >recorder B — deleted by VE-14</text><text x="400" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#F87171" text-anchor="middle" >both copies depend on UPS 1</text><text x="400" y="310" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#CBD5E1" text-anchor="middle" >A_pair = 1 − (1 − A)² holds only if nothing is shared</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>