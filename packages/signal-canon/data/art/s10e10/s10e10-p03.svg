ime</text><text x="46" y="155.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" text-anchor="middle" transform="rotate(-90 46 155.0)">sectors</text><rect x="303.3" y="70" width="142.2" height="170" fill="#DCFCE7" opacity=".8"/><text x="374.4" y="88" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803D" text-anchor="middle" >copied in 73 s</text><line x1="90.0" y1="70" x2="90.0" y2="240" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 4"/><line x1="303.3" y1="70" x2="303.3" y2="240" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 4"/><line x1="516.7" y1="70" x2="516.7" y2="240" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 4"/><rect x="331.9" y="240.0" width="14" height="0.0" fill="#DC2626"/><text x="338.9" y="234.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#B91C1C" text-anchor="middle" >0</text><rect x="385.2" y="236.1" width="14" height="3.9" fill="#DC2626"/><text x="392.2" y="230.11428571428573" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#B91C1C" text-anchor="middle" >8</text><rect x="438.6" y="208.9" width="14" height="31.1" fill="#DC2626"/><text x="445.6" y="202.9142857142857" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#B91C1C" text-anchor="middle" >64</text><line x1="488.2" y1="70" x2="488.2" y2="240" stroke="#16A34A" stroke-width="3"/><text x="494.2" y="106" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803D" text-anchor="start" >fresh drive 01:52</text><text x="90" y="56" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="start" >red: reallocated sectors (the drive's own health report) · blue dashed: hourly versioned backups</text><text x="400" y="310" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#15803D" text-anchor="middle" >stopped · 11 GB copied and verified in ≈ 73 s · fresh drive at 01:52</text><text x="400" y="338" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >without the hourly backup: 180 GB since midnight — twenty minutes on a dying drive</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-177)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>