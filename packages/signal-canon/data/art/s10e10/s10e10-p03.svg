<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e10-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e10-p03-t">A night sheet from midnight to three: blue dashed lines at each hourly versioned backup; red bars for the drive's reallocated sectors — 0, 8, 64 — climbing; a green band from 01:00 to 01:40 marked ‘copied in 73 s’; a green line at 01:52 marked ‘fresh drive’.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >THE LAST NIGHT · THE SESSION DRIVE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >NT-10</text><rect x="90" y="70" width="640" height="170" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="90.0" y1="70" x2="90.0" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="90.0" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >00:00</text><line x1="196.7" y1="70" x2="196.7" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="196.7" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >00:30</text><line x1="303.3" y1="70" x2="303.3" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="303.3" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor