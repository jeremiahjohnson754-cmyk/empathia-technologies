<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e10-p07-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e10-p07-t">A delivery sheet: 11 masters, all matching; 44 agreed stems, all matching; a checksum manifest sent with the files; the title-song vocal stems marked NOT SENT, awaiting Esme. Sent 08:52; the label recomputed every checksum and all matched at 08:57; Esme's written yes for one remix logged at 12:10.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >GLASSHOUSE · DELIVERY TO THE LABEL</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >DL-10</text><rect x="46" y="52" width="708" height="38" rx="4" fill="#DCFCE7"/><text x="60" y="78" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >11 masters</text><text x="270" y="78" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start" >24-bit · 48 kHz · true peak ≤ −1.0 dBTP</text><text x="740" y="78" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#15803D" text-anchor="end" >11 / 11 match</text><rect x="46" y="102" width="708" height="38" rx="4" fill="#DCFCE7"/><text x="60" y="128" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >44 agreed stems</text><text x="270" y="128" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start" >4 per song · as her contract covers</text><text x="740" y="128" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#15803D" text-anchor="end" >44 / 44 match</text><rect x="46" y="152" width="708" height="38" rx="4" fill="#DCFCE7"/><text x="60" y="178" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Checksum manifest</text><text x="270" y="178" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start" >one line per file</text><text x="740" y="178" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#15803D" text-anchor="end" >sent with the files</text><rect x="46" y="202" width="708" height="38" rx="4" fill="#FEF3C7"/><text x="60" y="228" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Title-song vocal stems</text><text x="270" y="228" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start" >for the remix partner</text><text x="740" y="228" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#B45309" text-anchor="end" >NOT SENT · awaiting Esme</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#15803D" text-anchor="middle" >sent 08:52 · the label recomputed every checksum · all match 08:57</text><text x="400" y="328" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >Esme's written yes for one remix — logged at 12:10, after she slept</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-se