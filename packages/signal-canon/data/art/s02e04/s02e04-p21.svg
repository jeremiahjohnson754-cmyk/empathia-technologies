<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e04-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e04-p21-t">Night on a loading dock. Maya reads a text from Dante: they put me on the presenter's in-ear mix at the festival, no rehearsal — you built the template, right?</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg7" width="800" height="480"/><g><rect x="470" y="90" width="180" height="300" rx="22" fill="#05070C"/><rect x="479" y="108" width="162" height="264" rx="11" fill="#0F1A2C"/><text x="560" y="160" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#CBD5E1" text-anchor="middle" >DANTE</text><text x="560" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >They put me on the</text><text x="560" y="217" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >presenter's in-ear</text><text x="560" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >mix at the festival.</text><text x="560" y="259" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >No rehearsal.</text><text x="560" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle" >You built the</text><text x="560" y="311" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle" >template, right?</text></g><use href="../defs.svg#f-maya-N-smile" x="150.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="48