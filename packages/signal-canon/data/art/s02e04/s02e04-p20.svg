<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e04-p20-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e04-p20-t">Sofia holds up her phone: a review of press night — the lighting is restrained, almost old-fashioned, and exactly right. Maya grins.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect x="0" y="360" width="800" height="120" fill="#101826"/><rect x="0" y="356" width="800" height="8" fill="#1B2436"/><g><rect x="320" y="90" width="160" height="270" rx="19" fill="#05070C"/><rect x="328" y="106" width="144" height="238" rx="10" fill="#0F1A2C"/><text x="400" y="170" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#CBD5E1" text-anchor="middle" >REVIEW</text><text x="400" y="205" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >“The lighting is</text><text x="400" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >restrained, almost</text><text x="400" y="247" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1E8" text-anchor="middle" >old-fashioned —</text><text x="400" y="268" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle" >and exactly right.”</text></g><use href="../defs.svg#f-sofia-N-grin" x="40.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-N-smile" x="580.0" y="200.0" width="156.2" height="250.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>