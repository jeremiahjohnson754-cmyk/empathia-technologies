<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e04-p09-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e04-p09-t">System View comparison card. Different from rehearsal: cues with no fade time of their own all run fast; every moving head is low by the same angle. The same: cues with explicit times, every fixture on dimmers, the network with no errors, Sofia's GOs on Rosa's calls. Conclusion: a change that touches defaults and one fixture type.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="30" y="45" width="740" height="390" rx="10" fill="#05070C" opacity=".9"/><text x="50" y="77" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="start" >TONIGHT vs REHEARSAL VIDEO · ILLUSTRATIVE</text><rect x="50" y="95" width="340" height="250" rx="10" fill="#1A0F14" stroke="#EF4444" stroke-width="3"/><text x="220" y="129" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#EF4444" text-anchor="middle" >DIFFERENT</text><text x="70" y="171" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >Cues with NO fade time of</text><text x="70" y="205" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >  their own: all run fast</text><text x="70" y="239" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >Moving heads: every one</text><text x="70" y="273" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >  low by the same angle</text><rect x="410" y="95" width="340" height="250" rx="10" fill="#0B1A14" stroke="#34D399" stroke-width="3"/><text x="580" y="129" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#34D399" text-anchor="middle" >THE SAME</text><text x="430" y="171" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >Cues with explicit times</text><text x="430" y="205" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >Every fixture on dimmers</text><text x="430" y="239" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >Network: no errors, no drops</text><text x="430" y="273" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >Sofia's GOs: on Rosa's calls</text><text x="400" y="385" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FBBF24" text-anchor="middle" >Consistent → a CHANGE that touches defaults and one fixture type</text><text x="400" y="413" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Random faults don't sort themselves this neatly.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>