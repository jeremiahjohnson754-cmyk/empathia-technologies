<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s07e07-p02-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s07e07-p02-t">A rack power sheet: two red boxes, UPS A and UPS B, both 120 V only and fed through 1,000 VA converters; 1,400 W on 1,000 VA is at least 140%; the parts list has one UPS model for every country; isolated by the site electrician.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >VALMERA TRAINING · RACK POWER</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#2DD4BF" text-anchor="end" >E-VT-2</text><rect x="60" y="70" width="300" height="150" rx="10" fill="#1F1115" stroke="#F87171" stroke-width="4" data-dg="1"/><text x="210.0" y="137.0" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#F87171" text-anchor="middle" >UPS A · 120 V ONLY</text><text x="210.0" y="165.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="middle" >via 1,000 VA converter</text><rect x="440" y="70" width="300" height="150" rx="10" fill="#1F1115" stroke="#F87171" stroke-width="4" data-dg="1"/><text x="590.0" y="137.0" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#F87171" text-anchor="middle" >UPS B · 120 V ONLY</text><text x="590.0" y="165.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="middle" >via 1,000 VA converter</text><text x="400" y="262" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#B91C1C" text-anchor="middle" >1,400 W on a 1,000 VA converter ≥ 140%</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#0F172A" text-anchor="middle" >parts list: one UPS model for every country</text><text x="400" y="334" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#B45309" text-anchor="middle" >isolated by the site electrician · nobody touches</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>