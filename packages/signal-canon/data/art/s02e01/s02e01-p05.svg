<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e01-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e01-p05-t">Three advance packets on a desk. Orchard Hall's power drawing is dated ten years ago. The Carroway's page lists no rigging points; its small header line reads MILLRACE HALL · TECH SPEC. Garner's rigging page is complete and recent.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#18202E"/><g transform="rotate(-4 150.0 210.0)"><rect x="40" y="60" width="220" height="300" rx="3" fill="#F8FAFC" stroke="#05070C" stroke-width="4"/><text x="52" y="82" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >CITY 2</text><text x="52" y="108" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#05070C" text-anchor="start" >ORCHARD HALL · POWER</text><text x="52" y="138" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#B45309" text-anchor="start" >Drawing dated 10 yrs ago</text><text x="52" y="164" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Service: 'see attached'</text><text x="52" y="190" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Attached: nothing</text></g><g transform="rotate(1 400.0 210.0)"><rect x="290" y="50" width="220" height="320" rx="3" fill="#F8FAFC" stroke="#05070C" stroke-width="4"/><text x="302" y="72" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >MILLRACE HALL · TECH SPEC</text><text x="302" y="98" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#05070C" text-anchor="start" >THE CARROWAY · TECH</text><text x="302" y="128" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Stage: 14 × 10 m</text><text x="302" y="154" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start" >Rigging points: —</text><text x="302" y="180" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Photo of ceiling: yes</text><text x="302" y="206" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Power: TBC</text></g><g transform="rotate(3 650.0 215.0)"><rect x="540" y="70" width="220" height="290" rx="3" fill="#F8FAFC" stroke="#05070C" stroke-width="4"/><text x="552" y="92" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >CITY 6</text><text x="552" y="118" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#05070C" text-anchor="start" >GARNER · RIGGING</text><text x="552" y="148" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Points listed: 12</text><text x="552" y="174" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Engineer: named</text><text x="552" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="start" >Dated last year</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>