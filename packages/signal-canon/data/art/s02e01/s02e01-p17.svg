<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e01-p17-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e01-p17-t">Thursday morning. Jordan holds up a revised rigging page from the Carroway: four downstage points, rated 1,000 kg each, signed, dated two years ago. Its header reads MILLRACE HALL · HALL B.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect x="0" y="360" width="800" height="120" fill="#101826"/><rect x="0" y="356" width="800" height="8" fill="#1B2436"/><g transform="rotate(-1 410.0 200.0)"><rect x="280" y="40" width="260" height="320" rx="3" fill="#F8FAFC" stroke="#05070C" stroke-width="4"/><text x="292" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="start" >MILLRACE HALL · HALL B</text><text x="292" y="88" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#05070C" text-anchor="start" >RIGGING · REVISED</text><text x="292" y="118" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Points DS1–DS4</text><text x="292" y="144" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="start" >Rated 1,000 kg each</text><text x="292" y="170" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Engineer: signed</text><text x="292" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Date: 2 yrs ago</text></g><use href="../defs.svg#f-jordan-S-grin" x="40.0" y="190.0" width="175.0" height="280.0"/><use href="../defs.svg#f-maya-N-surprised"