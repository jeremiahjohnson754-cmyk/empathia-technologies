<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e01-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e01-p21-t">Maya's advance log: old RF plan hits local use in city 2 and city 5, so scan every city. City 3's page came from Millrace Hall; asked for real data; Ben escalated to Kim. Fallback: ground-supported. Power: Hank's distro, venue ties in. RF file: my laptop — backup later.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="150" y="30" width="500" height="420" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="80" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#05070C" text-anchor="middle" >ADVANCE LOG · LANTERN</text><text x="180" y="132" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >RF: old plan hits local use in</text><text x="180" y="164" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >city 2 + city 5 → scan every city.</text><text x="180" y="210" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >City 3: page from MILLRACE HALL.</text><text x="180" y="242" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Asked for real data. Ben → Kim.</text><text x="180" y="288" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Fallback: ground-supported (Ben).</text><text x="180" y="334" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Power: Hank's distro, venue ties in.</text><text x="180" y="380" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >RF file: my laptop. (backup later)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>