<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s09e03-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s09e03-p04-t">The access sheet after the fix: five roles in coloured bars — operator for show states, technician for levels, EQ and the loop, two named administrators for accounts and firmware approvals, the integrator only via security's jump host, and no access for everyone else; ‘Show’ always restores the room, loop at 400 mA/m.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >DSP & CONTROL · WHO CAN DO WHAT</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#DB2777" text-anchor="end" >SEC-03</text><rect x="80" y="70" width="200" height="40" rx="6" fill="#0EA5E9"/><text x="180" y="96" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" >Operator</text><text x="300" y="96" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start" >show states: Show · Rehearsal · Talk</text><rect x="80" y="122" width="200" height="40" rx="6" fill="#16A34A"/><text x="180" y="148" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" >Technician</text><text x="300" y="148" font-family="Work Sans, system-ui, sans-serif" font-size="17" fon