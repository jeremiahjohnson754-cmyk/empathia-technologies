<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e08-p06-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e08-p06-t">Cal's fourteenth warning, handwritten on a card: the hub has one clock, one building, and nobody who knows this valley. Signed C.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#F4F1E8"/><rect x="160" y="60" width="480" height="300" rx="8" fill="#FFFBEB" stroke="#05070C" stroke-width="5"/><text x="400" y="120" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="44" font-weight="800" fill="#B91C1C" text-anchor="middle" >14.</text><text x="400" y="190" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#0B1220" text-anchor="middle" >The hub has one clock,</text><text x="400" y="236" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#0B1220" text-anchor="middle" >one building, and nobody</text><text x="400" y="282" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#0B1220" text-anchor="middle" >who knows this valley.</text><text x="560" y="338" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#0B1220" text-anchor="middle" >— C.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>