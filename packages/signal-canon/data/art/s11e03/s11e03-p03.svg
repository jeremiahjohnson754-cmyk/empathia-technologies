<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s11e03-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s11e03-p03-t">A spectrum sheet from 154.4 to 156.0 MHz: two tall bars for the EMS repeater at 155.340 and the loaner at 154.980; two red intermodulation products at 154.620 and 155.700 — the second right on a dashed amber line marking fire dispatch's receive frequency.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >EOC MAST · WHAT THE TRANSMITTERS MAKE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="end" >RF-03</text><rect x="90" y="70" width="640" height="170" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="90.0" y1="70" x2="90.0" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="90.0" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >154.4</text><line x1="250.0" y1="70" x2="250.0" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="250.0" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >154.8</text><line x1="410.0" y1="70" x2="410.0" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="410.0" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >155.2</text><line x1="570.0" y1="70" x2="570.0" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="570.0" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >155.6</text><line x1="730.0" y1="70" x2="730.0" y2="240" stroke="#E2E8F0" stroke-width="1"/><text x="730.0" y="257" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >156.0</text><text x="410.0" y="274" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" text-anchor="middle" >MHz (illustrative)</text><rect x="461.0" y="87.0" width="10" height="153.0" fill="#0EA5E9"/><text x="466.0" y="79.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0EA5E9" text-anchor="middle" >EMS repeater TX</text><rect x="317.0" y="87.0" width="10" height="153.0" fill="#7C3AED"/><text x="322.0" y="79.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#7C3AED" text-anchor="middle" >loaner TX</text><rect x="606.0" y="189.0" width="8" height="51.0" fill="#DC2626"/><text x="610.0" y="181.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#B91C1C" text-anchor="middle" >IM3 155.700</text><rect x="174.0" y="189.0" width="8" height="51.0" fill="#DC2626"/><text x="178.0" y="181.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#B91C1C" text-anchor="middle" >IM3 154.620</text><line x1="610.0" y1="70" x2="610.0" y2="240" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4"/><text x="616.0" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#B45309" text-anchor="start" >fire dispatch RX</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#B91C1C" text-anchor="middle" >2 × 155.340 − 154.980 = 155.700 — right on fire dispatch's receive frequency</text><text x="400" y="328" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >fₘ = 2f₁ − f₂ · a signal nobody transmitted</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >frequencies illustrative, not assignments (RV-186)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>