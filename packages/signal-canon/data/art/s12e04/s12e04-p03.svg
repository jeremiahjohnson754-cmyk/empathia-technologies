<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s12e04-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s12e04-p03-t">A teaching moment: Pim and Maya beside a board. The APAC all-hands stream died at ten past three. Runbook seven. Nine minutes. Two to detect, three to diagnose, four to restore. The target was fifteen. Nobody called me. Step nine said to call Galen. Galen's on leave.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg131" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="28" font-weight="800" fill="#FDA4AF" text-anchor="middle" >WHICH ONE — AND WHY?</text><text x="400" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="middle" >📖 reference only</text><use href="../defs.svg#f-pim-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>