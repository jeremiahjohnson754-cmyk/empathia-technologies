" font-weight="800" fill="#FFFFFF" text-anchor="middle" >diagnose</text><rect x="430.0" y="124" width="112.0" height="22" fill="#0EA5E9"/><text x="486.0" y="140" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" >restore</text><rect x="290.0" y="168" width="420.0" height="22" fill="none" stroke="#15803D" stroke-width="2" stroke-dasharray="6 4"/><text x="704.0" y="184" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#15803D" text-anchor="end" >15-minute target</text><text x="400" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" >T = detect + diagnose + restore = 2 + 3 + 4 = 9 min · 6 minutes inside the target</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="middle" >step 9: ‘Call Galen to approve failback’ — Galen on leave; Pim rang the APAC duty manager</text><text x="400" y="326" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle" >nobody called the architect</text><text x="400" y="398" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-188)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>