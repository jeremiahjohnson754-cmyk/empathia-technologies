<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s12e04-p02-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s12e04-p02-t">A timeline of the all-hands from 11:05 to 11:25: the stream green until 11:10, red for nine minutes, then blue on the backup; Pim's lane shows detect (2 min), diagnose (3 min), restore (4 min); a dashed 15-minute target box. Step 9 named Galen, on leave; Pim rang the APAC duty manager.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >APAC ALL-HANDS · 11:05–11:25 SGT</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#334155" text-anchor="end" >RB-04</text><rect x="150" y="60" width="560" height="150" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="150.0" y1="60" x2="150.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="150.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >11:05</text><line x1="290.0" y1="60" x2="290.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="290.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >11:10</text><line x1="430.0" y1="60" x2="430.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="430.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="7