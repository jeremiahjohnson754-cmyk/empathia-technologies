<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e00-p47-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e00-p47-t">Theo's phone buzzes and he holds it out to Maya. A text from Walter: 'I can see her. Clear as day. Tell Maya thank you.' Maya can't say anything at all.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg1" width="800" height="480"/><use href="../defs.svg#f-theo-P-grin" x="470.0" y="180.0" width="181.2" height="290.0"/><use href="../defs.svg#f-maya-N-surprised" x="60.0" y="200.0" width="168.8" height="270.0"/><g><rect x="260" y="40" width="230" height="330" rx="28" fill="#05070C"/><rect x="272" y="60" width="207" height="290" rx="14" fill="#0F1A2C"/><rect x="276" y="110" width="198" height="150" rx="12" fill="#34D399"/><text x="375" y="140" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#05070C" text-anchor="middle" >Grandpa Walter</text><text x="375" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#05070C" text-anchor="middle" >I can see her.</text><text x="375" y="204" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#05070C" text-anchor="middle" >Clear as day.</text><text x="375" y="236" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#05070C" text-anchor="middle" >Tell Maya thank you.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>