<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e00-p08-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e00-p08-t">A sticky note on the stream computer's monitor reads DO NOT UPDATE ON SUNDAY. An update prompt sits just under it. Maya eyes it like a suspect.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg1" width="800" height="480"/><use href="../defs.svg#p-monitor" x="420" y="150" width="260" height="210" /><rect x="450" y="180" width="200" height="54" fill="#23324D"/><text x="550" y="204" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F4F1E8" text-anchor="middle" >Update available</text><text x="550" y="224" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8FA3BE" text-anchor="middle" >Restart now?</text><rect x="560" y="164" width="120" height="70" fill="#FBE38E" transform="rotate(6 620 200)"/><text x="620" y="190" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#05070C" text-anchor="middle" transform="rotate(6 620 200)">DO NOT</text><text x="620" y="208" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#05070C" text-anchor="middle" transform="rotate(6 620 200)">UPDATE ON</text><text x="620" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#05070C" text-anchor="middle" transform="rotate(6 620 200)">SUNDAY</text><use href="../defs.svg#f-maya-N-flat" x="110.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>