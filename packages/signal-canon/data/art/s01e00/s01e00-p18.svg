<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e00-p18-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e00-p18-t">The stream computer's own network monitor shows it receiving hundreds of megabits per second when the stream needs only a few. Maya's confidence that the computer is at fault drops from 90 to 30.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg1" width="800" height="480"/><use href="../defs.svg#p-monitor" x="380" y="90" width="330" height="270" /><rect x="420" y="130" width="250" height="150" fill="#0B1220"/><text x="545" y="158" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#8FA3BE" text-anchor="middle" >NETWORK · RECEIVE</text><polyline points="430,260 460,250 490,200 520,215 550,160 580,175 610,150 640,165 660,140" fill="none" stroke="#EF4444" stroke-width="5"/><text x="545" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#EF4444" text-anchor="middle" >hundreds of Mbit/s</text><text x="545" y="322" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle" >stream needs: a few</text><use href="../defs.svg#f-maya-S-surprised" x="90.0" y="180.0" width="175.0" height="280.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>