<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e09-p15-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e09-p15-t">System View of the workaround: one DHCP server, the site's; our gear fixed at .240–.249, drawn inside the site's pool; tonight's sixty leases fill only the bottom of the pool. A red dashed box: our fixed addresses are inside their pool, not excluded.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="30" y="34" width="740" height="412" rx="10" fill="#05070C" opacity=".9"/><text x="50" y="64" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#8FA3BE" text-anchor="start" >THE 1 A.M. WORKAROUND · ONE DHCP SERVER · ILLUSTRATIVE</text><text x="60" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >10.20.0.0/24 — both networks chose the same private range</text><rect x="60" y="130" width="680" height="30" rx="4" fill="#111827" stroke="#475569" stroke-width="2"/><line x1="63" y1="160" x2="63" y2="172" stroke="#8FA3BE" stroke-width="2"/><text x="62.666666666666664" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8FA3BE" text-anchor="middle" >.1</text><line x1="193" y1="160" x2="193" y2="172" stroke="#8FA3BE" stroke-width="2"/><text x="193.33333333333334" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8FA3BE" text-anchor="middle" >.50</text><line x1="327" y1="160" x2="327" y2="172" stroke="#8FA3BE" stroke-width="2"/><text x="326.6666666666667" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8FA3BE" text-anchor="middle" >.100</text><line x1="593" y1="160" x2="593" y2="172" stroke="#8FA3BE" stroke-width="2"/><text x="593.3333333333334" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8FA3BE" text-anchor="middle" >.200</text><line x1="700" y1="160" x2="700" y2="172" stroke="#8FA3BE" stroke-width="2"/><text x="700.0" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8FA3BE" text-anchor="middle" >.240</text><line x1="737" y1="160" x2="737" y2="172" stroke="#8FA3BE" stroke-width="2"/><text x="737.3333333333334" y="188" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#8FA3BE" text-anchor="middle" >.254</text><rect x="87" y="134" width="640" height="22" fill="#FBBF24" opacity=".35"/><text x="406.6666666666667" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FDE68A" text-anchor="middle" >SITE DHCP POOL .10–.250</text><rect x="700" y="200" width="24" height="22" fill="#34D399"/><text x="692.0" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#34D399" text-anchor="end" >our gear fixed .240–.249 →</text><rect x="87" y="240" width="160" height="18" fill="#FBBF24" opacity=".8"/><text x="252.0" y="254" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FDE68A" text-anchor="start" >tonight: ~60 leases, filling from the bottom</text><rect x="80" y="290" width="640" height="100" rx="8" fill="#101826" stroke="#EF4444" stroke-width="3" stroke-dasharray="10 6"/><text x="400" y="324" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#EF4444" text-anchor="middle" >OUR FIXED ADDRESSES ARE INSIDE THEIR POOL — NOT EXCLUDED</text><text x="400" y="356" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F4F1E8" text-anchor="middle" >Works while the pool never reaches .240. A bigger site, a busier day: collision.</text><text x="400" y="436" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#F4F1E8" text-anchor="middle" >AV router DHCP: OFF. One server answers. The fuse is lit.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>