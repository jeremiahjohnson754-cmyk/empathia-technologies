system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="start" >at 12:40. Two DHCP</text><text x="496" y="244" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="start" >servers on one net:</text><text x="496" y="268" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="start" >half the scanners lost</text><text x="496" y="292" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="start" >internet. We unplugged</text><text x="496" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F4F1E8" text-anchor="start" >OUR end only. Call me.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>