ork Sans, system-ui, sans-serif" font-size="12" font-weight="900" fill="#B91C1C" text-anchor="end" >22:50 · water on the deck</text><text x="400" y="346" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" >t = d ÷ v = 0.15 m ÷ 0.30 m/h = 0.5 h → 22:50</text><text x="400" y="372" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#B91C1C" text-anchor="middle" >carrier A down · carrier B carrying everything · the hilltop path in service and idle</text><text x="400" y="398" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >gauge figures illustrative (RV-183) · nobody goes onto the bridge</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>