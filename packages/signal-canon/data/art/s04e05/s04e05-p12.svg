<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e05-p12-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e05-p12-t">Two phones: June texts 'captions on. don't celebrate yet.' Dolores texts 'the grey screen frightened me. then Omar. thank you.'</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg55" width="800" height="480"/><g><rect x="80" y="60" width="200" height="340" rx="24" fill="#05070C"/><rect x="90" y="80" width="180" height="299" rx="12" fill="#0F1A2C"/><text x="180" y="120" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#94A3B8" text-anchor="middle" >June</text><text x="180" y="160" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" >captions on.</text><text x="180" y="190" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" >don't celebrate yet.</text></g><g><rect x="500" y="60" width="220" height="340" rx="26" fill="#05070C"/><rect x="511" y="80" width="198" height="299" rx="13" fill="#0F1A2C"/><text x="610" y="120" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#94A3B8" text-anchor="middle" >Dolores</text><text x="610" y="160" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" >the grey screen</text><text x="610" y="186" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" >frightened me.</text><text x="610" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" >then Omar. thank you.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>