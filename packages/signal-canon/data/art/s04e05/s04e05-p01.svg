<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e05-p01-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e05-p01-t">The transmitter site at night in a storm: the lattice tower far off with its red beacon, rain and wind streaks, the transmitter building's lit window. Felix stands in the building's doorway, radio to his ear, far from the tower.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg61" width="800" height="480"/><use href="../defs.svg#f-felix-H-flat" x="560.0" y="180.0" width="168.8" height="270.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>