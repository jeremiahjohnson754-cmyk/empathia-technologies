<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e05-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e05-p05-t">Inside the transmitter building: the STL receiver's signal history on a screen — falling with the rain from minus 54 at 23:10 to no signal at 23:46. Felix holds his logbook.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg61" width="800" height="480"/><rect x="40" y="40" width="360" height="220" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><text x="56" y="74" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="start" >STL RX · signal (dBm)</text><text x="56" y="102" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700" fill="#34D399" text-anchor="start" >23:10  −54</text><text x="56" y="130" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700" fill="#FBBF24" text-anchor="start" >23:30  −61</text><text x="56" y="158" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700" fill="#F87171" text-anchor="start" >23:42  −66</text><text x="56" y="186" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="700" fill="#F87171" text-anchor="start" >23:46  NO SIGNAL</text><use href="../defs.svg#f-felix-R-worried" x="520.0" y="180.0" width="168.8" height="270.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>