<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s11e04-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s11e04-p03-t">A relay sheet over eight minutes: in English, a red bar for the rewrite, amber for approval, grey for posting, a sliver for captions at 415 seconds; in Spanish, a red bar for machine translation. Below, the agency's words — ‘Move to higher ground now. Act quickly to protect your life.’ — and the county's: ‘Flooding possible along Mill Creek. Stay alert.’</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >MILL CREEK WARNING · THE RELAY</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="end" >PI-04</text><rect x="150" y="60" width="580" height="150" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="150.0" y1="60" x2="150.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="150.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >+0:00</text><line x1="222.5" y1="60" x2="222.5" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="222.5" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >+1:00</text><line x1="295.0" y1="60" x2="295.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="295.0" y="227" font-fam