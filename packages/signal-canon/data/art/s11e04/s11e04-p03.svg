t><text x="144" y="177" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" text-anchor="end" >Spanish</text><rect x="150.0" y="84" width="217.5" height="24" fill="#DC2626"/><text x="258.8" y="101" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >rewrite</text><rect x="367.5" y="84" width="145.0" height="24" fill="#F59E0B"/><text x="440.0" y="101" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >approve</text><rect x="512.5" y="84" width="139.0" height="24" fill="#64748B"/><text x="582.0" y="101" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >post</text><rect x="651.5" y="122" width="7.2" height="24" fill="#7C3AED"/><text x="664.7" y="139" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="start" >captions</text><rect x="512.5" y="160" width="157.1" height="24" fill="#DC2626"/><text x="591.0" y="177" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" >machine translation</text><text x="60" y="274" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="start" >Agency:</text><text x="140" y="274" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" >‘…Move to higher ground now. Act quickly to protect your life.’</text><text x="60" y="302" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="start" >County:</text><text x="140" y="302" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#B91C1C" text-anchor="start" >‘Flooding possible along Mill Creek. Stay alert.’</text><text x="400" y="344" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#B91C1C" text-anchor="middle" >415 s, and the words changed at the first step</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >agency and county invented · illustrative (RV-183, RV-186)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>