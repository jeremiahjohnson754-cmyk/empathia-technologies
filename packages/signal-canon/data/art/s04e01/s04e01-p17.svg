<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e01-p17-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e01-p17-t">Cal's fourteen warnings, printed and pinned to the master-control wall. Number three is circled in red. Maya points at it.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="120" y="24" width="560" height="432" rx="6" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="64" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="800" fill="#05070C" text-anchor="middle" >14 WARNINGS — C.</text><text x="146" y="102" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >1. Tally wiring in studio B</text><text x="146" y="127" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >2. Generator test never at full load</text><text x="146" y="152" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#B91C1C" text-anchor="start" >3. Backup reference follows the main</text><text x="146" y="177" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >4. No spare gateway</text><text x="146" y="202" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >5. Break path unmetered (loudness)</text><text x="146" y="227" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >6. Lip-sync never checked at the viewer</text><text x="146" y="252" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >7. STL margin < 10 dB since March</text><text x="146" y="277" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >8. Encoder presets undocumented</text><text x="146" y="302" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >9. Nobody monitors captions on the stream</text><text x="146" y="327" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >10. Remote kit untested on cellular</text><text x="146" y="352" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >11. 22 people share the newsdesk login</text><text x="146" y="377" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >12. Backup MCR never run a real night</text><text x="146" y="402" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >13. Runbook is in my head</text><text x="146" y="427" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="700" fill="#0B1220" text-anchor="start" >14. (missing)</text><use href="../defs.svg#f-maya-P-flat" x="600.0" y="220.0" width="150.0" height="240.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>