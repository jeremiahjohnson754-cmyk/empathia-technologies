19" font-weight="600" fill="#0B1220" text-anchor="start" >9:21 rain early · 2 RF ch + control drops</text><text x="194" y="144" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#047857" text-anchor="start" >① SL junction: boot off, in water → raised</text><text x="194" y="180" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#047857" text-anchor="start" >② Genny 3 alarm: fuel filter (Hank, signed)</text><text x="194" y="216" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#047857" text-anchor="start" >③ Ant. B cable under truck ramp → rerouted</text><text x="194" y="252" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#0B1220" text-anchor="start" >Hold 9:31–10:31 (Ben · plan §3)</text><text x="194" y="288" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#0B1220" text-anchor="start" >Restart 10:54 on Rosa's call</text><text x="194" y="324" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#B45309" text-anchor="start" >RF file: ONLY on laptop → shared + print</text><text x="194" y="360" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#B45309" text-anchor="start" >(tomorrow)</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>