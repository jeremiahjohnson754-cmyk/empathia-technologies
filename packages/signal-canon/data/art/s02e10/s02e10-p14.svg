<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e10-p14-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e10-p14-t">A teaching moment: Ben and Maya beside a board. A delay speaker sits out in the crowd, delayed so its sound lands just after the stage's. Sound moves about three hundred forty-three metres a second. So the delay is… Distance over speed. Tower seventeen metres out: seventeen over three forty-three — about fifty milliseconds. And weather holds are the safety lead's call.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg13" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" >t = d ÷ c</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#A7F3D0" text-anchor="middle" >17.15 ÷ 343 = 0.05 s = 50 ms</text><use href="../defs.svg#f-ben-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>