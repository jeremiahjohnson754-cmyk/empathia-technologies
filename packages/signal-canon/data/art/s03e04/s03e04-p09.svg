<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e04-p09-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e04-p09-t">System View: the AV segment and the office segment. The processor's audio stream stays inside the AV segment. Camera control commands are allowed through the firewall, so the camera looks reachable from the office side. After Friday's move, the encoder's audio card CR-12 sits on the office segment at 10.40.12.87, where the stream never arrives.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="52" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · FORUM NETWORK · ILLUSTRATIVE</text><rect x="40" y="70" width="330" height="330" rx="12" fill="#052E1B" stroke="#34D399" stroke-width="3" stroke-dasharray="8 6"/><text x="205" y="96" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle" >AV SEGMENT · 10.80</text><rect x="430" y="70" width="330" height="330" rx="12" fill="#1E1B4B" stroke="#A5B4FC" stroke-width="3" stroke-dasharray="8 6"/><text x="595" y="96" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#A5B4FC" text-anchor="middle" >OFFICE SEGMENT · 10.40</text><rect x="60" y="120" width="140" height="56" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="3"/><text x="130.0" y="142.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#22D3EE" text-anchor="middle" >PROCESSOR</text><text x="130.0" y="165.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >sends audio stream</text><rect x="220" y="120" width="130" height="56" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="285.0" y="142.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#93C5FD" text-anchor="middle" >CAMERA</text><text x="285.0" y="165.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >control + video</text><rect x="60" y="300" width="290" height="60" rx="10" fill="#0F172A" stroke="#475569" stroke-width="3"/><text x="205.0" y="336.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#475569" text-anchor="middle" >(nothing listening here)</text><rect x="450" y="300" width="290" height="60" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3"/><text x="595.0" y="324.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#F87171" text-anchor="middle" >ENCODER CARD · CR-12</text><text x="595.0" y="347.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >10.40.12.87 · after Friday's move</text><path d="M130 176 L130 300" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M130 176 L130 300" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="205" y="250" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle" stroke="#05070C" stroke-width="3" paint-order="stroke">audio stream (multicast)</text><rect x="355" y="190" width="90" height="60" rx="10" fill="#1F1A05" stroke="#FBBF24" stroke-width="3"/><text x="400.0" y="226.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FBBF24" text-anchor="middle" >FIREWALL</text><path d="M300 176 C320 220 340 220 355 220" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M300 176 C320 220 340 220 355 220" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><path d="M445 220 C520 220 560 240 560 300" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M445 220 C520 220 560 240 560 300" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="595" y="170" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#C084FC" text-anchor="middle" >camera control: ALLOWED ✓</text><text x="595" y="192" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >(so it looks “reachable”)</text><text x="655" y="262" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F87171" text-anchor="middle" >audio stream: STAYS HOME ✕</text><text x="400" y="432" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FDE68A" text-anchor="middle" >Reachable is not receiving. The fix: CR-12 back on the AV segment — by its owner.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>