<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e04-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e04-p21-t">Change log entry 4: Forum, room fine, remote silent; Friday's desk move under FAC-2231 re-patched four ports; CR-12 encoder audio and CR-14 interpreter went to the office VLAN with no network change; Priya moved both as a logged emergency change; proof from a phone off-network at 9:59; rule: control-room moves are network changes; analog backup stays; and, in smaller writing: the sanctuary — this time, I asked.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="130" y="24" width="540" height="432" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="72" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#05070C" text-anchor="middle" >ROOMS · CHANGE LOG</text><text x="160" y="124" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >#4  Forum: room fine, remote silent.</text><text x="160" y="158" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Fri desk move (FAC-2231): 4 ports.</text><text x="160" y="204" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >CR-12 encoder audio + CR-14 interp</text><text x="160" y="238" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >→ office VLAN. No network change.</text><text x="160" y="284" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Priya moved both (emergency, logged).</text><text x="160" y="318" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Proof: phone off-network, 9:59.</text><text x="160" y="364" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Rule: control-room moves = network</text><text x="160" y="398" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >changes. Analog backup stays.</text><text x="160" y="438" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="18" font-weight="600" fill="#475569" text-anchor="start" >(The sanctuary: this time, I asked.)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>