="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="40" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#34D399" text-anchor="start" >Room output: FINE (confidence monitor, loudspeakers).</text><text x="40" y="336" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#F87171" text-anchor="start" >First failure point: the encoder's network-audio input.</text><text x="40" y="372" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FDE68A" text-anchor="start" >Room fine, remote silent — the same shape as the sanctuary stream.</text><text x="40" y="408" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="start" >Question before touching anything: what changed?</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>