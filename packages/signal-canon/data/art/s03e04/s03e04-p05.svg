<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e04-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e04-p05-t">System View of the town-hall audio path at 9:44: lectern mic, processor and AV stream all good; encoder input shows no stream; platform sends silence. Room output fine. First failure point: the encoder's network-audio input. Question before touching anything: what changed?</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="52" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · TOWN-HALL AUDIO · 9:44 · ILLUSTRATIVE</text><rect x="40" y="150" width="132" height="90" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="106.0" y="189.0" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle" >LECTERN MIC</text><text x="106.0" y="212.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >✓ meters</text><rect x="188" y="150" width="132" height="90" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3"/><text x="254.0" y="189.0" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle" >PROCESSOR</text><text x="254.0" y="212.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >✓ healthy</text><path d="M172 195 L188 195" fill="none" stroke="#22D3EE" stroke-width="5" stroke