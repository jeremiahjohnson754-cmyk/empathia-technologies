<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="pro06-p01-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="pro06-p01-t">A side view of the room: a center-fill loudspeaker tilted up at the ceiling. Its sound reaches seat 13 twice — directly, and late after bouncing off the ceiling.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect x="0" y="40" width="800" height="12" fill="#475569"/><text x="400" y="30" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#94A3B8" text-anchor="middle" >CEILING</text><rect x="0" y="420" width="800" height="60" fill="#2A1E16"/><g transform="rotate(-35 150 350)"><rect x="120" y="320" width="60" height="70" rx="6" fill="#1B2436" stroke="#05070C" stroke-width="4"/></g><path d="M170 330 L420 52 L660 360" fill="none" stroke="#F472B6" stroke-width="5" stroke-dasharray="12 8"/><path d="M180 350 L660 370" fill="none" stroke="#22D3EE" stroke-width="5"/><circle cx="668" cy="372" r="14" fill="#FBBF24" stroke="#05070C" stroke-width="3"/><text x="668" y="412" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FBBF24" text-anchor="middle" >SEAT 13</text><text x="470" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#FBCFE8" text-anchor="middle" >reflected (late)</text><text x="420" y="396" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#A5F3FC" text-anchor="middle" >direct (early)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>