<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e01-p11-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e01-p11-t">The vendor's change record: ring 1 was defined as ENG*, intended as four pilot rooms, and it matched 22. The new firmware changed the default input from LINE to USB.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="40" y="30" width="720" height="400" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><text x="56" y="64" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="30" font-weight="700" fill="#94A3B8" text-anchor="start" >VENDOR CHANGE RECORD · Sat 02:00</text><text x="56" y="106" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="30" font-weight="700" fill="#FBBF24" text-anchor="start" >ring 1 (pilot):  ENG*</text><text x="56" y="148" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="30" font-weight="700" fill="#E2E8F0" text-anchor="start" >intended:  4 pilot rooms</text><text x="56" y="190" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="30" font-weight="700" fill="#F87171" text-anchor="start" >matched:   22 rooms</text><text x="56" y="232" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="30" font-weight="700" fill="#F87171" text-anchor="start" >input:     LINE → USB</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>