<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e01-p14-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e01-p14-t">A reply from Kai: the lectures have sound again; someone emailed him the lab notes; he returned the headphones.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><g><rect x="230" y="20" width="340" height="440" rx="41" fill="#05070C"/><rect x="247" y="46" width="306" height="387" rx="20" fill="#0F1A2C"/><text x="400" y="84" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#94A3B8" text-anchor="middle" >Kai</text><text x="400" y="132" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" >the lectures have</text><text x="400" y="166" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" >sound again. also</text><text x="400" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" >someone emailed</text><text x="400" y="234" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" >me the lab notes.</text><text x="400" y="268" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" >thank you. i</text><text x="400" y="302" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" >returned the</text><text x="400" y="336" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle" >headphones.</text></g><rect width="800" height="4