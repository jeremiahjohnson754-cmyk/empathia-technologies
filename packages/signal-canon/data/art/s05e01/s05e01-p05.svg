<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e01-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e01-p05-t">A ticket on a phone screen, submitted at 2:14 a.m. by a student named Kai: all his Engineering lectures since Saturday have no sound.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><g><rect x="230" y="20" width="340" height="440" rx="41" fill="#05070C"/><rect x="247" y="46" width="306" height="387" rx="20" fill="#0F1A2C"/><text x="400" y="88" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#94A3B8" text-anchor="middle" >TICKET #88213</text><text x="400" y="142" font-family="Work Sans, system-ui, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC" text-anchor="middle" >All my Engineering</text><text x="400" y="178" font-family="Work Sans, system-ui, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC" text-anchor="middle" >lectures since</text><text x="400" y="214" font-family="Work Sans, system-ui, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC" text-anchor="middle" >Saturday have</text><text x="400" y="250" font-family="Work Sans, system-ui, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC" text-anchor="middle" >no sound.</text><text x="400" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#FBBF24" text-anchor="middle" >— Kai · 2:14 a.m.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>