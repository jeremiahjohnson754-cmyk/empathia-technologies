<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e10-p01-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e10-p01-t">The Old Mill gauge by the river at dusk in rain, the water high and fast, a barrier across the road in the foreground. A red marker near the top of the gauge reads 1964. Nobody is near the water.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg67" width="800" height="480"/><g><rect x="560" y="60" width="81" height="28" rx="14" fill="#7F1D1D"/><text x="600.64" y="80" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FECACA" text-anchor="middle" >1964 ▸</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>