<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s08e08-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s08e08-p03-t">An interface sheet before the fix: pull station, fire alarm panel and relay K3 — the fire alarm contractor's — in red; DSP logic input 3 and program mute — the AV contractor's — in blue; the link into the DSP is broken: input 3 jumpered, the relay on input 7, from punch 188 ‘tidy terminal strip’; a mute-time bar of relay 0.05 s, scan 0.1 s and ramp 0.5 s totalling 0.65 s against a 2 s line; the record says PASS, three weeks before punch 188.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >AV SHUTDOWN INTERFACE · SEQUENCE ITEM 7</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#CA8A04" text-anchor="end" >E-805</text><rect x="50" y="64" width="128" height="62" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/><text x="114" y="91" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" >PULL</text><text x="114" y="112" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" >STATION</text><rect x="192" y="64" width="128" height="62" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="4"/><text x="256" y="91" font-family="Work Sans, system-ui, sans-serif" font-