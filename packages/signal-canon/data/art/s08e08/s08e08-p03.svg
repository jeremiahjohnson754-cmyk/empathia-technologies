ze="14" font-weight="800" fill="#0369A1" text-anchor="middle" >the AV contractor's</text><rect x="460" y="176" width="270" height="46" rx="6" fill="#FEE2E2" stroke="#B91C1C" stroke-width="3"/><text x="595" y="205" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#B91C1C" text-anchor="middle" >in 3: JUMPER · in 7: relay</text><text x="250" y="205" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="middle" >punch 188 · ‘tidy terminal strip’</text><text x="70" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#475569" text-anchor="start" >mute time</text><rect x="190.0" y="252" width="12.0" height="24" fill="#DC2626"/><rect x="202.0" y="252" width="24.0" height="24" fill="#0EA5E9"/><rect x="226.0" y="252" width="120.0" height="24" fill="#6366F1"/><text x="354.0" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#0F172A" text-anchor="start" >0.65 s</text><text x="190" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="start" >relay 0.05 · scan 0.1 · ramp 0.5</text><line x1="670" y1="240" x2="670" y2="290" stroke="#0F172A" stroke-width="2" stroke-dasharray="5 4"/><text x="670.0" y="306" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >2 s allowed</text><text x="400" y="352" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#B91C1C" text-anchor="middle" >record says PASS — three weeks before punch 188</text><text x="400" y="386" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >timings illustrative (RV-163)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>