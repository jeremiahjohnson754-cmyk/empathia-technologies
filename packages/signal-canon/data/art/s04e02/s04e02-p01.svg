<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e02-p01-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e02-p01-t">The viewer inbox: fourteen new emails about the stream — lips wrong on the app, like a dubbed movie, the voice is early — and zero broadcast complaints. Tess and Maya read.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg55" width="800" height="480"/><rect x="130" y="50" width="540" height="250" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><rect x="130" y="50" width="540" height="40" rx="8" fill="#1E293B"/><text x="146" y="77" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FDA4AF" text-anchor="start" >INBOX · STREAM</text><text x="146" y="120" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" font-weight="700" fill="#94A3B8" text-anchor="start" >viewer mail · 14 new</text><text x="146" y="150" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="start" >“lips wrong on the app”</text><text x="146" y="180" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="start" >“dubbed movie??”</text><text x="146" y="210" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="start" >“it's early — the voice is early”</text><text x="146" y="240" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" font-weight="700" fill="#34D399" text-anchor="start" >broadcast complaints: 0</text><use href="../defs.svg#f-tess-R-worried" x="-4.0" y="220.0" width="156.2" height="250.0"/><use href="../defs.svg#f-maya-N-flat" x="648.0" y="220.0" width="156.2" height="250.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>