<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e02-p06-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e02-p06-t">A phone held up in master control shows the sync clip recorded off the stream: the flash on frame 26, the beep on frame 21 — stream minus five frames; broadcast zero.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg55" width="800" height="480"/><g><rect x="290" y="60" width="220" height="360" rx="26" fill="#05070C"/><rect x="301" y="82" width="198" height="317" rx="13" fill="#0F1A2C"/><rect x="304" y="96" width="192" height="130" fill="#F8FAFC"/><text x="400" y="256" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle" >FLASH · frame 26</text><text x="400" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FBBF24" text-anchor="middle" >BEEP · frame 21</text><text x="400" y="330" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F87171" text-anchor="middle" >stream: −5 frames</text><text x="400" y="366" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#34D399" text-anchor="middle" >broadcast: 0</text></g><use href="../defs.svg#f-maya-P-flat" x="40.0" y="210.0" width="162.5" height="260.0"/><use href="../defs.svg#f-tess-N-surprised" x="560.0" y="210.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>