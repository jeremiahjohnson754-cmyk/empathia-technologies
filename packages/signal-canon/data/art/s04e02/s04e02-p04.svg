<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e02-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e02-p04-t">A teaching moment: Maya and Tess beside a board. Time equals n times one over f-p-s. n is the number of frames you measured; f-p-s is the frame rate. At twenty-nine ninety-seven. Then work it out, and that's your delay.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg55" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" >t = n × (1 ÷ fps)</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#A7F3D0" text-anchor="middle" >n = frames · fps = frame rate</text><use href="../defs.svg#f-maya-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-tess-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>