<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s09e02-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s09e02-p04-t">The emergency-path sheet after the fix: the fire panel alarm drives a relay and a fixed slide on the exit screens; no emergency templates in the library; every publish needs two named approvals; the scheduler's date is empty until chosen; tested — the slide appears in 1.2 s, accepted by the marshal. Footer: signage repeats, it never originates.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >SIGNAGE · EMERGENCY PATH AFTER THE FIX</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#DB2777" text-anchor="end" >SEC-02</text><text x="60" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#64748B" text-anchor="start" >TIME</text><text x="210" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#64748B" text-anchor="start" >SOURCE</text><text x="360" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#64748B" text-anchor="start" >EVENT</text><text x="60" y="94" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start" >any time</text><text x="210" y="94" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >Fire panel</text><text x="360" y="94" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start" >ALARM → relay → fixed slide on exit screens</text><text x="60" y="130" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start" >any time</text><text x="210" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >CMS</text><text x="360" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start" >emergency templates: none in the library</text><text x="60" y="166" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start" >any time</text><text x="210" y="166" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >CMS</text><text x="360" y="166" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start" >every publish: two named approvals</text><text x="60" y="202" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start" >any time</text><text x="210" y="202" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >Scheduler</text><text x="360" y="202" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start" >date: empty until chosen</text><text x="60" y="238" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start" >tested</text><text x="210" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >Marshal</text><text x="360" y="238" font-family="Work Sans, sy