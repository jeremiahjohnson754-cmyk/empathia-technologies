<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s08e01-p01-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s08e01-p01-t">The Wyndmere Centre's main hall under construction: exposed steel, a raw concrete balcony front, a small tree tied to the last beam high above, which is already in place. Bram, the site superintendent, and Maya, both in hard hats and hi-vis, on the floor well clear of everything.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg97" width="800" height="480"/><rect x="330" y="22" width="140" height="22" fill="#A8A29E"/><path d="M400 22 L390 4 L410 4 Z" fill="#16A34A"/><text x="400" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FACC15" text-anchor="middle" >TOPPED OUT</text><use href="../defs.svg#f-bram-W-smile" x="80.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya_site-N-smile" x="540.0" y="190.0" width="168.8" height="270.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>