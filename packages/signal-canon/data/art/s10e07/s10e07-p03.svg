<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e07-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e07-p03-t">A hum sheet. Left: a spectrum of the guitar DI with bars at 60, 120, 180, 240 and 300 Hz — 60, 180 and 300 strongest, all well above the dashed noise floor. Right: a schematic — the amp on K3, the kitchen run; the DI box; the desk on T1; a dashed red loop through two earths.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >LIVE ROOM · HUM ON THE GUITAR DI</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >HM-07</text><rect x="90" y="64" width="300" height="200" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="120.0" y1="64" x2="120.0" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="120.0" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >60</text><line x1="180.0" y1="64" x2="180.0" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="180.0" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >120</text><line x1="240.0" y1="64" x2="240.0" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="240.0" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >180</text><line x1="300.0" y1="64" x2="300.0" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="300.0" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >240</text><line x1="360.0" y1="64" x2="360.0" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="360.0" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >300</text><line x1="90" y1="264.0" x2="390" y2="264.0" stroke="#E2E8F0" stroke-width="1"/><text x="84" y="268.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >-100</text><line x1="90" y1="206.9" x2="390" y2="206.9" stroke="#E2E8F0" stroke-width="1"/><text x="84" y="210.9" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >-80</text><line x1="90" y1="149.7" x2="390" y2="149.7" stroke="#E2E8F0" stroke-width="1"/><text x="84" y="153.7" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >-60</text><line x1="90" y1="92.6" x2="390" y2="92.6" stroke="#E2E8F0" stroke-width="1"/><text x="84" y="96.6" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >-40</text><text x="240.0" y="298" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" text-anchor="middle" >frequency (Hz)</text><text x="46" y="164.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" text-anchor="middle" transform="rotate(-90 46 164.0)">level (dBFS)</text><rect x="111.0" y="104.0" width="18" height="160.0" fill="#DC2626"/><rect x="171.0" y="158.3" width="18" height="105.7" fill="#F59E0B"/><rect x="231.0" y="115.4" width="18" height="148.6" fill="#DC2626"/><rect x="291.0" y="178.3" width="18" height="85.7" fill="#F59E0B"/><rect x="351.0" y="138.3" width="18" height="125.7" fill="#DC2626"/><line x1="90" y1="235.4" x2="390" y2="235.4" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4"/><text x="90" y="50" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="start" >dashed: the recording's noise floor · 60 Hz and its harmonics</text><rect x="450" y="70" width="130" height="54" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/><text x="515" y="93" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" >AMP</text><text x="515" y="113" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle" >K3 · kitchen run</text><rect x="600" y="70" width="130" height="54" rx="8" fill="#FFFFFF" stroke="#0369A1" stroke-width="3"/><text x="665" y="93" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" >DI BOX</text><text x="665" y="113" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369A1" text-anchor="middle" >audio lift only</text><rect x="600" y="190" width="130" height="54" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/><text x="665" y="213" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" >DESK</text><text x="665" y="233" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#16A34A" text-anchor="middle" >T1 · technical</text><rect x="450" y="190" width="130" height="54" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/><text x="515" y="213" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" >EARTH</text><text x="515" y="233" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle" >two earths</text><path d="M580 97 L600 97 M665 124 L665 190" stroke="#334155" stroke-width="4" fill="none"/><path d="M515 124 L515 190 M600 217 L580 217" stroke="#DC2626" stroke-width="4" fill="none" stroke-dasharray="7 5"/><text x="590" y="160" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="900" fill="#B91C1C" text-anchor="middle" >loop</text><text x="400" y="318" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#B91C1C" text-anchor="middle" >hum at 60 Hz with a strong 180 and 300 — a ground loop through the DI's shield</text><text x="400" y="346" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >fₙ = n × 60 · amp and desk on different circuits</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >levels illustrative (RV-177) · never lift a protective earth (RV-178)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>