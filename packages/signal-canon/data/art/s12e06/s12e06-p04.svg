<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s12e06-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s12e06-p04-t">The same timeline with synthetic tests: the room muted on day one is caught fourteen minutes later; the test lane blue every 30 minutes. t̄ = T ÷ 2 = 15 minutes on average; alerts to the EMEA on-call role; the privacy preset now clears at the end of each booking.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >LAGOS ROOM 3 · WHAT MONITORING SAW</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#334155" text-anchor="end" >MN-06</text><rect x="190" y="60" width="520" height="150" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="190.0" y1="60" x2="190.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="190.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >day 0</text><line x1="313.8" y1="60" x2="313.8" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="313.8" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >day 5</text><line x1="437.6" y1="60" x2="437.6" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="437.6" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >day 10</text><line x1="561.4" y1="60" x2="561.4" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="561.4" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >day 15</text><line x1="685.2" y1="60" x2="685.2" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="685.2" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >day 20</text><text x="182" y="92" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end" >devices answer</text><text x="182" y="134" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end" >room can be heard</text><text x="182" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end" >synthetic test</text><rect x="190.0" y="76" width="520.0" height="22" fill="#16A34A"/><text x="450.0" y="92" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" >green every day</text><rect x="190.0" y="118" width="24.8" height="22" fill="#16A34A"/><rect x="214.8" y="118" width="0.2" height="22" fill="#DC2626"/><rect x="215.0" y="118" width="495.0" height="22" fill="#16A34A"/><rect x="190.0" y="160" width="520.0" height="22" fill="#0EA5E9"/><text x="450.0" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" >every 30 min · caught on day 1, 14 min after it muted</text><text x="400" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#15803D" text-anchor="middle" >t̄ = T ÷ 2 = 30 ÷ 2 = 15 min on average · alerts to the EMEA on-call role</text><text x="400" y="298" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle" >the privacy preset now clears at the end of each booking</text><text x="400" y="398" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-188)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>