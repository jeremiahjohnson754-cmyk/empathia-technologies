<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e08-p22-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e08-p22-t">Maya's checklist, version 3: run it after the last room change. Comms, every source full screen, every mic at show level, the floor, freeze at doors with changes to the log and the stage manager. At the bottom: carts never park on pockets — mine.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><g transform="rotate(-2 400.0 230.0)"><rect x="150" y="40" width="500" height="380" rx="6" fill="#F4F1E8" stroke="#05070C" stroke-width="5"/><line x1="164" y1="88" x2="636" y2="88" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="124" x2="636" y2="124" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="160" x2="636" y2="160" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="196" x2="636" y2="196" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="232" x2="636" y2="232" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="268" x2="636" y2="268" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="304" x2="636" y2="304" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="340" x2="636" y2="340" stroke="#9FB3C8" stroke-width="1.5"/><line x1="164" y1="376" x2="636" y2="376" stroke="#9FB3C8" stroke-width="1.5"/><line x1="194" y1="48" x2="194" y2="412" stroke="#E57373" stroke-width="2"/><text x="204" y="82" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >PRE-SHOW CHECKLIST v3</text><text x="204" y="118" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#DC2626" text-anchor="start" >Run it AFTER the last room change</text><text x="204" y="154" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >1. Comms + SM channel</text><text x="204" y="190" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >2. Every source, full screen</text><text x="204" y="226" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >3. Every mic at show level</text><text x="204" y="262" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#0B1220" text-anchor="start" >4. Floor: pockets, ramps, paths</text><text x="204" y="298" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#047857" text-anchor="start" >5. Freeze at doors → log → SM</text><text x="204" y="334" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" >Carts never park on pockets. (Mine.)</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>