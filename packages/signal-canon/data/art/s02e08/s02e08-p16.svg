<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e08-p16-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e08-p16-t">A yellow card taped across the console: Show file frozen, 6:55. Changes go to the log, then to Rosa. Rosa, the stage manager, stands beside it in her headset.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg11" width="800" height="480"/><rect x="203" y="332" width="130" height="25" rx="4" fill="#081018" stroke="#8FA3BE" stroke-width="2"/><text x="268" y="349" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#8FA3BE" text-anchor="middle" >FOH · HALYARD</text><rect x="220" y="210" width="360" height="90" rx="6" fill="#FDE68A" stroke="#05070C" stroke-width="4" transform="rotate(-3 400 255)"/><text x="400" y="250" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#05070C" text-anchor="middle" transform="rotate(-3 400 255)">SHOW FILE FROZEN · 6:55</text><text x="400" y="282" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#7C2D12" text-anchor="middle" transform="rotate(-3 400 255)">changes → the log → Rosa</text><use href="../defs.svg#f-rosa-N-smile" x="600.0" y="180.0" width="168.8" height="270.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>