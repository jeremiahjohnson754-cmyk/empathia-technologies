<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s11e07-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s11e07-p05-t">The roster sheet as the director signed it: Maya 06:00–18:00, Kit and a trained dispatcher 18:00–06:00, a dashed line at 18:00 marked ‘written handover’; twelve on, ten off, two people who can run the gateway.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >ENGINEERING ROSTER · THE SECOND STORM</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="end" >RS-07</text><rect x="196" y="60" width="540" height="150" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="196.0" y1="60" x2="196.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="196.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >06:00</text><line x1="286.0" y1="60" x2="286.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="286.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >10:00</text><line x1="376.0" y1="60" x2="376.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="376.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >14:00</text><line x1="466.0" y1="60" x2="466.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="466.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >18:00</text><line x1="556.0" y1="60" x2="556.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="556.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >22:00</text><line x1="646.0" y1="60" x2="646.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="646.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >02:00</text><line x1="736.0" y1="60" x2="736.0" y2="210" stroke="#E2E8F0" stroke-width="1"/><text x="736.0" y="227" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" >06:00</text><text x="466.0" y="244" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="middle" >Tuesday 06:00 → Wednesday 06:00</text><text x="188" y="97" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end" >Maya</text><text x="188" y="139" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end" >Kit</text><text x="188" y="181" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="end" >dispatcher (trained)</text><rect x="196.0" y="80" width="270.0" height="24" fill="#16A34A"/><rect x="466.0" y="122" width="270.0" height="24" fill="#16A34A"/><rect x="466.0" y="164" width="270.0" height="24" fill="#0EA5E9"/><line x1="466.0" y1="72" x2="466.0" y2="196" stroke="#0F172A" stroke-width="3" stroke-dasharray="5 4"/><text x="472.0" y="74" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#15803D" text-anchor="start" >written handover 18:00</text><text x="400" y="300" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#15803D" text-anchor="middle" >12 on, 10 off · a written handover at every change</text><text x="400" y="328" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >two people who can run the gateway · the roster is the director's, and she enforces it</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-183) · not medical advice (RV-185)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>