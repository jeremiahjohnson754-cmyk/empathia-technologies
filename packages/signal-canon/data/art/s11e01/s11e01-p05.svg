<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s11e01-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s11e01-p05-t">A handover brief template filled in for operational period 7: situation — the Sable at 17.2 feet and rising, crest expected at 23:00; pending — Mill Road sandbags, requested 05:40, WORKS en route; resources; hazards; who's who; next brief at 19:00, written, read aloud and signed by both leads.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >HANDOVER BRIEF · OPERATIONAL PERIOD 7</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#EF4444" text-anchor="end" >OP-02</text><rect x="46" y="46" width="708" height="36" rx="4" fill="#F1F5F9"/><text x="60" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Situation</text><text x="210" y="70" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Sable at 17.2 ft and rising · crest expected 23:00</text><rect x="46" y="90" width="708" height="36" rx="4" fill="#F1F5F9"/><text x="60" y="114" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Pending</text><text x="210" y="114" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Mill Road sandbags — requested 05:40, WORKS en route</text><rect x="46" y="134" width="708" height="36" rx="4" fill="#F1F5F9"/><text x="60" y="158" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Resources</text><text x="210" y="158" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >2 swift-water teams staged · shelter at the high school open</text><rect x="46" y="178" width="708" height="36" rx="4" fill="#F1F5F9"/><text x="60" y="202" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Hazards</text><text x="210" y="202" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Low-water crossings on Route 9 · carrier A flapping</text><rect x="46" y="222" width="708" height="36" rx="4" fill="#F1F5F9"/><text x="60" y="246" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Who's who</text><text x="210" y="246" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >Incident commander Oduya · night lead Quino → day lead Ruiz</text><rect x="46" y="266" width="708" height="36" rx="4" fill="#F1F5F9"/><text x="60" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="start" >Next brief</text><text x="210" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" >19:00 · written, read aloud, signed by both leads</text><text x="400" y="350" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#15803D" text-anchor="middle" >written · read aloud · signed — it survives a dark wall</text><text x="400" y="394