<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s08e07-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s08e07-p03-t">A plan of the main hall drawn to scale: the stage, the proscenium line, the ground-stack on the deck five metres upstage, the planned cluster three metres in front of the proscenium, and the back row at twenty-five metres. A line from the stack to the back row reads 30 m; a dashed line from the cluster reads 22 m; the heading reads 20 × log10(30 ÷ 22) ≈ 2.7 dB quieter at the back on the stack.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >MAIN HALL · PLAN · REHEARSAL vs DESIGN</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#CA8A04" text-anchor="end" >A-801</text><rect x="34" y="100" width="216" height="240" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/><text x="88" y="334" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#475569" text-anchor="middle" >STAGE</text><line x1="250" y1="92" x2="250" y2="348" stroke="#0F172A" stroke-width="6"/><text x="250" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle" >proscenium</text><line x1="358" y1="118" x2="358" y2="172" stroke="#CBD5E1" stroke-width="3"/><line x1="358" y1="268" x2="358" y2="322" stroke="#CBD5E1" stroke-width="3