<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e01-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e01-p05-t">A clock map after the fix: the interface is the one leader; the stage boxes and cue mixers follow the network; the converter follows the interface over a word-clock cable; the old generator is marked spare, not in the chain. Note: the generator would also have been one leader — Hollis chose the interface.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >STUDIO A · WHO FOLLOWS WHOM</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >CLK-02</text><rect x="290" y="56" width="220" height="62" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><text x="400.0" y="82" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" >INTERFACE</text><text x="400.0" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#16A34A" text-anchor="middle" >LEADER · audio network</text><circle cx="498" cy="68" r="7" fill="#16A34A"/><rect x="60" y="200" width="190" height="62" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><text x="155.0" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" >STAGE BOXES</text><text x="155.0" y="248" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#16A34A" text-anchor="middle" >follow the network</text><rect x="305" y="200" width="190" height="62" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><text x="400.0" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" >CUE MIXERS</text><text x="400.0" y="248" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#16A34A" text-anchor="middle" >follow the network</text><path d="M400 118 L155 200 M400 118 L400 200" stroke="#16A34A" stroke-width="4" fill="none"/><rect x="550" y="200" width="190" height="62" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><text x="645.0" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" >CONVERTER</text><text x="645.0" y="248" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#16A34A" text-anchor="middle" >follows · word clock</text><path d="M470 118 L645 200" stroke="#16A34A" stroke-width="4" fill="none"/><text x="600" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#15803D" text-anchor="middle" >word clock</text><rect x="550" y="290" width="190" height="62" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4"/><text x="645.0" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" >OLD GENERATOR</text><text x="645.0" y="338" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#94A3B8" text-anchor="middle" >spare · not in the chain</text><text x="290" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="900" fill="#15803D" text-anchor="middle" >one leader · everything else follows</text><text x="290" y="344" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >the generator could lead instead — one leader either way</text><text x="400" y="390" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-177)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>