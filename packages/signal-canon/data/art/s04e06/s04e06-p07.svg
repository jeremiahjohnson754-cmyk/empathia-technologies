<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e06-p07-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e06-p07-t">System View: the encoder feeds four bonded modems, each carrying about 3.4 Mb/s usable in the crowd, into the station's receiver with a two-second buffer. The reporter's earpiece shows its source.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".92"/><text x="40" y="52" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · STADIUM → STATION · 8:40 P.M. · ILLUSTRATIVE</text><rect x="40" y="90" width="170" height="60" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3" data-dg="1"/><text x="125.0" y="114.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#F87171" text-anchor="middle" >ENCODER</text><text x="125.0" y="137.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >FIXED 12 Mb/s ✕</text><rect x="260" y="60" width="170" height="56" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="3" data-dg="1"/><text x="345.0" y="82.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >MODEM 1</text><text x="345.0" y="105.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >3.4 Mb/s usable</text><path d="M210 120 C235 120 240 88 260 88" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M210 120 C235 120 240 88 260 88" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="260" y="132" width="170" height="56" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="3" data-dg="1"/><text x="345.0" y="154.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >MODEM 2</text><text x="345.0" y="177.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >3.4 Mb/s usable</text><path d="M210 120 C235 120 240 160 260 160" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M210 120 C235 120 240 160 260 160" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="260" y="204" width="170" height="56" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="3" data-dg="1"/><text x="345.0" y="226.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >MODEM 3</text><text x="345.0" y="249.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >3.4 Mb/s usable</text><path d="M210 120 C235 120 240 232 260 232" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M210 120 C235 120 240 232 260 232" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="260" y="276" width="170" height="56" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="3" data-dg="1"/><text x="345.0" y="298.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24" text-anchor="middle" >MODEM 4</text><text x="345.0" y="321.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >3.4 Mb/s usable</text><path d="M210 120 C235 120 240 304 260 304" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M210 120 C235 120 240 304 260 304" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><rect x="500" y="150" width="230" height="60" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="3" data-dg="1"/><text x="615.0" y="174.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >STATION RECEIVER</text><text x="615.0" y="197.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >2 s buffer</text><text x="345" y="380" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#94A3B8" text-anchor="middle" >20,000 phones share these cells</text><text x="400" y="420" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#FDE68A" text-anchor="middle" >4 × 3.4 = 13.6 Mb/s usable — IF all four hold. Fixed 12 leaves no room.</text><rect x="500" y="280" width="230" height="60" rx="10" fill="#0F172A" stroke="#F87171" stroke-width="3" data-dg="1"/><text x="615.0" y="304.0" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#F87171" text-anchor="middle" >REPORTER EARPIECE</text><text x="615.0" y="327.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle" >program return (2 s) ✕</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>