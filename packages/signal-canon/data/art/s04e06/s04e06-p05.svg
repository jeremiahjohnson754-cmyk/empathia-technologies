<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s04e06-p05-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s04e06-p05-t">The bonded kit's status: four modems all with signal bars, each carrying only 2 to 3 Mb/s; the encoder fixed at 12 Mb/s, dropped three times.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg11" width="800" height="480"/><rect x="130" y="50" width="540" height="260" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5" data-dg="1"/><rect x="130" y="50" width="540" height="40" rx="8" fill="#1E293B"/><text x="146" y="77" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FDA4AF" text-anchor="start" >BONDED KIT</text><text x="146" y="120" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" >MODEM 1  ▂▄▆  3.1 Mb/s</text><text x="146" y="149" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" >MODEM 2  ▂▄▆  2.8 Mb/s</text><text x="146" y="178" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#F87171" text-anchor="start" >MODEM 3  ▂▄_  2.2 Mb/s</text><text x="146" y="207" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#FBBF24" text-anchor="start" >MODEM 4  ▂▄▆  3.0 Mb/s</text><text x="146" y="236" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" font-weight="700" fill="#F87171" text-anchor="start" >ENCODER: FIXED 12.0 Mb/s · DROPPED ×3</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>