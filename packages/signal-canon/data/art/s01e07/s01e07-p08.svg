<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e07-p08-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e07-p08-t">A two-column card. Banding: a time problem — dark bars that roll, the wall's refresh against the camera's exposure timing, changes with shutter, room eye fine. Moiré: a space problem — rainbow ripples, the wall's pixel grid against the camera's sensor grid, changes with zoom, focus and angle.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect x="40" y="40" width="340" height="400" rx="12" fill="#101826" stroke="#FBBF24" stroke-width="4"/><text x="210" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="30" font-weight="800" fill="#FBBF24" text-anchor="middle" >BANDING</text><text x="210" y="124" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#F4F1E8" text-anchor="middle" >a TIME problem</text><text x="64" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >Dark bars that roll</text><text x="64" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >Wall refresh vs camera</text><text x="64" y="256" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >  exposure timing</text><text x="64" y="296" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >Changes with SHUTTER</text><text x="64" y="336" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >Room eye: fine</text><rect x="420" y="40" width="340" height="400" rx="12" fill="#101826" stroke="#F472B6" stroke-width="4"/><text x="590" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="30" font-weight="800" fill="#F472B6" text-anchor="middle" >MOIRÉ</text><text x="590" y="124" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#F4F1E8" text-anchor="middle" >a SPACE problem</text><text x="444" y="176" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >Rainbow ripples</text><text x="444" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >Pixel grid vs sensor</text><text x="444" y="256" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >  grid interfering</text><text x="444" y="296" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >Changes with ZOOM,</text><text x="444" y="336" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="600" fill="#CBD5E1" text-anchor="start" >  FOCUS, ANGLE</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>