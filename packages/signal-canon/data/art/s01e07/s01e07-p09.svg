<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e07-p09-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e07-p09-t">A teaching moment: Ray and Maya beside a board. The wall redraws thousands of times a second — its refresh rate. The camera only looks for a sliver of time — its shutter. So how many redraws per look? Refresh times shutter. Three thousand eight hundred forty times one-fiftieth of a second: seventy-six point eight. That point-eight is your stripe.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg0" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="700" fill="#F4F1E8" text-anchor="middle" >cycles = f_refresh × t_shutter</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#A7F3D0" text-anchor="middle" >3,840 × 0.02 = 76.8</text><use href="../defs.svg#f-ray-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>