<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e07-p11-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e07-p11-t">System View timing diagram before the fix: the wall refreshes at 50 Hz while the camera exposes 59.94 frames per second with an automatic 1/100 shutter. Each frame catches a different slice of the refresh, so the brightness varies from frame to frame and dark bands roll.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="30" y="50" width="740" height="380" rx="10" fill="#05070C" opacity=".85"/><text x="50" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >TIMING · ILLUSTRATIVE, NOT TO SCALE</text><text x="50" y="132" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="start" >WALL PROCESSOR 50 Hz (refresh)</text><rect x="60" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="94" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="128" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="162" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="196" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="230" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="264" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="298" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="332" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="366" y="146" width="17" height="40" fill="#FBBF24" opacity=".8"/><rect x="400" y="146" width="