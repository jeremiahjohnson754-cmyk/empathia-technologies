ll="#8FA3BE" text-anchor="start" >LIGHT EACH FRAME CATCHES</text><text x="400" y="396" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#EF4444" text-anchor="middle" >Each frame catches a different slice → bands that roll</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>