<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e07-p22-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e07-p22-t">Change log entry #8: 'Rental wall: factory reset at 2 p.m. put it back to 50 Hz. Restored from settings sheet. Rule: after any rental service, re-check the sheet and a camera. Dimmed wall: plan a no-wall shot.'</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="160" y="30" width="480" height="420" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="80" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#05070C" text-anchor="middle" >BOOTH CHANGE LOG</text><text x="190" y="136" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >#8  Rental wall: factory reset</text><text x="190" y="170" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >at 2 p.m. put it back to 50 Hz.</text><text x="190" y="218" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#047857" text-anchor="start" >Restored from settings sheet.</text><text x="190" y="266" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#B45309" text-anchor="start" >Rule: after ANY rental service,</text><text x="190" y="300" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#B45309" text-anchor="start" >re-check the sheet + a camera.</text><text x="190" y="348" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#047857" text-anchor="start" >Dimmed wall: plan a no-wall shot.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>