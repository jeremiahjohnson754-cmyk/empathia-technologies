weight="600" fill="#047857" text-anchor="start" >Input: 59.94 Hz</text><text x="114" y="164" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Refresh: ×16 of input</text><text x="114" y="200" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Brightness: 40% (service)</text><text x="114" y="236" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Cams: 59.94p, shutter 1/60</text><text x="114" y="272" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >Cam 2: focus on people, not wall</text></g><use href="../defs.svg#f-maya-H-smile" x="540.0" y="200.0" width="168.8" height="270.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>