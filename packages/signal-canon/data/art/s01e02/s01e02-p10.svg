<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e02-p10-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e02-p10-t">Maya opens her mouth, then closes it. Her notebook: 'Mud = 250–500. Cut it. WORKED.' Below it she writes: 'WHY did it work?'</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><g transform="rotate(-2 280.0 195.0)"><rect x="80" y="70" width="400" height="250" rx="6" fill="#F4F1E8" stroke="#05070C" stroke-width="5"/><line x1="94" y1="118" x2="466" y2="118" stroke="#9FB3C8" stroke-width="1.5"/><line x1="94" y1="154" x2="466" y2="154" stroke="#9FB3C8" stroke-width="1.5"/><line x1="94" y1="190" x2="466" y2="190" stroke="#9FB3C8" stroke-width="1.5"/><line x1="94" y1="226" x2="466" y2="226" stroke="#9FB3C8" stroke-width="1.5"/><line x1="94" y1="262" x2="466" y2="262" stroke="#9FB3C8" stroke-width="1.5"/><line x1="124" y1="78" x2="124" y2="312" stroke="#E57373" stroke-width="2"/><text x="134" y="112" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="600" fill="#0B1220" text-anchor="start" >Mud = 250–500. Cut it.</text><text x="134" y="148" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="600" fill="#047857" text-anchor="start" >WORKED.</text><text x="134" y="184" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="28" font-weight="600" fill="#B45309" text-anchor="start" >…WHY did it work?</text></g><use href="../defs.svg#f-maya-N-worried" x="540.0" y="180.0" width="181.2" height="290.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>