<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e02-p41-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e02-p41-t">Maya's notebook rewrites the old field note: '250 to 500 hertz is a place to look, not a rule — it depends on the voice and the room. Match the level before you judge. Fix it at the earliest stage you can reach.'</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><g transform="rotate(-1 400.0 230.0)"><rect x="50" y="30" width="700" height="400" rx="6" fill="#F4F1E8" stroke="#05070C" stroke-width="5"/><line x1="64" y1="78" x2="736" y2="78" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="114" x2="736" y2="114" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="150" x2="736" y2="150" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="186" x2="736" y2="186" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="222" x2="736" y2="222" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="258" x2="736" y2="258" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="294" x2="736" y2="294" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="330" x2="736" y2="330" stroke="#9FB3C8" stroke-width="1.5"/><line x1="64" y1="366" x2="736" y2="366" stroke="#9FB3C8" stroke-width="1.5"/><line x1="94" y1="38" x2="94" y2="422" stroke="#E57373" stroke-width="2"/><text x="104" y="72" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="600" fill="#0B1220" text-anchor="start" >250–500 Hz is a place to LOOK, not a rule —</text><text x="104" y="108" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="600" fill="#0B1220" text-anchor="start" >it depends on the voice and the room.</text><text x="104" y="144" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="600" fill="#047857" text-anchor="start" >Match the level before you judge.</text><text x="104" y="180" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="600" fill="#047857" text-anchor="start" >Fix it at the earliest stage you can reach.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>