<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e09-p17-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e09-p17-t">System View: what a log can say. Left, the shared account 'aldermoor-av': was it Ray, the vendor, a former technician, anyone who saw the notebook? Right, a named account: who, when, what device, approved by whom, ended by expiry. Caption: trust isn't the question; telling people apart is.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#C084FC" text-anchor="start" >WHO WAS IT? · WHAT A LOG CAN SAY · ILLUSTRATIVE</text><rect x="40" y="80" width="350" height="330" rx="12" fill="#111827" stroke="#FBBF24" stroke-width="4"/><text x="215" y="116" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FBBF24" text-anchor="middle" >SHARED ACCOUNT</text><text x="215" y="146" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F4F1E8" text-anchor="middle" >“aldermoor-av”</text><text x="70" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FDE68A" text-anchor="start" >Ray?</text><text x="70" y="236" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FDE68A" text-anchor="start" >the vendor?</text><text x="70" y="276" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FDE68A" text-anchor="start" >a former tech?</text><text x="70" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FDE68A" text-anchor="start" >anyone who saw</text><text x="70" y="356" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FDE68A" text-anchor="start" >  the notebook?</text><rect x="410" y="80" width="350" height="330" rx="12" fill="#111827" stroke="#34D399" stroke-width="4"/><text x="585" y="116" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#34D399" text-anchor="middle" >NAMED ACCOUNT</text><text x="585" y="146" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#F4F1E8" text-anchor="middle" >one person, one login</text><text x="440" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#BBF7D0" text-anchor="start" >who: a named person</text><text x="440" y="236" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#BBF7D0" text-anchor="start" >when: 23:40–23:52</text><text x="440" y="276" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#BBF7D0" text-anchor="start" >what: processor only</text><text x="440" y="316" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#BBF7D0" text-anchor="start" >approved by: security</text><text x="440" y="356" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#BBF7D0" text-anchor="start" >ended by: expiry</text><text x="40" y="440" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#E9D5FF" text-anchor="start" >Trust isn't the question. Telling people apart is.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>