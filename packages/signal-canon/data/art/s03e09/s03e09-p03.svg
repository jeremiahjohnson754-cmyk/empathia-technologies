<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e09-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e09-p03-t">Close-up of the room computer's install dialog: install remote support agent? It stays running after the session, runs as administrator, lets the vendor connect any time, with no approval step. Install and Cancel buttons.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="120" y="50" width="560" height="340" rx="12" fill="#1F2937" stroke="#05070C" stroke-width="5"/><rect x="136" y="66" width="528" height="300" fill="#0F172A"/><text x="400" y="110" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC" text-anchor="middle" >INSTALL REMOTE SUPPORT AGENT?</text><text x="170" y="160" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FECACA" text-anchor="start" >• stays running after the session</text><text x="170" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FECACA" text-anchor="start" >• runs as administrator</text><text x="170" y="232" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FECACA" text-anchor="start" >• vendor can connect any time</text><text x="170" y="268" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FECACA" text-anchor="start" >• no approval step</text><rect x="230" y="300" width="150" height="44" rx="8" fill="#2563EB"/><text x="305" y="329" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle" >INSTALL</text><rect x="420" y="300" width="150" height="44" rx="8" fill="#334155"/><text x="495" y="329" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle" >CANCEL</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>