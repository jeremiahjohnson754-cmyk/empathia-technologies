<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e09-p06-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e09-p06-t">System View comparing two access models. Left, in red, the always-on agent: open from outside any time, runs as administrator, shared vendor account, reaches the whole room network, no record on our side, nobody here can end it. Right, in green, a supervised session: named account with a second factor, approved by security, a two-hour window that expires, the processor only via the approved path, recorded with Maya watching, and it can be ended any second.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#C084FC" text-anchor="start" >TWO WAYS IN · ACCESS MODELS · ILLUSTRATIVE, GENERIC</text><rect x="40" y="76" width="350" height="360" rx="12" fill="#1F0A0A" stroke="#EF4444" stroke-width="4"/><text x="215" y="110" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#EF4444" text-anchor="middle" >ALWAYS-ON AGENT</text><text x="62" y="156" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >✕ open from outside, any time</text><text x="62" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >✕ runs as administrator</text><text x="62" y="244" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >✕ shared vendor account</text><text x="62" y="288" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >✕ reaches the whole network</text><text x="62" y="332" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >✕ no record on our side</text><text x="62" y="376" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#FECACA" text-anchor="start" >✕ nobody here can end it</text><rect x="410" y="76" width="350" height="360" rx="12" fill="#052E1F" stroke="#34D399" stroke-width="4"/><text x="585" y="110" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#34D399" text-anchor="middle" >SUPERVISED SESSION</text><text x="432" y="156" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >✓ named account + 2nd factor</text><text x="432" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >✓ approved by security</text><text x="432" y="244" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >✓ 2-hour window, expires</text><text x="432" y="288" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >✓ processor only</text><text x="432" y="332" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >✓ recorded, Maya watching</text><text x="432" y="376" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#BBF7D0" text-anchor="start" >✓ we can end it any second</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>