<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s07e10-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s07e10-p04-t">The operations sheet after the fixes: no rooms flapping; site thresholds imported (360 s for the 120 s sites); a green suppression box — heartbeat flaps only, owner Yuki, expires 06:00; UPS load shed to 700 W and utility back at 04:25; the old regional systems running in parallel for 14 days.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >GLOBAL OPERATIONS · 03:25 UTC</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#2DD4BF" text-anchor="end" >NOC-1</text><text x="400" y="86" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="900" fill="#15803D" text-anchor="middle" >0 rooms flapping · site thresholds imported</text><text x="400" y="124" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle" >120 s sites: timeout 360 s (3 × 120)</text><rect x="90" y="150" width="620" height="76" rx="10" fill="#DCFCE7" stroke="#15803D" stroke-width="3"/><text x="400" y="198" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#15803D" text-anchor="middle" >suppression: heartbeat flaps only · owner Yuki · until 06:00</text><text x="400" y="270" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="900" fill="#15803D" text-anchor="middle" >UPS: facilities shed load (700 W) · utility back 04:25</text><text x="400" y="306" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle" >old regional systems in parallel for 14 days</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>