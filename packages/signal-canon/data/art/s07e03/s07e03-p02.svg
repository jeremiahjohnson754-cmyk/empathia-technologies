<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s07e03-p02-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s07e03-p02-t">A licence sheet: a timeline from the 31 March renewal through a 14-day grace period to 00:00 UTC on 15 April, fifteen hours before the AGM. A bar: 910 real rooms, 290 grey ghosts. Notes: order bounced, owner left, nobody alerted.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >ROOM LICENCES · RENEWAL</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#2DD4BF" text-anchor="end" >LIC-2026</text><text x="70" y="76" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" >31 MAR renewal → 14-day grace → 15 APR 00:00 UTC</text><text x="70" y="100" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" >→ 15 h later: AGM goes live (15:00 UTC)</text><rect x="70" y="118" width="500.5" height="64" fill="#0D9488" stroke="#0F172A" stroke-width="2"/><rect x="570.5" y="118" width="159.5" height="64" fill="#94A3B8" stroke="#0F172A" stroke-width="2"/><text x="320.25" y="158" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC" text-anchor="middle" >910 real rooms</text><text x="650.25" y="158" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#0F172A" text-anchor="middle" >290 ghosts</text><text x="70" y="226" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#B91C1C" text-anchor="start" >order bounced · owner left in January</text><text x="70" y="262" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#B91C1C" text-anchor="start" >1,200 × $150 = $180,000 a year</text><text x="70" y="298" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#B91C1C" text-anchor="start" >290 ghosts = $43,500 a year for nothing</text><text x="70" y="334" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#B91C1C" text-anchor="start" >features stop 15 h before the AGM</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>