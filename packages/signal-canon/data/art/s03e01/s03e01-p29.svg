<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e01-p29-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e01-p29-t">Sam at his desk, reading a new ticket on his monitor: Harbor Room, priority 2. A remote participant writes: I can hear myself in the Harbor Room. Only the Harbor Room.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><use href="../defs.svg#f-sam-N-flat" x="60.0" y="190.0" width="175.0" height="280.0"/><rect x="300" y="90" width="440" height="230" rx="6" fill="#05070C" stroke="#1F2937" stroke-width="5"/><rect x="308" y="98" width="424" height="214" fill="#0F172A"/><text x="320" y="140" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#93C5FD" text-anchor="start" >TICKET · HARBOR ROOM · P2</text><text x="320" y="186" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="start" >Remote participant:</text><text x="320" y="220" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="start" >“I can hear myself in the</text><text x="320" y="250" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="start" >Harbor Room. Only the Harbor</text><text x="320" y="280" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FBBF24" text-anchor="start" >Room.”</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>