<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e01-p15-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e01-p15-t">System View: a restarted room computer signs in to the identity service; Friday's policy sees a password 912 days old and demands a new one; a room can't type, so it is signed out. Laptops belonging to people sign in fine.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="56" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#8FA3BE" text-anchor="start" >SYSTEM VIEW · ROOM SIGN-IN · ILLUSTRATIVE</text><rect x="30" y="100" width="210" height="90" rx="10" fill="#0F172A" stroke="#93C5FD" stroke-width="3"/><text x="135.0" y="139.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#93C5FD" text-anchor="middle" >ROOM COMPUTER</text><text x="135.0" y="163.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >Summit · restart Sun 02:00</text><rect x="295" y="100" width="210" height="90" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="3"/><text x="400.0" y="139.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#C084FC" text-anchor="middle" >IDENTITY SERVICE</text><text x="400.0" y="163.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >owned: identity team</text><rect x="560" y="100" width="210" height="90" rx="10" fill="#0F172A" stroke="#FBBF24" stroke-width="3"/><text x="665.0" y="139.0" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="middle" >POLICY (FRI 18:00)</text><text x="665.0" y="163.0" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#CBD5E1" text-anchor="middle" >age > 90 days → change</text><path d="M240 145 L295 145" fill="none" stroke="#34D399" stroke-width="5" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.95"/><path d="M240 145 L295 145" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="268" y="90" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle" >sign in</text><path d="M505 145 L560 145" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M505 145 L560 145" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="400" y="236" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#FBBF24" text-anchor="middle" >Room account password age: 912 days (set at install)</text><path d="M665 190 C665 300 620 335 550 335" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M665 190 C665 300 620 335 550 335" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="640" y="290" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="800" fill="#C084FC" text-anchor="middle" >“choose a new password”</text><rect x="250" y="300" width="300" height="70" rx="10" fill="#1F0A0A" stroke="#F87171" stroke-width="3"/><text x="400.0" y="341.0" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#F87171" text-anchor="middle" >A ROOM CAN'T TYPE</text><path d="M250 335 C160 335 135 300 135 190" fill="none" stroke="#C084FC" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.95"/><path d="M250 335 C160 335 135 300 135 190" fill="none" stroke="#F4F1E8" stroke-width="2.0" class="flow" opacity=".8"/><text x="50" y="408" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#F87171" text-anchor="start" >→ SIGNED OUT · panel: SIGN-IN FAILED</text><text x="50" y="438" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="start" >People's laptops sign in fine: newer passwords, and a person can answer.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>