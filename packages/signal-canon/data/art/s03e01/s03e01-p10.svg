<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e01-p10-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e01-p10-t">A teaching moment: Mei and Maya beside a board. A shared account is one login for many people. A named account is one person's. Password entropy is how unpredictable a password is, in bits. How do you count bits? Length times log-two of the symbols. Twelve random lowercase letters: twelve times log-two of twenty-six — about fifty-six bits. Length wins.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="170" y="26" width="460" height="164" rx="10" fill="#0B1220" stroke="#05070C" stroke-width="6" data-dg="1"/><text x="400" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#F4F1E8" text-anchor="middle" >H = L × log₂(N)</text><text x="400" y="146" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#A7F3D0" text-anchor="middle" >12 × log₂(26) ≈ 56 bits</text><use href="../defs.svg#f-mei-W-talk" x="30.0" y="190.0" width="168.8" height="270.0"/><use href="../defs.svg#f-maya-L-flat" x="600.0" y="200.0" width="162.5" height="260.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>