<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e01-p26-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e01-p26-t">Maya's first change-log entry at Aldermoor: Monday, 12 pilot rooms signed out; Friday's password-age policy hit room accounts; identity team moved 289 room accounts to a room policy with unique, rotated credentials; proof on the pilot ring and a real call, fleet zero failures; change template must list room accounts; sticky note shredded with Mei watching; owners Mei for identity, Maya for rooms.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="130" y="24" width="540" height="432" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="72" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#05070C" text-anchor="middle" >ROOMS · CHANGE LOG</text><text x="160" y="124" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >#1  Mon: 12 pilot rooms signed out.</text><text x="160" y="158" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Fri policy (pw age) → room accounts.</text><text x="160" y="204" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Identity team: 289 room accounts →</text><text x="160" y="238" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >room policy, unique + rotated.</text><text x="160" y="284" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#047857" text-anchor="start" >Proof: pilot ring + real call; fleet 0 fails.</text><text x="160" y="330" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >Change template: list room accounts.</text><text x="160" y="376" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#B45309" text-anchor="start" >Sticky note: shredded (Mei watched).</text><text x="160" y="422" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="600" fill="#0B1220" text-anchor="start" >Owners: Mei (identity) · Maya (rooms)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>