<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e01-p20-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e01-p20-t">Mei holds up an audit report excerpt: Finding 7 — one password for every meeting-room account, unchanged three years, found written on a note on the IT cupboard, floor 12. A photo of the sticky note is pinned to it.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="260" y="60" width="460" height="300" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="260" y="60" width="460" height="40" rx="8" fill="#1E293B"/><text x="276" y="87" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="800" fill="#93C5FD" text-anchor="start" >AUDIT REPORT · EXCERPT</text><text x="276" y="130" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#F87171" text-anchor="start" >AUDIT · FINDING 7</text><text x="276" y="161" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#E2E8F0" text-anchor="start" >One password for every</text><text x="276" y="192" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#E2E8F0" text-anchor="start" >meeting-room account.</text><text x="276" y="223" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#E2E8F0" text-anchor="start" >Unchanged 3 years.</text><text x="276" y="254" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FBBF24" text-anchor="start" >Found written on a note,</text><text x="276" y="285" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#FBBF24" text-anchor="start" >IT cupboard, floor 12.</text><g