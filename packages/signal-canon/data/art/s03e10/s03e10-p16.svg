<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e10-p16-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e10-p16-t">System View of the new update-ring design: ring 0, the lab, two rooms; ring 1, one room of every shape, five rooms; ring 2, a slice of forty rooms; ring 3, all four hundred. Ring 1 includes a standard room, a two-input room, a divisible room, a huddle room and a boardroom-type room, each with a far-end content check, a 24-hour watch, and a pause and rollback at every step.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><g class="sv"><rect x="20" y="20" width="760" height="440" rx="12" fill="#05070C" opacity=".9"/><text x="40" y="54" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#34D399" text-anchor="start" >UPDATE RINGS · v2 · ILLUSTRATIVE</text><rect x="40" y="90" width="168" height="150" rx="12" fill="#0F172A" stroke="#94A3B8" stroke-width="4"/><text x="124" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#94A3B8" text-anchor="middle" >RING 0</text><text x="124" y="164" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle" >lab</text><text x="124" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle" >2 rooms</text><line x1="210" y1="165" x2="218.0" y2="165.0" stroke="#F4F1E8" stroke-width="3"/><polygon points="226,165 213.4,171.1 213.4,158.9" fill="#F4F1E8"/><rect x="228" y="90" width="168" height="150" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="4"/><text x="312" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#34D399" text-anchor="middle" >RING 1</text><text x="312" y="164" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle" >one of every shape</text><text x="312" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle" >5 rooms</text><line x1="398" y1="165" x2="406.0" y2="165.0" stroke="#F4F1E8" stroke-width="3"/><polygon points="414,165 401.4,171.1 401.4,158.9" fill="#F4F1E8"/><rect x="416" y="90" width="168" height="150" rx="12" fill="#0F172A" stroke="#22D3EE" stroke-width="4"/><text x="500" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#22D3EE" text-anchor="middle" >RING 2</text><text x="500" y="164" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle" >a slice</text><text x="500" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle" >40 rooms</text><line x1="586" y1="165" x2="594.0" y2="165.0" stroke="#F4F1E8" stroke-width="3"/><polygon points="602,165 589.4,171.1 589.4,158.9" fill="#F4F1E8"/><rect x="604" y="90" width="168" height="150" rx="12" fill="#0F172A" stroke="#C084FC" stroke-width="4"/><text x="688" y="126" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#C084FC" text-anchor="middle" >RING 3</text><text x="688" y="164" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle" >the fleet</text><text x="688" y="200" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle" >all 400</text><rect x="40" y="262" width="720" height="120" rx="12" fill="#052E1F" stroke="#34D399" stroke-width="3"/><text x="60" y="294" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#BBF7D0" text-anchor="start" >RING 1 = standard · two-input · divisible · huddle · boardroom-type</text><text x="60" y="326" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="start" >Every exception type represented · far-end content check in each</text><text x="60" y="358" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="start" >24 h watch · pause and roll back at every step</text><text x="40" y="430" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FDE68A" text-anchor="start" >A ring of five identical rooms tests one room five times.</text></g><rect width="800" height="480" fill="url(#vignette)"/></svg>