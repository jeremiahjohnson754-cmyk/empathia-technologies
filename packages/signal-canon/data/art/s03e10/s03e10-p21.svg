<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e10-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e10-p21-t">A fleet query result late on Thursday: four rooms with more than one content input. The boardroom, pinned to IN 1. Harbor B and Studio, on the default. And Juniper — the pilot room for the new standard, version 1.0 — on the default.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg26" width="800" height="480"/><rect x="30" y="40" width="740" height="290" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="30" y="40" width="740" height="30" rx="8" fill="#1E3A8A"/><rect x="30" y="60" width="740" height="10" fill="#1E3A8A"/><text x="44" y="61" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="start" >FLEET QUERY · THURSDAY 22:10</text><text x="46" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#CBD5E1" text-anchor="start" >rooms with >1 content input: 4</text><text x="46" y="129" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#34D399" text-anchor="start" >Boardroom   pinned IN 1 ✓</text><text x="46" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#EF4444" text-anchor="start" >Harbor B    default  ✕</text><text x="46" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#EF4444" text-anchor="start" >Studio      default  ✕</text><text x="46" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#EF4444" text-anchor="start" >JUNIPER     default  ✕  (pilot · v1.0)</text><use href="../defs.svg#f-maya-S-surprised" x="600.0" y="290.0" width="118.8" height="190.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>