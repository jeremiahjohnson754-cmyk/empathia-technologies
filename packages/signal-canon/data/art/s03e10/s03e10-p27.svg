<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e10-p27-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e10-p27-t">In the dark, one printed page of the approved standard glows: section 5, network. Line 5.3: room devices, fixed addresses at the top of each automatic range. Proven at Riverbend.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#05070C"/><g transform="rotate(0 400.0 236.0)"><rect x="124" y="10" width="552" height="452" rx="22" fill="#FBBF24" opacity=".16"/><rect x="138" y="24" width="524" height="424" rx="14" fill="#FBBF24" opacity=".28"/><rect x="150" y="36" width="500" height="400" rx="4" fill="#F8FAFC" stroke="#05070C" stroke-width="5"/><rect x="150" y="36" width="500" height="46" rx="4" fill="#DBEAFE"/><text x="168" y="67" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#1E3A8A" text-anchor="start" >ROOM STANDARD v1.1 · §5 NETWORK</text><text x="170" y="120" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >5.1  One room segment per floor.</text><text x="170" y="155" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >5.2  Owner: Network (Priya).</text><text x="170" y="190" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >5.3  Room devices: fixed addresses</text><text x="170" y="225" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >       at the top of each automatic</text><text x="170" y="260" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >       range.</text><text x="170" y="295" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#B45309" text-anchor="start" >       (Proven at Riverbend.)</text><text x="170" y="330" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >5.4  Label both ends of every cable.</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>