<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e10-p23-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e10-p23-t">A laminated card on the office wall: If the far end can't see your screen — 30 seconds. Keep talking; check the far-end view; try the other labeled input; or join from your laptop; confirm with one person. Sam holds a stack of copies; Imani nods.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg24" width="800" height="480"/><rect x="250" y="70" width="300" height="220" rx="6" fill="#F8FAFC" stroke="#05070C" stroke-width="5"/><text x="400" y="104" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#B91C1C" text-anchor="middle" >IF THE FAR END CAN'T SEE</text><text x="400" y="128" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="800" fill="#B91C1C" text-anchor="middle" >YOUR SCREEN · 30 s</text><text x="272" y="164" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start" >1 Keep talking.</text><text x="272" y="190" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start" >2 Check the far-end view.</text><text x="272" y="216" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start" >3 Try the other labeled input.</text><text x="272" y="242" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start" >4 Or: join from your laptop.</text><text x="272" y="268" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start" >5 Confirm with one person.</text><use href="../defs.svg#f-sam-R-smile" x="30.0" y="196.0" width="170.0" height="272.0"/><use href="../defs.svg#f-imani-N-smile" x="590.0" y="196.0" width="170.0" height="272.0"/><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>