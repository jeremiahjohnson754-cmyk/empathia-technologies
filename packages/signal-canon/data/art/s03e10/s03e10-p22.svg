<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e10-p22-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e10-p22-t">The standard's revised page, version 1.1, section 3: two content inputs, table and wall, for reach; 3.4.1, content capture input set explicitly per room, never default; 3.4.2, checked in ring 1 after every update.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><g transform="rotate(0 400.0 240.0)"><rect x="140" y="30" width="520" height="420" rx="4" fill="#F8FAFC" stroke="#05070C" stroke-width="5"/><rect x="140" y="30" width="520" height="46" rx="4" fill="#DBEAFE"/><text x="158" y="61" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="800" fill="#1E3A8A" text-anchor="start" >ROOM STANDARD v1.1 · §3 VIDEO</text><text x="160" y="114" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >3.4    Two content inputs:</text><text x="160" y="149" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" >        table + wall (reach).</text><text x="160" y="184" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#047857" text-anchor="start" >3.4.1  Content capture input:</text><text x="160" y="219" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#047857" text-anchor="start" >        set explicitly, per room.</text><text x="160" y="254" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#047857" text-anchor="start" >        Never “default.”</text><text x="160" y="289" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight=