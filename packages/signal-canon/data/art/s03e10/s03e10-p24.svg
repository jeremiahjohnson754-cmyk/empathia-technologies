<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s03e10-p24-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s03e10-p24-t">Friday: the update re-run through the new ring 1 — a standard room, a two-input room, a divisible room, a huddle room and a boardroom-type room, each with the far-end content check passed. Fleet query: zero unpinned multi-input rooms. Sam, on his phone as the far end, grins.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg26" width="800" height="480"/><rect x="30" y="40" width="740" height="300" rx="8" fill="#0B1220" stroke="#05070C" stroke-width="5"/><rect x="30" y="40" width="740" height="30" rx="8" fill="#047857"/><rect x="30" y="60" width="740" height="10" fill="#047857"/><text x="44" y="61" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" text-anchor="start" >UPDATE · RING 1 v2 · FRIDAY</text><text x="46" y="95" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#34D399" text-anchor="start" >Standard (Aspen)    far end ✓</text><text x="46" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#34D399" text-anchor="start" >Two-input (Juniper) far end ✓</text><text x="46" y="159" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#34D399" text-anchor="start" >Divisible (Harbor)  far end ✓</text><text x="46" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#34D399" text-anchor="start" >Huddle (Fern)       far end ✓</text><text x="46" y="223" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700" fill="#34D39