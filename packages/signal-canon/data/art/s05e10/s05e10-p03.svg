<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e10-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e10-p03-t">The arena, full. In the interpreter's booth at the side, the Spanish interpreter strains to hear; a callout shows what she hears — fragments of the reader's words under cheering. Her booth feed is the arena PA mix.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><use href="../defs.svg#bg79" width="800" height="480"/><rect x="600" y="300" width="170" height="130" rx="8" fill="#0F172A" stroke="#FBBF24" stroke-width="4"/><rect x="612" y="312" width="146" height="106" rx="4" fill="#1E293B"/><circle cx="685" cy="357" r="18" fill="#94A3B8"/><path d="M647 418 Q685 365 723 418 Z" fill="#94A3B8"/><text x="685" y="460" font-family="Work Sans, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FDE68A" text-anchor="middle" >INTERPRETER BOOTH</text><rect x="30" y="130" width="480" height="96" rx="10" fill="#0F172A" stroke="#F87171" stroke-width="4"/><text x="270" y="170" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FCA5A5" text-anchor="middle" >“…and… (cheering) …Dr…?”</text><text x="270" y="208" font-family="Work Sans, system-ui, sans-serif" font-size="21" font-weight="700" fill="#E2E8F0" text-anchor="middle" >booth feed = arena PA mix</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>