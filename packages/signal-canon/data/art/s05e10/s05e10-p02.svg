</text><text x="595.0" y="155.0" font-family="Work Sans, system-ui, sans-serif" font-size="19" font-weight="700" fill="#E2E8F0" text-anchor="middle" >via hub · direct path ready</text><text x="400" y="350" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#6EE7B7" text-anchor="middle" >captions ✓   Spanish ✓   campus time: 3 sources ✓</text><text x="400" y="400" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="800" fill="#FDE68A" text-anchor="middle" >run-of-show p.6: if the hub tears → direct path</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>