<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s10e09-p03-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s10e09-p03-t">A backup sheet. Left: over nineteen days, a red line of data written climbing to about 2.3 TB in weekday steps; an amber dashed line of what a 72 GB nightly upload could have carried, climbing more slowly; and a flat grey line — what was actually copied off-site. Right: the session drive; a mirror marked ‘copies deletions’; off-site: none; the cloud: stopped, quota full.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >THE ALBUM · WHERE THE COPIES ARE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#FB923C" text-anchor="end" >BK-09</text><rect x="90" y="64" width="300" height="200" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="90.0" y1="64" x2="90.0" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="90.0" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >0</text><line x1="168.9" y1="64" x2="168.9" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="168.9" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >5</text><line x1="247.9" y1="64" x2="247.9" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="247.9" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >10</text><line x1="326.8" y1="64" x2="326.8" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="326.8" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >15</text><line x1="390.0" y1="64" x2="390.0" y2="264" stroke="#E2E8F0" stroke-width="1"/><text x="390.0" y="281" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" >19</text><line x1="90" y1="264.0" x2="390" y2="264.0" stroke="#E2E8F0" stroke-width="1"/><text x="84" y="268.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >0</text><line x1="90" y1="184.0" x2="390" y2="184.0" stroke="#E2E8F0" stroke-width="1"/><text x="84" y="188.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >1</text><line x1="90" y1="104.0" x2="390" y2="104.0" stroke="#E2E8F0" stroke-width="1"/><text x="84" y="108.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="end" >2</text><text x="240.0" y="298" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" text-anchor="middle" >days since the off-site copy stopped</text><text x="46" y="164.0" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" text-anchor="middle" transform="rotate(-90 46 164.0)">TB</text><path d="M90.0 264.0 L105.8 264.0 L121.6 250.7 L137.4 237.4 L153.2 224.2 L168.9 210.9 L184.7 197.6 L200.5 197.6 L216.3 197.6 L232.1 184.3 L247.9 171.0 L263.7 157.8 L279.5 144.5 L295.3 131.2 L311.1 131.2 L326.8 131.2 L342.6 117.9 L358.4 104.6 L374.2 91.4 L390.0 78.1" stroke="#DC2626" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M90.0 264.0 L105.8 258.2 L121.6 252.5 L137.4 246.7 L153.2 241.0 L168.9 235.2 L184.7 229.4 L200.5 223.7 L216.3 217.9 L232.1 212.2 L247.9 206.4 L263.7 200.6 L279.5 194.9 L295.3 189.1 L311.1 183.4 L326.8 177.6 L342.6 171.8 L358.4 166.1 L374.2 160.3 L390.0 154.6" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M90.0 264.0 L390.0 264.0" stroke="#64748B" stroke-width="3" fill="none" stroke-linejoin="round"/><text x="90" y="50" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="start" >red: written · amber dashed: what 72 GB a night could carry · grey: copied off-site</text><rect x="450" y="60" width="140" height="64" rx="8" fill="#1E293B" stroke="#16A34A" stroke-width="4"/><circle cx="574" cy="110" r="6" fill="#16A34A"/><text x="520" y="88" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" text-anchor="middle" >SESSION DRIVE</text><text x="512" y="110" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle" >working copy</text><rect x="600" y="60" width="140" height="64" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="4"/><circle cx="724" cy="110" r="6" fill="#F59E0B"/><text x="670" y="88" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" text-anchor="middle" >MIRROR</text><text x="662" y="110" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle" >copies deletions</text><rect x="450" y="170" width="140" height="64" rx="8" fill="#1E293B" stroke="#DC2626" stroke-width="4"/><circle cx="574" cy="220" r="6" fill="#DC2626"/><text x="520" y="198" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" text-anchor="middle" >OFF-SITE</text><text x="512" y="220" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle" >none</text><rect x="600" y="170" width="140" height="64" rx="8" fill="#1E293B" stroke="#DC2626" stroke-width="4"/><circle cx="724" cy="220" r="6" fill="#DC2626"/><text x="670" y="198" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" text-anchor="middle" >CLOUD</text><text x="662" y="220" font-family="Work Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle" >stopped · quota</text><text x="595" y="262" font-family="Work Sans, system-ui, sans-serif" font-size="12" font-weight="800" fill="#B91C1C" text-anchor="middle" >cloud restore at 100 Mb/s ≈ 3.7 days</text><text x="400" y="318" font-family="Work Sans, system-ui, sans-serif" font-size="16" font-weight="900" fill="#B91C1C" text-anchor="middle" >≈ 2.3 TB of the album in one building · the upload could never have kept up</text><text x="400" y="346" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" >166 GB written per tracking day · 20 Mb/s × 8 h = 72 GB a night</text><text x="400" y="394" font-family="Work Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" >illustrative (RV-177)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>