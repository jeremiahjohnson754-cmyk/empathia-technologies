<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e05-p13-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e05-p13-t">The booth whiteboard: P equals V times I. One example 20-amp circuit at 120 volts: 2,400 watts. They asked for 2,700 watts, which is 22.5 amps. The breaker did its job. Illustrative; the electrician has the real numbers.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0C1424"/><rect x="40" y="30" width="720" height="400" rx="10" fill="#F4F6F8" stroke="#05070C" stroke-width="6"/><text x="80" y="100" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="42" font-weight="700" fill="#0B1220" text-anchor="start" >P = V × I</text><text x="80" y="160" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#0B1220" text-anchor="start" >one 20 A circuit at 120 V (example):</text><text x="80" y="206" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="32" font-weight="700" fill="#0B1220" text-anchor="start" >120 V × 20 A = 2,400 W</text><text x="80" y="262" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#DC2626" text-anchor="start" >we asked for 2,700 W → 2,700 ÷ 120 = 22.5 A</text><text x="80" y="330" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="32" font-weight="700" fill="#047857" text-anchor="start" >The breaker did its job.</text><text x="80" y="390" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="20" font-weight="700" fill="#64748B" text-anchor="start" >(illustrative · the electrician has the real numbers)</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>