t cmdr</text><text x="360" y="238" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start" >paging: ‘please stay where you are’</text><text x="60" y="274" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start" >3:30</text><text x="210" y="274" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" >Comms</text><text x="360" y="274" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" text-anchor="start" >holding statement</text><text x="400" y="388" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="900" fill="#15803D" text-anchor="middle" >re-run without Maya: 210 s to paging</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>