<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s09e08-p04-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s09e08-p04-t">The runbook by role: 0:00 anyone reports to the duty manager; 1:00 the incident commander decides to hold and orders the screens dark; 2:30 facilities cut signage power, or two AV staff blank the CMS; 2:30 security takes the account and keeps the logs; 3:30 the incident commander pages ‘please stay where you are’; 3:30 communications issue a holding statement. Footer: re-run without Maya, 210 s to paging.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="30" y="20" width="740" height="440" fill="#F8FAFC" stroke="#334155" stroke-width="4" data-dg="1"/><rect x="30" y="416" width="740" height="44" fill="#E2E8F0" stroke="#334155" stroke-width="2"/><text x="44" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="start" >RUNBOOK · WRONG MESSAGE ON SCREENS · BY ROLE</text><text x="756" y="444" font-family="Work Sans, system-ui, sans-serif" font-size="22" font-weight="900" fill="#DB2777" text-anchor="end" >IR-08</text><text x="60" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#64748B" text-anchor="start" >TIME</text><text x="210" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#64748B" text-anchor="start" >SOURCE</text><text x="360" y="62" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="900" fill="#64748B" text-anchor="start" >EVENT</text><text x="60" y="94" font-family="ui-monospace,monospace" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start" >0:00</text><text x="210" y="94" font-f