<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s05e09-p06-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s05e09-p06-t">The one-page plan: X-series boards under warranty, twelve large-hall projectors, a six-projector spares pool, monitoring — expected failures about five instead of fifteen, with assumptions listed.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#0B1220"/><rect x="40" y="40" width="720" height="360" rx="10" fill="#F8FAFC" stroke="#05070C" stroke-width="4"/><text x="400" y="92" font-family="Work Sans, system-ui, sans-serif" font-size="28" font-weight="900" fill="#0F172A" text-anchor="middle" >PROJECTOR PLAN · NEXT YEAR</text><text x="80" y="150" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start" >1 · X-series boards · warranty · $2k</text><text x="80" y="196" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start" >2 · 12 large-hall projectors · $30k</text><text x="80" y="242" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start" >3 · 6-projector spares pool · $12k</text><text x="80" y="288" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="start" >4 · hours & lamp alerts · $4k</text><text x="80" y="334" font-family="Work Sans, system-ui, sans-serif" font-size="24" font-weight="800" fill="#047857" text-anchor="start" >expected failures: ~5 (was 15) · assumptions ↓</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>