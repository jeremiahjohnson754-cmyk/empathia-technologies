<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s01e10-p20-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s01e10-p20-t">Change log entry #10: '10:41:05 dip 2.1 s (UPS log). Processor to 00 SAFE START, muted. Recovered by card and Ray's password. Silent 5:07. No thump. Facilities to the utility and Andre. DEBT-011 to April. DEBT-002: open.'</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><rect x="160" y="30" width="480" height="420" rx="8" fill="#F4F1E8" stroke="#05070C" stroke-width="6"/><text x="400" y="80" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="30" font-weight="700" fill="#05070C" text-anchor="middle" >BOOTH CHANGE LOG</text><text x="190" y="136" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >#10  10:41:05 dip 2.1 s (UPS log).</text><text x="190" y="170" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >Processor → 00 SAFE START, muted.</text><text x="190" y="218" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#047857" text-anchor="start" >Recovered by card + Ray's pw.</text><text x="190" y="252" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#047857" text-anchor="start" >Silent 5:07. No thump.</text><text x="190" y="300" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#0B1220" text-anchor="start" >Facilities → utility + Andre.</text><text x="190" y="348" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="600" fill="#B45309" text-anchor="start" >DEBT-011 → April. DEBT-002: open.</text><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>