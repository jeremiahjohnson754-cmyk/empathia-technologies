<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="s02e06-p21-t" preserveAspectRatio="xMidYMid meet"><style>.panel-wash{fill:#22D3EE}text{font-family:"Work Sans",system-ui,sans-serif}</style><title id="s02e06-p21-t">Maya's notebook: Flip plan v2. 1, the sensor lead is the hotel's; tell the wall crew it comes out and who re-plugs. 2, feed both plates before any flip. 3, a state change is a change; count it in. 4, verify in both rooms. New label: Unplug me, then call Maya.</title><rect class="panel-wash" width="800" height="480" opacity="0.18"/><rect width="800" height="480" fill="#101826"/><g transform="rotate(-2 395.0 235.0)"><rect x="160" y="70" width="470" height="330" rx="6" fill="#F4F1E8" stroke="#05070C" stroke-width="5"/><line x1="174" y1="118" x2="616" y2="118" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="154" x2="616" y2="154" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="190" x2="616" y2="190" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="226" x2="616" y2="226" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="262" x2="616" y2="262" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="298" x2="616" y2="298" stroke="#9FB3C8" stroke-width="1.5"/><line x1="174" y1="334" x2="616" y2="334" stroke="#9FB3C8" stroke-width="1.5"/><line x1="204" y1="78" x2="204" y2="392" stroke="#E57373" stroke-width="2"/><text x="214" y="112" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#0B1220" text-anchor="start" >FLIP PLAN v2 · ballroom</text><text x="214" y="148" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#0B1220" text-anchor="start" >1. Sensor lead = HOTEL'S. Tell the</text><text x="214" y="184" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#0B1220" text-anchor="start" >   wall crew it comes out. Who re-plugs?</text><text x="214" y="220" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#047857" text-anchor="start" >2. Feed BOTH plates before any flip</text><text x="214" y="256" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#047857" text-anchor="start" >3. State change = a change: count it in</text><text x="214" y="292" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#047857" text-anchor="start" >4. Verify in BOTH rooms</text><text x="214" y="328" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="19" font-weight="600" fill="#B45309" text-anchor="start" >Label: “UNPLUG ME, THEN CALL MAYA”</text></g><rect width="800" height="480" fill="url(#halftone)" opacity="0.35"/><rect width="800" height="480" fill="url(#vignette)"/></svg>