# Render Blueprint — PHASE 1 ONLY: the two public, synthetic, unauthenticated sites. Free static sites; no database, no API, no secrets.
# The authenticated enterprise application is deliberately NOT in this file (it is Phase 2: deploy/render/enterprise.render.yaml,
# applied only after its approvals and checks — docs/operations/RENDER_DEPLOYMENT.md).
#
#   empathia-website  — the public marketing site (pre-rendered pages). Lead forms say "not configured" and never pretend to send until
#                       WEBSITE_API_URL names the enterprise API (Phase 2), at which point connect-src in its CSP must name that origin too.
#   empathia-demo     — the shareable investor demonstration: synthetic data only, runs entirely in the browser (no API calls),
#                       not indexed by search engines. Its external distribution is an owner decision (RELEASE_ACCEPTANCE_CRITERIA S11).
#
# Fields follow https://render.com/docs/blueprint-spec (static sites: type web + runtime static; region and plan do not apply).
# Security (docs/security/ASSESSMENT_2026-11-04.md): the headers below are the policy of scripts/security/policy.mjs, which the builds also
# write into every page as a <meta> CSP; tests/security/public-sites.test.mjs proves the two agree. These headers and routes apply only to
# the services this Blueprint manages; a static site created through the API (empathia-website-next, empathia-demo-next) needs them set
# on the service itself (scripts/security/render-headers.mjs prints and, with RENDER_API_KEY in the environment, applies them).
# Install: no lockfile is committed yet, so --frozen-lockfile cannot be used; dependency lifecycle scripts never run (--ignore-scripts), and
# pnpm-workspace.yaml refuses versions published in the last 24 hours (minimumReleaseAge). Commit pnpm-lock.yaml and switch to
# --frozen-lockfile as soon as a connected machine can produce it.
services:
  - type: web
    runtime: static
    name: empathia-website
    branch: main
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --no-frozen-lockfile --ignore-scripts && node scripts/build.mjs --public
    staticPublishPath: apps/website/dist
    envVars:
      - key: SKIP_INSTALL_DEPS          # Render's automatic npm install cannot resolve pnpm workspace:* links; the build command installs
        value: "true"
      - key: NODE_VERSION
        value: "22.22.0"
      # WEBSITE_BASE_URL defaults to RENDER_EXTERNAL_URL (sitemap, robots); set it when a custom domain is added.
      # WEBSITE_API_URL stays unset until the enterprise API exists (Phase 2).
    # Product pages follow the nine (D42): superseded addresses redirect permanently (same map as apps/website/redirects.json; the
    # website's 404.html explains them too). Unknown paths get the site's 404.html.
    routes:
      - type: redirect
        source: /products/scouter
        destination: /products/lite#scouter
      - type: redirect
        source: /products/assurance-apex
        destination: /products/apex
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin

  - type: web
    runtime: static
    name: empathia-demo
    branch: main
    autoDeployTrigger: commit
    buildCommand: npx --yes pnpm@10.18.3 install --no-frozen-lockfile --ignore-scripts && node scripts/build.mjs --public
    staticPublishPath: apps/demo/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: "22.22.0"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
